<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EPUB Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f3f6fb;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }
      .epub-shell {
        flex: 1;
        display: flex;
        min-height: 100%;
        height: 100%;
        background: #f7f9fd;
      }
      .epub-viewer-wrap {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow: hidden;
        padding: 12px 12px 16px;
        box-sizing: border-box;
      }
      #epub-viewer {
        flex: 1;
        width: 100%;
        height: 100%;
        background: white;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      }

      @media (max-width: 767px) {
        .epub-shell {
          background: #ffffff;
        }
        .epub-viewer-wrap {
          padding: 8px 8px 12px;
        }
      }

      @media (min-width: 768px) and (max-width: 1024px) {
        .epub-viewer-wrap {
          padding: 16px 16px 22px;
        }
      }

      @media (min-width: 1025px) {
        .epub-viewer-wrap {
          padding: 18px 18px 24px;
        }
      }
      .epub-error {
        margin: auto;
        padding: 24px;
        color: #7a1f1f;
        background: #fff1f0;
        border: 1px solid #f3c6c4;
        border-radius: 12px;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <div class="epub-shell">
      <div class="epub-viewer-wrap">
        <div id="epub-viewer"></div>
      </div>
    </div>

    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://unpkg.com/epubjs@0.3.93/dist/epub.min.js"></script>
    <script>
      (() => {
        console.log("[EPUB Viewer] Script loaded, checking ePub availability");
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get("file");
        const viewer = document.getElementById("epub-viewer");
        const shell = document.querySelector(".epub-shell");

        console.log("[EPUB Viewer] fileUrl:", fileUrl);

        if (!fileUrl) {
          shell.innerHTML = '<div class="epub-error">No EPUB file source was provided.</div>';
          return;
        }

        const resolvedFileUrl = fileUrl;

        // Extract location fragment for chapter navigation (e.g., #chapter1.xhtml)
        const locationMatch = resolvedFileUrl.match(/#(.+)$/);
        const initialLocation = locationMatch ? locationMatch[1] : null;
        console.log("[EPUB Viewer] initialLocation:", initialLocation);

        if (!window.ePub || !window.ePub.Book) {
          console.error("[EPUB Viewer] EPUB.js not available:", window.ePub);
          shell.innerHTML = '<div class="epub-error">EPUB.js failed to load. Please retry.</div>';
          return;
        }
        console.log("[EPUB Viewer] EPUB.js is available");

        let epubBook = null;
        let rendition = null;
        let loaded = false;

        const showError = (msg) => {
          shell.innerHTML = `<div class="epub-error">${msg}</div>`;
        };

        const loadEpubFromSource = async (source) => {
          if (loaded) return;
          loaded = true;
          console.log("[EPUB Viewer] Loading from source:", typeof source === "string" ? "URL" : "ArrayBuffer");
          try {
            epubBook = window.ePub(source, {
              storage: false,
            });
            console.log("[EPUB Viewer] EPUB book created");
            rendition = epubBook.renderTo("epub-viewer", {
              width: "100%",
              height: "100%",
              flow: "scrolled",
              spread: "none",
            });
            console.log("[EPUB Viewer] Rendition created");

            // Display initial location if provided, otherwise start from beginning
            if (initialLocation) {
              console.log("[EPUB Viewer] Displaying initial location:", initialLocation);
              await rendition.display(initialLocation);
            } else {
              console.log("[EPUB Viewer] Displaying from beginning");
              await rendition.display();
            }

            console.log("[EPUB Viewer] Display successful");

            // Force a resize to ensure content renders
            setTimeout(() => {
              console.log("[EPUB Viewer] Forcing resize");
              rendition.resize();
            }, 500);

            try {
              window.parent?.postMessage({ type: "epub-viewer:ready", url: resolvedFileUrl }, "*");
            } catch {}
          } catch (err) {
            console.error("[EPUB Viewer] Load error:", err);
            loaded = false;
            showError("Unable to load the EPUB in the browser viewer. Error: " + (err?.message || String(err)));
          }
        };

        window.addEventListener(
          "message",
          (event) => {
            console.log("[EPUB Viewer] Received message:", event.data);
            const data = event.data && typeof event.data === "object" ? event.data : null;
            if (!data || data.target !== "epub-viewer") {
              console.log("[EPUB Viewer] Message ignored - target mismatch or null data");
              return;
            }
            console.log("[EPUB Viewer] Processing message type:", data.type);
            if (data.type === "load-buffer") {
              if (data.url && data.url !== resolvedFileUrl) {
                console.log("[EPUB Viewer] URL mismatch:", data.url, "vs", resolvedFileUrl);
                return;
              }
              if (data.buffer instanceof ArrayBuffer) {
                console.log("[EPUB Viewer] Loading from ArrayBuffer, size:", data.buffer.byteLength);
                loadEpubFromSource(data.buffer.slice(0));
              } else if (typeof data.url === "string" && !loaded) {
                console.log("[EPUB Viewer] Loading from URL:", data.url);
                loadEpubFromSource(data.url);
              } else {
                console.log("[EPUB Viewer] No valid buffer or URL provided");
              }
            } else if (data.type === "goto-location") {
              if (!epubBook || !rendition) {
                console.log("[EPUB Viewer] goto-location: book or rendition not ready");
                return;
              }
              const location = data.location;
              if (typeof location === "string" && location) {
                console.log("[EPUB Viewer] Navigating to location:", location);
                try {
                  rendition.display(location);
                } catch (err) {
                  console.error("[EPUB Viewer] Navigation error:", err);
                }
              }
            }
          },
        );

        // Note: The parent component (CourseEpubStep.tsx) is responsible for fetching
        // and sending the EPUB buffer via postMessage. This eliminates double-downloads
        // and enables client-side caching (memory + IndexedDB).
      })();
    </script>
  </body>
</html>
