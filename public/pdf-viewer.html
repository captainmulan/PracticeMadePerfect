<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f3f6fb;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }
      .pdf-shell {
        flex: 1;
        display: flex;
        min-height: 100%;
        height: 100%;
        background: #f7f9fd;
      }
      .pdf-canvas-wrap {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow: hidden;
        padding: 12px 12px 16px;
        box-sizing: border-box;
      }
      canvas {
        display: block;
        margin: 0 auto 8px;
        max-width: 100%;
        height: auto;
        background: white;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
        /* Let the HiDPI bitmap downsample; crisp-edges blurs vector-like PDF text. */
        image-rendering: auto;
      }

      @media (max-width: 767px) {
        .pdf-shell {
          background: #ffffff;
        }
        .pdf-canvas-wrap {
          padding: 8px 8px 12px;
        }
      }

      @media (min-width: 768px) and (max-width: 1024px) {
        .pdf-canvas-wrap {
          padding: 16px 16px 22px;
        }
      }

      @media (min-width: 1025px) {
        .pdf-canvas-wrap {
          padding: 18px 18px 24px;
        }
      }
      .pdf-error {
        margin: auto;
        padding: 24px;
        color: #7a1f1f;
        background: #fff1f0;
        border: 1px solid #f3c6c4;
        border-radius: 12px;
        max-width: 640px;
      }
    </style>
  </head>
  <body>
    <div class="pdf-shell">
      <div class="pdf-canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get("file");
        const canvas = document.getElementById("pdf-canvas");
        const shell = document.querySelector(".pdf-shell");

        if (!fileUrl) {
          shell.innerHTML = '<div class="pdf-error">No PDF file source was provided.</div>';
          return;
        }

        const pageMatch = fileUrl.match(/#page=(\d+)/i) ?? fileUrl.match(/\?page=(\d+)/i);
        let currentPage = Number.parseInt(pageMatch?.[1] ?? "1", 10);
        const resolvedFileUrl = fileUrl.replace(/#page=\d+/i, "").replace(/\?page=\d+/i, "");

        if (!window.pdfjsLib || !window.pdfjsLib.getDocument) {
          shell.innerHTML = '<div class="pdf-error">PDF.js failed to load. Please retry.</div>';
          return;
        }

        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        let pdfDoc = null;
        let renderToken = 0;
        let loaded = false;
        currentPage = Math.max(1, Number.isFinite(currentPage) ? currentPage : 1);

        /* Keep only current ± 2 rendered bitmaps in memory (5 pages). The full PDF
           document still lives in pdf.js — we only window the expensive canvases. */
        const PAGE_WINDOW = 2;
        const MAX_CANVAS_PIXELS = 16777216;
        const pageCache = new Map();
        let lastLayoutKey = "";
        let prefetchTimer = 0;

        const layoutKey = () =>
          `${shell.clientWidth}x${window.innerHeight}@${window.devicePixelRatio || 1}`;

        const pagesInWindow = (center) => {
          if (!pdfDoc) return [];
          const pages = [];
          for (let i = center - PAGE_WINDOW; i <= center + PAGE_WINDOW; i += 1) {
            if (i >= 1 && i <= pdfDoc.numPages) pages.push(i);
          }
          return pages;
        };

        const releaseEntry = (entry) => {
          if (!entry?.canvas) return;
          entry.canvas.width = 0;
          entry.canvas.height = 0;
        };

        const prunePageCache = (center) => {
          const keep = new Set(pagesInWindow(center));
          const key = lastLayoutKey || layoutKey();
          for (const [pageNum, entry] of pageCache.entries()) {
            const staleLayout = entry.status === "ready" && entry.key !== key;
            if (!keep.has(pageNum) || staleLayout) {
              if (entry.status === "ready") releaseEntry(entry);
              pageCache.delete(pageNum);
            }
          }
        };

        const computeLayout = (page) => {
          const isMobile = window.matchMedia("(max-width: 767px)").matches;
          const isTablet = window.matchMedia("(min-width: 768px) and (max-width: 1024px)").matches;
          const baseViewport = page.getViewport({ scale: 1 });
          const padX = isMobile ? 18 : isTablet ? 32 : 36;
          const padY = isMobile ? 150 : isTablet ? 120 : 115;
          const maxCssW = isMobile ? 420 : isTablet ? 740 : 840;
          const maxCssH = isMobile ? 720 : isTablet ? 980 : 1100;
          const targetWidth = Math.max(120, Math.min(shell.clientWidth - padX, maxCssW));
          const targetHeight = Math.max(160, Math.min(window.innerHeight - padY, maxCssH));
          const fitScale = Math.min(targetWidth / baseViewport.width, targetHeight / baseViewport.height);
          const cssScale = Math.max(0.5, fitScale);
          const viewport = page.getViewport({ scale: cssScale });
          const cssWidth = Math.floor(viewport.width);
          const cssHeight = Math.floor(viewport.height);

          /* Official pdf.js HiDPI path: physical canvas = CSS size × devicePixelRatio. */
          let outputScale = Math.max(1, window.devicePixelRatio || 1);
          const pixels = cssWidth * outputScale * cssHeight * outputScale;
          if (pixels > MAX_CANVAS_PIXELS) {
            outputScale *= Math.sqrt(MAX_CANVAS_PIXELS / pixels);
          }

          return { viewport, outputScale, cssWidth, cssHeight, key: layoutKey() };
        };

        const blitToVisible = (entry) => {
          canvas.width = entry.canvas.width;
          canvas.height = entry.canvas.height;
          canvas.style.width = `${entry.cssWidth}px`;
          canvas.style.height = `${entry.cssHeight}px`;
          const context = canvas.getContext("2d", { alpha: false, desynchronized: true });
          context.imageSmoothingEnabled = true;
          context.imageSmoothingQuality = "high";
          context.drawImage(entry.canvas, 0, 0);
        };

        const renderPageToEntry = async (pageNumber) => {
          const page = await pdfDoc.getPage(pageNumber);
          const { viewport, outputScale, cssWidth, cssHeight, key } = computeLayout(page);
          const off = document.createElement("canvas");
          off.width = Math.max(1, Math.floor(viewport.width * outputScale));
          off.height = Math.max(1, Math.floor(viewport.height * outputScale));
          const context = off.getContext("2d", { alpha: false });
          const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;
          await page.render({ canvasContext: context, transform, viewport }).promise;
          return { status: "ready", canvas: off, cssWidth, cssHeight, outputScale, key };
        };

        const cachePage = async (pageNumber) => {
          if (!pdfDoc) return null;
          const existing = pageCache.get(pageNumber);
          if (existing?.status === "ready" && existing.key === lastLayoutKey) {
            return existing;
          }
          if (existing?.status === "loading") {
            return existing.promise;
          }
          const promise = renderPageToEntry(pageNumber)
            .then((entry) => {
              const keep = new Set(pagesInWindow(currentPage));
              if (!keep.has(pageNumber) || entry.key !== layoutKey()) {
                releaseEntry(entry);
                if (pageCache.get(pageNumber)?.promise === promise) {
                  pageCache.delete(pageNumber);
                }
                return null;
              }
              pageCache.set(pageNumber, entry);
              return entry;
            })
            .catch((err) => {
              if (pageCache.get(pageNumber)?.promise === promise) {
                pageCache.delete(pageNumber);
              }
              throw err;
            });
          pageCache.set(pageNumber, { status: "loading", promise });
          return promise;
        };

        const prefetchNeighbors = (center) => {
          window.clearTimeout(prefetchTimer);
          prefetchTimer = window.setTimeout(() => {
            for (const pageNum of pagesInWindow(center)) {
              if (pageNum === center) continue;
              const hit = pageCache.get(pageNum);
              if (hit?.status === "ready" && hit.key === lastLayoutKey) continue;
              if (hit?.status === "loading") continue;
              void cachePage(pageNum);
            }
          }, 80);
        };

        const renderPage = async (pageNumber) => {
          if (!pdfDoc) return;
          const myToken = ++renderToken;
          lastLayoutKey = layoutKey();
          prunePageCache(pageNumber);

          const cached = pageCache.get(pageNumber);
          if (cached?.status === "ready" && cached.key === lastLayoutKey) {
            if (myToken !== renderToken) return;
            blitToVisible(cached);
            prefetchNeighbors(pageNumber);
            return;
          }

          const entry = await cachePage(pageNumber);
          if (myToken !== renderToken || !entry) return;
          blitToVisible(entry);
          prefetchNeighbors(pageNumber);
        };

        const showError = (msg) => {
          shell.innerHTML = `<div class="pdf-error">${msg}</div>`;
        };

        const loadPdfFromSource = async (source) => {
          if (loaded) return;
          loaded = true;
          try {
            pdfDoc = await window.pdfjsLib.getDocument(source).promise;
            currentPage = Math.min(Math.max(1, currentPage), pdfDoc.numPages);
            await renderPage(currentPage);
            try {
              window.parent?.postMessage({ type: "pdf-viewer:ready", numPages: pdfDoc.numPages, url: resolvedFileUrl }, "*");
            } catch {}
          } catch (err) {
            loaded = false;
            showError("Unable to load the PDF in the browser viewer.");
          }
        };

        window.addEventListener(
          "message",
          (event) => {
            const data = event.data && typeof event.data === "object" ? event.data : null;
            if (!data || data.target !== "pdf-viewer") return;
            if (data.type === "load-buffer") {
              if (data.url && data.url !== resolvedFileUrl) return;
              if (data.buffer instanceof ArrayBuffer) {
                loadPdfFromSource({ data: data.buffer.slice(0) });
              } else if (typeof data.url === "string" && !loaded) {
                loadPdfFromSource(data.url);
              }
            } else if (data.type === "goto-page") {
              const n = Math.floor(Number(data.page));
              if (!Number.isFinite(n) || !pdfDoc) return;
              currentPage = Math.min(Math.max(1, n), pdfDoc.numPages);
              void renderPage(currentPage);
            }
          },
        );

        let resizeTimer = 0;
        const onViewportChange = () => {
          if (!pdfDoc) return;
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(() => {
            if (layoutKey() === lastLayoutKey) return;
            lastLayoutKey = layoutKey();
            prunePageCache(currentPage);
            void renderPage(currentPage);
          }, 120);
        };
        window.addEventListener("resize", onViewportChange);
        window.visualViewport?.addEventListener("resize", onViewportChange);
        try {
          matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener("change", onViewportChange);
        } catch {
          /* older browsers */
        }

        // Note: The parent component (CoursePdfStep.tsx) is responsible for fetching
        // and sending the PDF buffer via postMessage. This eliminates double-downloads
        // and enables client-side caching (memory + IndexedDB).
      })();
    </script>
  </body>
</html>
