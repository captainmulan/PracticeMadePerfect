<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #f3f6fb;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }
      .pdf-shell {
        flex: 1;
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 0;
        background: #f7f9fd;
      }
      .pdf-canvas-wrap {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        overflow-x: auto;
        overflow-y: auto;
        padding: 0;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        min-height: 0;
        -webkit-overflow-scrolling: touch;
      }
      /* Focus: keep native pan/scroll (swipe) — do not lock overflow. */
      .pdf-canvas-wrap.is-soft-focus {
        touch-action: pan-x pan-y;
        overscroll-behavior: contain;
      }
      canvas {
        display: block;
        margin: 0;
        background: white;
        box-shadow: none;
        image-rendering: auto;
        transform: translateZ(0);
        flex: 0 0 auto;
        will-change: transform;
      }
      @media (max-width: 767px) {
        .pdf-shell {
          background: #ffffff;
        }
        .pdf-canvas-wrap {
          padding: 0;
          background: #ffffff;
        }
      }
      .pdf-error {
        margin: auto;
        padding: 24px;
        color: #7a1f1f;
        background: #fff1f0;
        border: 1px solid #f3c6c4;
        border-radius: 12px;
        max-width: 640px;
      }
      .pdf-shell {
        position: relative;
      }
      .pdf-panel-nav {
        display: none;
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 5;
      }
      .pdf-shell.is-panel-jump .pdf-panel-nav {
        display: block;
      }
      .pdf-panel-arrow {
        pointer-events: auto;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 999px;
        background: rgba(20, 24, 40, 0.55);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
      }
      .pdf-panel-arrow svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .pdf-panel-arrow--left {
        left: 10px;
        animation: pdf-panel-nudge-left 1.35s ease-in-out infinite;
      }
      .pdf-panel-arrow--right {
        right: 10px;
        animation: pdf-panel-nudge-right 1.35s ease-in-out infinite;
      }
      .pdf-panel-arrow:disabled,
      .pdf-panel-arrow.is-hidden {
        opacity: 0;
        pointer-events: none;
        animation: none;
      }
      .pdf-panel-dots {
        pointer-events: none;
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
      }
      .pdf-panel-dots span {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.45);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
      }
      .pdf-panel-dots span.is-active {
        background: #fff;
        transform: scale(1.15);
      }
      @keyframes pdf-panel-nudge-right {
        0%,
        100% {
          transform: translateY(-50%) translateX(0);
        }
        50% {
          transform: translateY(-50%) translateX(6px);
        }
      }
      @keyframes pdf-panel-nudge-left {
        0%,
        100% {
          transform: translateY(-50%) translateX(0);
        }
        50% {
          transform: translateY(-50%) translateX(-6px);
        }
      }
    </style>
  </head>
  <body>
    <div class="pdf-shell">
      <div class="pdf-canvas-wrap" id="pdf-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>
      <div class="pdf-panel-nav" id="pdf-panel-nav" aria-hidden="true">
        <button type="button" class="pdf-panel-arrow pdf-panel-arrow--left is-hidden" id="pdf-panel-prev" aria-label="Previous panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" class="pdf-panel-arrow pdf-panel-arrow--right" id="pdf-panel-next" aria-label="Next panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="pdf-panel-dots" id="pdf-panel-dots" aria-hidden="true">
          <span class="is-active"></span><span></span>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get("file");
        const wrap = document.getElementById("pdf-wrap");
        const shell = document.querySelector(".pdf-shell");
        const panelPrevBtn = document.getElementById("pdf-panel-prev");
        const panelNextBtn = document.getElementById("pdf-panel-next");
        const panelDots = document.getElementById("pdf-panel-dots");

        if (!fileUrl) {
          shell.innerHTML = '<div class="pdf-error">No PDF file source was provided.</div>';
          return;
        }

        const pageParam = Number.parseInt(params.get("page") ?? "", 10);
        const pageMatch = fileUrl.match(/#page=(\d+)/i) ?? fileUrl.match(/\?page=(\d+)/i);
        let currentPage = Number.parseInt(pageMatch?.[1] ?? "1", 10);
        if (Number.isFinite(pageParam) && pageParam >= 1) {
          currentPage = pageParam;
        }
        const resolvedFileUrl = fileUrl.replace(/#page=\d+/i, "").replace(/\?page=\d+/i, "");

        if (!window.pdfjsLib || !window.pdfjsLib.getDocument) {
          shell.innerHTML = '<div class="pdf-error">PDF.js failed to load. Please retry.</div>';
          return;
        }

        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const ua = navigator.userAgent || "";
        const isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const shortSide = Math.min(window.screen?.width || window.innerWidth, window.screen?.height || window.innerHeight);
        const isMiniClass = shortSide <= 768;
        const deviceMem = Number(navigator.deviceMemory) || 0;
        const lowMem = isIOS || isMiniClass || (deviceMem > 0 && deviceMem <= 4);

        /* Keep rendered bitmaps only around the current page. */
        const PAGE_WINDOW = lowMem ? 1 : 2;
        const MAX_CANVAS_PIXELS = lowMem ? 6291456 : 16777216;
        const pageCache = new Map();
        /** @type {Map<string, object>} */
        const contentBoxCache = new Map();
        let pdfDoc = null;
        let renderToken = 0;
        let loaded = false;
        let lastLayoutKey = "";
        let prefetchTimer = 0;
        let visibleCanvas = null;
        let pageZoom = 100;
        const zoomParam = Number(params.get("zoom"));
        if (Number.isFinite(zoomParam) && zoomParam >= 50 && zoomParam <= 300) {
          pageZoom = Math.round(zoomParam / 5) * 5;
        }
        currentPage = Math.max(1, Number.isFinite(currentPage) ? currentPage : 1);

        const VIEW_MODES = [
          "Auto",
          "ComicView",
          "NormalView",
          "MediumView",
          "LargeView",
          "ExtraLargeView",
          "Normal",
          "Fit",
          "SoftFocus",
          "NormalFocus",
          "BasicFocus",
          "MediumFocus",
          "HardFocus",
          "PanelJump",
        ];
        const FOCUS_MODES = new Set([
          "ComicView",
          "NormalView",
          "MediumView",
          "LargeView",
          "ExtraLargeView",
          "SoftFocus",
          "NormalFocus",
          "BasicFocus",
          "MediumFocus",
          "HardFocus",
        ]);
        const PRESET_ZOOM = {
          ComicView: 140,
          NormalView: 100,
          MediumView: 125,
          LargeView: 150,
          ExtraLargeView: 175,
        };
        const normalizeView = (value) => {
          const raw = typeof value === "string" ? value.trim() : "";
          return VIEW_MODES.includes(raw) ? raw : "Auto";
        };
        let configuredView = normalizeView(params.get("view"));
        let resolvedView = configuredView === "Auto" ? null : configuredView;
        let panelIndex = Math.max(0, Math.floor(Number(params.get("panel")) || 0));
        let panelCount = 2;
        /** @type {Map<number, Array<{x:number,y:number,w:number,h:number,pageW:number,pageH:number}>>} */
        const panelsByPage = new Map();

        const notifyViewMode = (mode) => {
          try {
            window.parent?.postMessage({ type: "pdf-viewer:view-mode", viewMode: mode }, "*");
          } catch {
            /* ignore */
          }
        };

        /* Auto on narrow stays Auto (SoftFocus layout). Landscape always fit. */
        const activeView = () => resolvedView || (configuredView === "Auto" ? "SoftFocus" : configuredView);
        const isFocusMode = (mode = activeView()) => FOCUS_MODES.has(mode);
        const presetZoomPct = () => PRESET_ZOOM[configuredView] || PRESET_ZOOM[activeView()] || 0;

        /**
         * Focus aggressiveness for eliminating PDF / scan white padding.
         * NormalFocus < BasicFocus < MediumFocus/SoftFocus < HardFocus.
         */
        const focusProfile = () => {
          const mode = activeView();
          if (mode === "NormalFocus") {
            return {
              id: "normal",
              padXFrac: 0.045,
              padYFrac: 0.035,
              padXPage: 0.028,
              padYPage: 0.022,
              padXMax: 0.07,
              padYMax: 0.055,
              frameX: 0.012,
              frameY: 0.01,
              massX: 0.006,
              massY: 0.005,
              peakCol: 0.025,
              peakRow: 0.025,
              sideInset: 10,
              hangMul: 0.75,
              bodyBand: 0.06,
            };
          }
          if (mode === "BasicFocus") {
            return {
              id: "basic",
              padXFrac: 0.025,
              padYFrac: 0.02,
              padXPage: 0.016,
              padYPage: 0.014,
              padXMax: 0.04,
              padYMax: 0.035,
              frameX: 0.022,
              frameY: 0.018,
              massX: 0.012,
              massY: 0.01,
              peakCol: 0.045,
              peakRow: 0.04,
              sideInset: 6,
              hangMul: 0.55,
              bodyBand: 0.08,
            };
          }
          if (mode === "HardFocus" || mode === "ComicView") {
            return {
              id: "hard",
              padXFrac: 0.004,
              padYFrac: 0.004,
              padXPage: 0.002,
              padYPage: 0.002,
              padXMax: 0.01,
              padYMax: 0.012,
              frameX: 0.045,
              frameY: 0.04,
              massX: 0.038,
              massY: 0.03,
              peakCol: 0.11,
              peakRow: 0.09,
              sideInset: 2,
              hangMul: 0.22,
              bodyBand: 0.12,
            };
          }
          /* MediumFocus + SoftFocus (legacy) */
          return {
            id: "medium",
            padXFrac: 0.012,
            padYFrac: 0.012,
            padXPage: 0.008,
            padYPage: 0.008,
            padXMax: 0.02,
            padYMax: 0.025,
            frameX: 0.03,
            frameY: 0.025,
            massX: 0.022,
            massY: 0.014,
            peakCol: 0.07,
            peakRow: 0.05,
            sideInset: 4,
            hangMul: 0.4,
            bodyBand: 0.1,
          };
        };

        const syncScrollMode = () => {
          const mode = activeView();
          const focus = isFocusMode(mode);
          wrap.classList.toggle("is-soft-focus", focus);
          wrap.style.overflowX = "auto";
          wrap.style.overflowY = "auto";
          /* NormalView: pin to top, center horizontally. */
          if (mode === "NormalView" || mode === "Normal") {
            wrap.style.justifyContent = "center";
            wrap.style.alignItems = "flex-start";
          } else {
            wrap.style.justifyContent = "flex-start";
            wrap.style.alignItems = "flex-start";
          }
          if (mode === "PanelJump") {
            wrap.style.overflowX = "hidden";
          }
        };
        syncScrollMode();

        /* iPad portrait + landscape (and similar tablets) — large reading surface. */
        const isLargeScreen = () => {
          const w = Math.max(80, wrap.clientWidth);
          const h = Math.max(80, wrap.clientHeight);
          const screenMin = Math.min(window.screen?.width || w, window.screen?.height || h);
          return screenMin >= 700 || (w >= 700 && h >= 500);
        };

        const layoutKey = () =>
          `${wrap.clientWidth}x${wrap.clientHeight}@${window.devicePixelRatio || 1}:${pageZoom}:${lowMem ? "l" : "h"}:${activeView()}:p${panelIndex}/${panelCount}:f${focusProfile().id}:${isLargeScreen() ? "lg" : "sm"}`;

        const pagesInWindow = (center) => {
          if (!pdfDoc) return [];
          const pages = [];
          for (let i = center - PAGE_WINDOW; i <= center + PAGE_WINDOW; i += 1) {
            if (i >= 1 && i <= pdfDoc.numPages) pages.push(i);
          }
          return pages;
        };

        const releaseEntry = (entry) => {
          if (!entry?.canvas) return;
          if (entry.canvas === visibleCanvas) {
            /* Keep on-screen page until a new mount replaces it (anti-flicker). */
            return;
          }
          releaseVisibleIf(entry.canvas);
          entry.canvas.width = 0;
          entry.canvas.height = 0;
        };

        const prunePageCache = (center) => {
          const keep = new Set(pagesInWindow(center));
          const key = lastLayoutKey || layoutKey();
          for (const [pageNum, entry] of pageCache.entries()) {
            const staleLayout = entry.status === "ready" && entry.key !== key;
            if (!keep.has(pageNum) || staleLayout) {
              if (entry.status === "ready") releaseEntry(entry);
              pageCache.delete(pageNum);
            }
          }
        };

        /**
         * Text-layer bounds. Horizontal span prefers BODY glyphs (skips header
         * title / page number that stretch the box to full page width and leave
         * a big empty right margin on kids books).
         */
        const getTextMetrics = async (page, pageW, pageH) => {
          try {
            const text = await page.getTextContent();
            const items = text?.items;
            if (!items || items.length < 3) return null;
            const viewport = page.getViewport({ scale: 1 });
            const Util = window.pdfjsLib.Util;
            const glyphs = [];
            const heights = [];
            for (const item of items) {
              if (!item?.transform) continue;
              const str = typeof item.str === "string" ? item.str.trim() : "";
              if (!str) continue;
              const m = Util.transform(viewport.transform, item.transform);
              const x = m[4];
              const y = m[5];
              const w = (typeof item.width === "number" ? item.width : 0) * Math.abs(m[0] || 1);
              const h =
                (typeof item.height === "number" ? item.height : 0) * Math.abs(m[3] || 1) ||
                Math.hypot(m[2], m[3]) ||
                8;
              if (!Number.isFinite(x) || !Number.isFinite(y) || h < 0.5) continue;
              const top = y - h;
              glyphs.push({ x, top, right: x + Math.max(w, 0), bottom: y, h });
              if (h < pageH * 0.08) heights.push(h);
            }
            if (glyphs.length < 2) return null;

            let minX = Infinity;
            let minY = Infinity;
            let maxX = -Infinity;
            let maxY = -Infinity;
            for (const g of glyphs) {
              minX = Math.min(minX, g.x);
              maxX = Math.max(maxX, g.right);
              minY = Math.min(minY, g.top);
              maxY = Math.max(maxY, g.bottom);
            }

            /* Body band: ignore top/bottom chrome for horizontal crop. */
            const fp = focusProfile();
            const bandTop = pageH * fp.bodyBand;
            const bandBot = pageH * (1 - fp.bodyBand);
            const body = glyphs.filter((g) => g.top >= bandTop && g.bottom <= bandBot);
            if (body.length >= 4) {
              let bx0 = Infinity;
              let bx1 = -Infinity;
              for (const g of body) {
                bx0 = Math.min(bx0, g.x);
                bx1 = Math.max(bx1, g.right);
              }
              if (bx1 > bx0) {
                minX = bx0;
                maxX = bx1;
              }
            }

            const sorted = heights.slice().sort((a, b) => a - b);
            const medianTextH = sorted.length
              ? sorted[Math.floor((sorted.length - 1) * 0.5)]
              : 0;
            const hang = Math.max(medianTextH * fp.hangMul, pageW * (0.012 + fp.hangMul * 0.02));
            minX = Math.max(0, minX - hang);
            maxX = Math.min(pageW, maxX + hang);
            minY = Math.max(0, minY - hang * 0.35);
            maxY = Math.min(pageH, maxY + hang * 0.35);

            return {
              box: {
                x: minX,
                y: minY,
                w: Math.max(1, maxX - minX),
                h: Math.max(1, maxY - minY),
              },
              medianTextH,
              sampleCount: glyphs.length,
            };
          } catch {
            return null;
          }
        };

        /**
         * Soft ink bounds — trim paper only.
         * Aggressiveness comes from focusProfile() (Normal…Hard Focus).
         */
        const inkBoundsFromImageData = (imageData) => {
          const { data, width, height } = imageData;
          if (width < 8 || height < 8) return null;
          const fp = focusProfile();

          /* Skip outer scan frame — black edge lines live here. */
          const frameX = Math.max(2, Math.floor(width * fp.frameX));
          const frameY = Math.max(2, Math.floor(height * fp.frameY));
          const x0 = frameX;
          const x1 = width - 1 - frameX;
          const y0 = frameY;
          const y1 = height - 1 - frameY;
          if (x1 <= x0 || y1 <= y0) return null;

          /* Estimate paper from border ring samples. */
          let paperSum = 0;
          let paperN = 0;
          const ring = Math.max(2, Math.floor(Math.min(width, height) * 0.04));
          const samplePaper = (x, y) => {
            const i = (y * width + x) * 4;
            paperSum += data[i] + data[i + 1] + data[i + 2];
            paperN += 1;
          };
          for (let x = 0; x < width; x += 3) {
            for (let t = 0; t < ring; t += 2) {
              samplePaper(x, t);
              samplePaper(x, height - 1 - t);
            }
          }
          for (let y = ring; y < height - ring; y += 3) {
            for (let t = 0; t < ring; t += 2) {
              samplePaper(t, y);
              samplePaper(width - 1 - t, y);
            }
          }
          const paper = paperN ? paperSum / paperN : 765;
          /* Darker than paper by ~12% — gray paper stays "paper", ink is ink. */
          const inkCutoff = Math.min(755, Math.max(520, paper - Math.max(55, paper * 0.12)));

          const colCounts = new Int32Array(width);
          const rowCounts = new Int32Array(height);
          let total = 0;
          const step = width * height > 220000 ? 2 : 1;

          for (let y = y0; y <= y1; y += step) {
            for (let x = x0; x <= x1; x += step) {
              const i = (y * width + x) * 4;
              if (data[i] + data[i + 1] + data[i + 2] >= inkCutoff) continue;
              colCounts[x] += 1;
              rowCounts[y] += 1;
              total += 1;
            }
          }
          if (total < 24) return null;

          const trimMass = (counts, from, to, dropFrac) => {
            const budget = Math.max(1, Math.floor(total * dropFrac));
            let lo = from;
            let hi = to;
            let acc = 0;
            while (lo < hi && acc + counts[lo] <= budget) {
              acc += counts[lo];
              lo += 1;
            }
            acc = 0;
            while (hi > lo && acc + counts[hi] <= budget) {
              acc += counts[hi];
              hi -= 1;
            }
            return [lo, hi];
          };

          /* Drop sparse edge dust; Hard Focus drops more mass from L/R. */
          let [minX, maxX] = trimMass(colCounts, x0, x1, fp.massX);
          let [minY, maxY] = trimMass(rowCounts, y0, y1, fp.massY);

          let peakCol = 1;
          let peakRow = 1;
          for (let x = minX; x <= maxX; x += 1) peakCol = Math.max(peakCol, colCounts[x]);
          for (let y = minY; y <= maxY; y += 1) peakRow = Math.max(peakRow, rowCounts[y]);
          const minCol = Math.max(1, Math.floor(peakCol * fp.peakCol));
          const minRow = Math.max(1, Math.floor(peakRow * fp.peakRow));
          while (minX < maxX && colCounts[minX] < minCol) minX += 1;
          while (maxX > minX && colCounts[maxX] < minCol) maxX -= 1;
          while (minY < maxY && rowCounts[minY] < minRow) minY += 1;
          while (maxY > minY && rowCounts[maxY] < minRow) maxY -= 1;

          if (maxX <= minX || maxY <= minY) return null;

          /* Harder focus → smaller safety pad around ink. */
          const padFrac = Math.max(0.002, Math.min(0.014, 0.014 - (fp.massX - 0.006) * 0.2));
          const pad = Math.max(fp.id === "hard" ? 1 : 2, Math.round(Math.min(width, height) * padFrac));
          minX = Math.max(0, minX - pad);
          minY = Math.max(0, minY - pad);
          maxX = Math.min(width - 1, maxX + pad);
          maxY = Math.min(height - 1, maxY + pad);

          return {
            x: minX,
            y: minY,
            w: maxX - minX + 1,
            h: maxY - minY + 1,
            width,
            height,
          };
        };

        /**
         * Focus pad around content — Hard Focus keeps almost no white border.
         */
        const padContentBox = (box, pageW, pageH) => {
          const fp = focusProfile();
          const padX = Math.min(Math.max(box.w * fp.padXFrac, pageW * fp.padXPage), pageW * fp.padXMax);
          const padY = Math.min(Math.max(box.h * fp.padYFrac, pageH * fp.padYPage), pageH * fp.padYMax);
          const x = Math.max(0, box.x - padX);
          const y = Math.max(0, box.y - padY);
          const r = Math.min(pageW, box.x + box.w + padX);
          const b = Math.min(pageH, box.y + box.h + padY);
          return { x, y, w: Math.max(1, r - x), h: Math.max(1, b - y), pageW, pageH };
        };

        const unionBoxes = (a, b) => {
          if (!a) return b;
          if (!b) return a;
          const x = Math.min(a.x, b.x);
          const y = Math.min(a.y, b.y);
          const r = Math.max(a.x + a.w, b.x + b.w);
          const bot = Math.max(a.y + a.h, b.y + b.h);
          return { x, y, w: r - x, h: bot - y };
        };

        /** Scan a preview render for non-paper ink — primary content detector. */
        const getInkContentBox = async (page, pageW, pageH) => {
          try {
            /* Small probe = big speed win; Focus only needs approximate margins. */
            const probeScale = lowMem ? 0.28 : 0.38;
            const probeVp = page.getViewport({ scale: probeScale });
            const probe = document.createElement("canvas");
            probe.width = Math.max(1, Math.floor(probeVp.width));
            probe.height = Math.max(1, Math.floor(probeVp.height));
            const ctx = probe.getContext("2d", { alpha: false, willReadFrequently: true });
            if (!ctx) return null;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, probe.width, probe.height);
            await page.render({
              canvasContext: ctx,
              viewport: probeVp,
              intent: "display",
              background: "#ffffff",
            }).promise;
            const bounds = inkBoundsFromImageData(
              ctx.getImageData(0, 0, probe.width, probe.height)
            );
            probe.width = 0;
            probe.height = 0;
            if (!bounds) return null;
            return {
              x: (bounds.x / bounds.width) * pageW,
              y: (bounds.y / bounds.height) * pageH,
              w: (bounds.w / bounds.width) * pageW,
              h: (bounds.h / bounds.height) * pageH,
            };
          } catch {
            return null;
          }
        };

        /**
         * Contract the page to real content: strip PDF / scan paper margins.
         * Fast path: text-only when enough glyphs (skips expensive ink probe).
         */
        const getContentBox = async (page, pageNumber) => {
          const base = page.getViewport({ scale: 1 });
          const pageW = base.width;
          const pageH = base.height;
          const full = { x: 0, y: 0, w: pageW, h: pageH, pageW, pageH };
          const cacheKey = `${pageNumber || 0}:${focusProfile().id}`;
          const cached = contentBoxCache.get(cacheKey);
          if (cached) return cached;

          const textMetrics = await getTextMetrics(page, pageW, pageH);
          const textBox = textMetrics?.box || null;
          const samples = textMetrics?.sampleCount || 0;

          let box = null;
          /* Prefer text bounds when dense — avoids a second PDF render. */
          if (samples >= 12 && textBox && textBox.w < pageW * 0.96 && textBox.h < pageH * 0.96) {
            box = textBox;
          } else {
            const inkBox = await getInkContentBox(page, pageW, pageH);
            const inkFill = inkBox
              ? (inkBox.w * inkBox.h) / Math.max(1, pageW * pageH)
              : 1;
            const inkLooksFull = inkFill > 0.82;

            if (inkBox && !inkLooksFull) {
              if (textBox && samples >= 8) {
                const y = Math.min(inkBox.y, textBox.y);
                const b = Math.max(inkBox.y + inkBox.h, textBox.y + textBox.h);
                box = { x: inkBox.x, y, w: inkBox.w, h: Math.max(1, b - y) };
              } else {
                box = inkBox;
              }
            } else if (samples >= 8 && textBox) {
              box = textBox;
            } else if (inkBox && (inkBox.w < pageW * 0.94 || inkBox.h < pageH * 0.94)) {
              box = inkBox;
            }
          }

          if (!box || box.w < pageW * 0.08 || box.h < pageH * 0.08) {
            box = full;
          }

          const padded = padContentBox(box, pageW, pageH);
          padded.medianTextH = textMetrics?.medianTextH || 0;
          padded.sampleCount = samples;
          contentBoxCache.set(cacheKey, padded);
          return padded;
        };

        /**
         * Find midpoints of low-ink valleys along a density profile.
         * Tuned for thin comic gutters (1–few px at probe resolution).
         */
        const findGutterSplits = (density, length, minSeg) => {
          if (length < 8) return [0, length];
          const smooth = new Float32Array(length);
          for (let i = 0; i < length; i += 1) {
            let sum = 0;
            let n = 0;
            for (let k = -3; k <= 3; k += 1) {
              const j = i + k;
              if (j >= 0 && j < length) {
                sum += density[j];
                n += 1;
              }
            }
            smooth[i] = sum / n;
          }
          let mean = 0;
          let minV = Infinity;
          for (let i = 0; i < length; i += 1) {
            mean += smooth[i];
            if (smooth[i] < minV) minV = smooth[i];
          }
          mean /= length;
          /*
            True panel gutters are nearly empty (~0–0.12 ink).
            Caption boxes are white with sparse text (~0.3–0.45) — NOT gutters.
            Old mean*0.55 threshold sliced panels through English captions.
          */
          const threshold = Math.max(0.04, Math.min(0.14, mean * 0.22));

          const rawValleys = [];
          for (let i = 2; i < length - 2; i += 1) {
            const v = smooth[i];
            if (v > threshold) continue;
            if (v <= smooth[i - 1] && v <= smooth[i + 1] && v <= smooth[i - 2] && v <= smooth[i + 2]) {
              if (!rawValleys.length || i - rawValleys[rawValleys.length - 1] >= Math.max(4, Math.floor(minSeg * 0.35))) {
                rawValleys.push(i);
              } else if (v < smooth[rawValleys[rawValleys.length - 1]]) {
                rawValleys[rawValleys.length - 1] = i;
              }
            }
          }

          const splits = [0];
          for (const v of rawValleys) {
            if (v >= minSeg && length - v >= minSeg) splits.push(v);
          }
          splits.push(length);
          return splits;
        };

        const buildGridPanels = (content, rows, cols) => {
          const panels = [];
          const cellW = content.w / cols;
          const cellH = content.h / rows;
          /* Slight vertical overlap only — keep captions; do NOT widen cells (causes L/R crop). */
          const overlapY = cellH * 0.1;
          for (let r = 0; r < rows; r += 1) {
            for (let c = 0; c < cols; c += 1) {
              const x = content.x + c * cellW;
              const y = Math.max(content.y, content.y + r * cellH - overlapY);
              const right = content.x + (c + 1) * cellW;
              const bottom = Math.min(content.y + content.h, content.y + (r + 1) * cellH + overlapY);
              panels.push({
                x,
                y,
                w: Math.max(1, right - x),
                h: Math.max(1, bottom - y),
                pageW: content.pageW,
                pageH: content.pageH,
              });
            }
          }
          return panels;
        };

        const guessComicGrid = (content) => {
          const aspect = content.w / Math.max(1, content.h);
          /*
            Portrait kids comics (Shwe Thway): panels are usually FULL-WIDTH
            horizontal strips stacked top→bottom — not a 3-column manga grid.
            Using cols>1 was cropping English/art on L/R of each strip.
          */
          if (aspect < 0.95) return { rows: 4, cols: 1 };
          if (aspect <= 1.25) return { rows: 3, cols: 2 };
          return { rows: 2, cols: 3 };
        };

        /**
         * Detect comic panels from white gutters. Returns boxes in page units,
         * ordered left→right within each row, then top→bottom (Western reading order).
         */
        const detectComicPanelsFromImageData = (imageData, pageW, pageH, contentBox) => {
          const { data, width, height } = imageData;
          const x0 = Math.max(0, Math.floor((contentBox.x / pageW) * width));
          const y0 = Math.max(0, Math.floor((contentBox.y / pageH) * height));
          const x1 = Math.min(width, Math.ceil(((contentBox.x + contentBox.w) / pageW) * width));
          const y1 = Math.min(height, Math.ceil(((contentBox.y + contentBox.h) / pageH) * height));
          const cw = x1 - x0;
          const ch = y1 - y0;
          if (cw < 24 || ch < 24) return null;

          const rowInk = new Float32Array(ch);
          /*
            Shwe Thway paper/gutters are ~RGB(253,253,253) sum≈759 — NOT pure 255.
            Old threshold (sum<765) counted gutters as ink → detection collapsed.
          */
          const isInkPixel = (r, g, b) => r < 248 || g < 248 || b < 248;
          const step = cw * ch > 180000 ? 2 : 1;
          for (let y = y0; y < y1; y += step) {
            let ink = 0;
            let samples = 0;
            for (let x = x0; x < x1; x += step) {
              const i = (y * width + x) * 4;
              samples += 1;
              if (isInkPixel(data[i], data[i + 1], data[i + 2])) ink += 1;
            }
            rowInk[y - y0] = samples ? ink / samples : 0;
            if (step > 1 && y + 1 < y1) rowInk[y - y0 + 1] = rowInk[y - y0];
          }

          const minRowH = Math.max(8, Math.floor(ch * 0.08));
          const minColW = Math.max(8, Math.floor(cw * 0.08));

          const ySplits = findGutterSplits(rowInk, ch, minRowH);
          const bands = [];
          for (let s = 0; s < ySplits.length - 1; s += 1) {
            const top = ySplits[s];
            const bot = ySplits[s + 1];
            if (bot - top >= minRowH) bands.push([top, bot]);
          }
          if (!bands.length) bands.push([0, ch]);

          const panels = [];
          for (const [top, bot] of bands) {
            const bandH = Math.max(1, bot - top);
            const colInk = new Float32Array(cw);
            /* Use mid-band (art) so caption boxes don't hide vertical gutters. */
            const yArt0 = y0 + top + Math.floor(bandH * 0.28);
            const yArt1 = y0 + top + Math.floor(bandH * 0.72);
            const artH = Math.max(1, yArt1 - yArt0);
            for (let y = yArt0; y < yArt1; y += step) {
              for (let x = x0; x < x1; x += step) {
                const i = (y * width + x) * 4;
                if (isInkPixel(data[i], data[i + 1], data[i + 2])) {
                  colInk[x - x0] += 1;
                }
              }
            }
            const rowSamples = Math.max(1, Math.ceil(artH / step));
            for (let c = 0; c < cw; c += 1) colInk[c] /= rowSamples;

            const xSplits = findGutterSplits(colInk, cw, minColW);
            let cells = [];
            for (let s = 0; s < xSplits.length - 1; s += 1) {
              const left = xSplits[s];
              const right = xSplits[s + 1];
              if (right - left >= minColW * 0.55) cells.push([left, right]);
            }

            /* Wide rows without clear V-gutters → equal 2/3 cols (L→R). */
            if (cells.length < 2) {
              const bandHpage = (bandH / ch) * contentBox.h;
              const aspect = contentBox.w / Math.max(1, bandHpage);
              const cols = aspect > 2.0 ? 3 : aspect > 1.25 ? 2 : 1;
              cells = [];
              for (let c = 0; c < cols; c += 1) {
                cells.push([
                  Math.floor((cw * c) / cols),
                  Math.floor((cw * (c + 1)) / cols),
                ]);
              }
            }

            for (const [left, right] of cells) {
              const px = contentBox.x + (left / cw) * contentBox.w;
              const py = contentBox.y + (top / ch) * contentBox.h;
              const pw = ((right - left) / cw) * contentBox.w;
              const ph = ((bot - top) / ch) * contentBox.h;
              panels.push({
                x: px,
                y: py,
                w: Math.max(1, pw),
                h: Math.max(1, ph),
                pageW,
                pageH,
              });
            }
          }

          const minArea = contentBox.w * contentBox.h * 0.04;
          const filtered = panels.filter((p) => {
            if (p.w * p.h < minArea) return false;
            const aspect = p.w / Math.max(1, p.h);
            return aspect > 0.35 && aspect < 2.8;
          });
          if (filtered.length < 4 || filtered.length > 16) return null;

          return filtered.map((p) => {
            const padX = Math.min(p.w * 0.02, contentBox.w * 0.008);
            const padY = Math.min(p.h * 0.02, contentBox.h * 0.008);
            const x = Math.max(contentBox.x, p.x - padX);
            const y = Math.max(contentBox.y, p.y - padY);
            const r = Math.min(contentBox.x + contentBox.w, p.x + p.w + padX);
            const b = Math.min(contentBox.y + contentBox.h, p.y + p.h + padY);
            return { x, y, w: r - x, h: b - y, pageW, pageH };
          });
        };

        /** Reject bogus sets (e.g. full-page + footer strip). */
        const isSanePanelSet = (panels, content) => {
          if (!panels || panels.length < 4) return false;
          const area = Math.max(1, content.w * content.h);
          for (const p of panels) {
            const a = p.w * p.h;
            if (a > area * 0.5) return false;
            if (p.h < content.h * 0.07 || p.w < content.w * 0.07) return false;
          }
          return true;
        };

        const ensurePanelsForPage = async (page, pageNumber) => {
          const cached = panelsByPage.get(pageNumber);
          if (cached?.length) return cached;

          const base = page.getViewport({ scale: 1 });
          const pageW = base.width;
          const pageH = base.height;
          const content = await getContentBox(page, pageNumber);
          content.pageW = pageW;
          content.pageH = pageH;

          /*
            Reliable reading path for magazine comics (Shwe Thway etc.):
            overlapping 3×3 (or 3×2) grid in L→R then down order.
            Gutter auto-detect is too fragile on bilingual caption layouts —
            overlap keeps full Burmese + art + English in each jump.
          */
          const { rows, cols } = guessComicGrid(content);
          const panels = buildGridPanels(content, rows, cols);

          panelsByPage.set(pageNumber, panels);
          return panels;
        };

        /** Focus region for the active view mode. */
        const getFocusBox = async (page, pageNumber) => {
          const base = page.getViewport({ scale: 1 });
          const full = {
            x: 0,
            y: 0,
            w: base.width,
            h: base.height,
            pageW: base.width,
            pageH: base.height,
          };
          const mode = activeView();

          if (mode === "Normal" || mode === "Fit" || mode === "NormalView") {
            return full;
          }

          if (mode === "PanelJump") {
            /*
              Real gutter-based panels (uneven sizes OK), reading order:
              left → right, then next row down. Jump arrows follow that list.
              Each panel is CONTAINed so text/art is not cropped.
            */
            const panels = await ensurePanelsForPage(page, pageNumber);
            panelCount = Math.max(1, panels.length);
            if (panelIndex >= panelCount) panelIndex = panelCount - 1;
            const box = panels[panelIndex] || panels[0] || full;
            return { ...box, pageW: base.width, pageH: base.height };
          }

          /* Focus modes: ink/text bounds only — white PDF padding is discarded. */
          if (isFocusMode(mode)) {
            return getContentBox(page, pageNumber);
          }

          return full;
        };

        /** Auto → SoftFocus: trim margins, fit width, vertical scroll. (unchanged) */
        const autoDetectViewMode = async (_doc) => "SoftFocus";

        const ensureResolvedView = async (doc) => {
          if (configuredView !== "Auto") {
            resolvedView = configuredView;
            notifyViewMode(resolvedView);
            syncPanelChrome();
            return;
          }
          if (resolvedView) {
            notifyViewMode(resolvedView);
            syncPanelChrome();
            return;
          }
          resolvedView = await autoDetectViewMode(doc);
          notifyViewMode(resolvedView);
          syncPanelChrome();
        };

        const syncPanelChrome = () => {
          const on = activeView() === "PanelJump";
          shell.classList.toggle("is-panel-jump", on);
          syncScrollMode();
          const nav = document.getElementById("pdf-panel-nav");
          if (nav) nav.setAttribute("aria-hidden", on ? "false" : "true");
          if (!panelPrevBtn || !panelNextBtn) return;
          if (!on || panelCount < 2) {
            panelPrevBtn.classList.add("is-hidden");
            panelNextBtn.classList.add("is-hidden");
            if (panelDots) panelDots.innerHTML = "";
            return;
          }
          panelPrevBtn.classList.toggle("is-hidden", panelIndex <= 0);
          panelNextBtn.classList.toggle("is-hidden", panelIndex >= panelCount - 1);
          panelPrevBtn.disabled = panelIndex <= 0;
          panelNextBtn.disabled = panelIndex >= panelCount - 1;
          if (panelDots) {
            panelDots.innerHTML = "";
            for (let i = 0; i < panelCount; i += 1) {
              const dot = document.createElement("span");
              if (i === panelIndex) dot.className = "is-active";
              panelDots.appendChild(dot);
            }
          }
        };

        const goPanel = (next) => {
          const clamped = Math.max(0, Math.min(panelCount - 1, next));
          if (clamped === panelIndex) return;
          panelIndex = clamped;
          syncPanelChrome();
          lastLayoutKey = layoutKey();
          prunePageCache(currentPage);
          if (pdfDoc) void renderPage(currentPage);
        };

        if (panelPrevBtn) {
          panelPrevBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            goPanel(panelIndex - 1);
          });
        }
        if (panelNextBtn) {
          panelNextBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            goPanel(panelIndex + 1);
          });
        }

        const scrollForBox = (box, cssScale, cssWidth, cssHeight) => {
          const availW = Math.max(80, wrap.clientWidth);
          const availH = Math.max(80, wrap.clientHeight);
          const edge = 6;
          const contentCssW = box.w * cssScale;
          const contentCssH = box.h * cssScale;
          const mode = activeView();
          const topCenter = mode === "NormalView" || mode === "Normal";

          let scrollLeft = 0;
          let shiftX = 0;
          if (topCenter) {
            /* Full page, top-center: no pan into a crop box. */
            const extra = cssWidth - availW;
            scrollLeft = extra > 0 ? extra / 2 : 0;
            shiftX = 0;
          } else {
            const sideGap = Math.min(8, Math.max(0, (availW - contentCssW) / 2));
            const contentLeft = box.x * cssScale;
            scrollLeft = Math.max(0, contentLeft - sideGap);
            const maxScrollX = Math.max(0, cssWidth - availW);
            if (scrollLeft > maxScrollX) scrollLeft = maxScrollX;
            shiftX = 0;
          }

          let scrollTop = 0;
          let shiftY = 0;
          if (topCenter) {
            scrollTop = 0;
            shiftY = 0;
          } else {
            const idealTop = box.y * cssScale - edge;
            const maxScrollY = Math.max(0, cssHeight - availH);
            scrollTop = idealTop;
            if (scrollTop < 0) {
              shiftY = -scrollTop;
              scrollTop = 0;
            } else if (scrollTop > maxScrollY) {
              shiftY = maxScrollY - scrollTop;
              scrollTop = maxScrollY;
            }
          }

          return { scrollLeft, scrollTop, shiftX, shiftY };
        };

        const computeLayout = (page, contentBox, scaleBoost = 1) => {
          const baseViewport = page.getViewport({ scale: 1 });
          const zoomFactor = Math.max(0.5, Number(pageZoom) / 100);
          const availW = Math.max(80, wrap.clientWidth);
          const availH = Math.max(80, wrap.clientHeight);
          const edge = 12;
          const box = contentBox || {
            x: 0,
            y: 0,
            w: baseViewport.width,
            h: baseViewport.height,
            pageW: baseViewport.width,
            pageH: baseViewport.height,
          };
          const mode = activeView();
          const pageW = baseViewport.width;
          const pageH = baseViewport.height;
          const large = isLargeScreen();
          /* Large screen (iPad portrait + landscape): fit width, no extra zoom. */
          const appliedZoom = large ? 1 : zoomFactor;

          let cssScale;
          if (large && (isFocusMode(mode) || mode === "Normal" || mode === "Fit")) {
            const sideInset = isFocusMode(mode) ? Math.min(4, focusProfile().sideInset) : 4;
            const viewW = Math.max(60, availW - sideInset * 2);
            cssScale = viewW / Math.max(1, box.w);
          } else if (mode === "Normal") {
            const scaleW = Math.max(60, availW - edge * 2) / pageW;
            const scaleH = Math.max(60, availH - edge * 2) / pageH;
            cssScale = Math.min(scaleW, scaleH) * appliedZoom;
          } else if (mode === "Fit") {
            cssScale = (Math.max(60, availW - edge * 2) / pageW) * appliedZoom;
          } else if (mode === "PanelJump") {
            const viewW = Math.max(60, availW - 16);
            cssScale = (viewW / Math.max(1, box.w)) * appliedZoom;
          } else if (isFocusMode(mode)) {
            const sideInset = focusProfile().sideInset;
            const viewW = Math.max(60, availW - sideInset * 2);
            if (presetZoomPct()) {
              cssScale = (viewW / Math.max(1, box.w)) * appliedZoom;
            } else {
              /* Auto on phone: keep auto readable scale. */
              const short = Math.min(availW, availH);
              const readMul = short <= 430 ? 1.9 : 1.35;
              cssScale = ((viewW * readMul) / Math.max(1, box.w)) * appliedZoom;
            }
          } else {
            const sideInset = 4;
            const viewW = Math.max(60, availW - sideInset * 2);
            cssScale = (viewW / Math.max(1, box.w)) * appliedZoom;
          }

          const dpr = Math.max(1, window.devicePixelRatio || 1);
          /* Prefer fast first paint; still sharp enough for reading. */
          let outputScale = (lowMem
            ? Math.min(1.75, Math.max(1.25, dpr))
            : Math.min(2.25, Math.max(1.5, dpr * 1.15))) * scaleBoost;
          outputScale = Math.max(1, outputScale);

          let cssWidth = baseViewport.width * cssScale;
          let cssHeight = baseViewport.height * cssScale;
          let pixels = cssWidth * outputScale * cssHeight * outputScale;
          if (pixels > MAX_CANVAS_PIXELS) {
            outputScale *= Math.sqrt(MAX_CANVAS_PIXELS / pixels);
            outputScale = Math.max(1, outputScale);
          }

          const viewport = page.getViewport({
            scale: Math.max(0.35, cssScale * outputScale),
          });
          const pixelWidth = Math.max(1, Math.round(viewport.width));
          const pixelHeight = Math.max(1, Math.round(viewport.height));
          cssWidth = pixelWidth / outputScale;
          cssHeight = pixelHeight / outputScale;

          const focus = scrollForBox(box, cssScale, cssWidth, cssHeight);

          return {
            viewport,
            outputScale,
            cssWidth,
            cssHeight,
            pixelWidth,
            pixelHeight,
            cssScale,
            contentBox: box,
            scrollLeft: focus.scrollLeft,
            scrollTop: focus.scrollTop,
            shiftX: focus.shiftX,
            shiftY: focus.shiftY,
            key: layoutKey(),
          };
        };

        const releaseVisibleIf = (node) => {
          if (node && node.parentNode === wrap) {
            wrap.replaceChildren();
          }
        };

        const focusContent = (entry) => {
          const mode = activeView();
          const topCenter = mode === "NormalView" || mode === "Normal";
          wrap.style.justifyContent = topCenter ? "center" : "flex-start";
          wrap.style.alignItems = "flex-start";
          const node = entry.canvas;
          if (node) {
            node.style.transform = "translateZ(0)";
          }
          wrap.scrollLeft = Math.round(entry.scrollLeft || 0);
          wrap.scrollTop = Math.round(entry.scrollTop || 0);
        };

        const mountEntry = (entry) => {
          const node = entry.canvas;
          node.style.width = `${entry.cssWidth}px`;
          node.style.height = `${entry.cssHeight}px`;
          const prev = visibleCanvas;
          if (prev === node) {
            focusContent(entry);
            syncPanelChrome();
            return;
          }
          /* Swap without blanking: append new, then drop old. */
          if (node.parentNode !== wrap) {
            wrap.appendChild(node);
          }
          visibleCanvas = node;
          focusContent(entry);
          if (prev && prev !== node) {
            try {
              prev.remove();
            } catch {
              /* ignore */
            }
            if (prev.width) {
              prev.width = 0;
              prev.height = 0;
            }
          }
          while (wrap.childElementCount > 1) {
            const extra = [...wrap.children].find((c) => c !== node);
            if (!extra) break;
            try {
              extra.remove();
            } catch {
              break;
            }
          }
          syncPanelChrome();
        };

        const entryFromLayout = async (page, layout) => {
          const off = document.createElement("canvas");
          off.width = layout.pixelWidth;
          off.height = layout.pixelHeight;
          const context = off.getContext("2d", { alpha: false });
          if (!context) throw new Error("2d context unavailable");
          context.imageSmoothingEnabled = true;
          context.imageSmoothingQuality = lowMem ? "medium" : "high";
          await page.render({
            canvasContext: context,
            viewport: layout.viewport,
            intent: "display",
            background: "#ffffff",
          }).promise;
          return {
            status: "ready",
            canvas: off,
            cssWidth: layout.cssWidth,
            cssHeight: layout.cssHeight,
            outputScale: layout.outputScale,
            cssScale: layout.cssScale,
            contentBox: layout.contentBox,
            scrollLeft: layout.scrollLeft,
            scrollTop: layout.scrollTop,
            shiftX: 0,
            shiftY: layout.shiftY || 0,
            key: layout.key,
          };
        };

        const renderPageToEntry = async (pageNumber) => {
          const page = await pdfDoc.getPage(pageNumber);
          const contentBox = await getFocusBox(page, pageNumber);

          const tryRender = async (box, boost) => {
            const layout = computeLayout(page, box, boost);
            return entryFromLayout(page, layout);
          };

          try {
            return await tryRender(contentBox, 1);
          } catch {
            try {
              return await tryRender(contentBox, 0.75);
            } catch {
              return await tryRender(contentBox, 0.5);
            }
          }
        };

        const cachePage = async (pageNumber) => {
          if (!pdfDoc) return null;
          const existing = pageCache.get(pageNumber);
          if (existing?.status === "ready" && existing.key === lastLayoutKey) {
            return existing;
          }
          if (existing?.status === "loading") {
            return existing.promise;
          }
          const promise = renderPageToEntry(pageNumber)
            .then((entry) => {
              const keep = new Set(pagesInWindow(currentPage));
              if (!keep.has(pageNumber) || entry.key !== layoutKey()) {
                releaseEntry(entry);
                if (pageCache.get(pageNumber)?.promise === promise) {
                  pageCache.delete(pageNumber);
                }
                return null;
              }
              pageCache.set(pageNumber, entry);
              return entry;
            })
            .catch((err) => {
              if (pageCache.get(pageNumber)?.promise === promise) {
                pageCache.delete(pageNumber);
              }
              throw err;
            });
          pageCache.set(pageNumber, { status: "loading", promise });
          return promise;
        };

        const prefetchNeighbors = (center) => {
          window.clearTimeout(prefetchTimer);
          prefetchTimer = window.setTimeout(() => {
            for (const pageNum of pagesInWindow(center)) {
              if (pageNum === center) continue;
              const hit = pageCache.get(pageNum);
              if (hit?.status === "ready" && hit.key === lastLayoutKey) continue;
              if (hit?.status === "loading") continue;
              void cachePage(pageNum);
            }
          }, lowMem ? 120 : 40);
        };

        const renderPage = async (pageNumber) => {
          if (!pdfDoc) return;
          const myToken = ++renderToken;
          lastLayoutKey = layoutKey();
          prunePageCache(pageNumber);

          const cached = pageCache.get(pageNumber);
          if (cached?.status === "ready" && cached.key === lastLayoutKey) {
            if (myToken !== renderToken) return;
            mountEntry(cached);
            prefetchNeighbors(pageNumber);
            return;
          }

          const entry = await cachePage(pageNumber).catch((err) => {
            showError(`Unable to draw this PDF page. ${err && err.message ? err.message : ""}`);
            return null;
          });
          if (myToken !== renderToken || !entry) return;
          mountEntry(entry);
          prefetchNeighbors(pageNumber);
        };

        const showError = (msg) => {
          shell.innerHTML = `<div class="pdf-error">${msg}</div>`;
        };

        const openDocument = (source) => {
          const options =
            source instanceof ArrayBuffer || ArrayBuffer.isView(source)
              ? {
                  data: source instanceof Uint8Array ? source : new Uint8Array(source),
                  disableStream: true,
                  disableAutoFetch: true,
                  disableRange: true,
                  isEvalSupported: false,
                  maxImageSize: -1,
                  disableFontFace: false,
                  verbosity: 0,
                }
              : {
                  url: source,
                  disableAutoFetch: true,
                  isEvalSupported: false,
                  maxImageSize: -1,
                  disableFontFace: false,
                  verbosity: 0,
                };
          return window.pdfjsLib.getDocument(options).promise;
        };

        const loadPdfFromSource = async (source) => {
          if (loaded) return;
          loaded = true;
          try {
            pdfDoc = await openDocument(source);
            panelsByPage.clear();
            panelIndex = 0;
            currentPage = Math.min(Math.max(1, currentPage), pdfDoc.numPages);
            await ensureResolvedView(pdfDoc);
            lastLayoutKey = layoutKey();
            await renderPage(currentPage);
            try {
              window.parent?.postMessage(
                { type: "pdf-viewer:ready", numPages: pdfDoc.numPages, url: resolvedFileUrl },
                "*",
              );
            } catch {
              /* ignore */
            }
          } catch (err) {
            loaded = false;
            const detail = err && err.message ? String(err.message) : "Unknown error";
            showError(`Unable to load this PDF on this device. ${detail}`);
          }
        };

        window.addEventListener("message", (event) => {
          const data = event.data && typeof event.data === "object" ? event.data : null;
          if (!data || data.target !== "pdf-viewer") return;
          if (data.type === "load-buffer") {
            if (data.url && data.url !== resolvedFileUrl) return;
            if (typeof data.view === "string") {
              configuredView = normalizeView(data.view);
              resolvedView = configuredView === "Auto" ? null : configuredView;
            }
            if (Number.isFinite(Number(data.panel))) {
              panelIndex = Math.max(0, Math.floor(Number(data.panel)));
            }
            if (data.buffer instanceof ArrayBuffer) {
              loadPdfFromSource(data.buffer);
            } else if (typeof data.url === "string" && !loaded) {
              loadPdfFromSource(data.url);
            }
          } else if (data.type === "goto-page") {
            const n = Math.floor(Number(data.page));
            if (!Number.isFinite(n) || !pdfDoc) return;
            currentPage = Math.min(Math.max(1, n), pdfDoc.numPages);
            panelIndex = 0;
            void renderPage(currentPage);
          } else if (data.type === "set-zoom") {
            const next = Math.floor(Number(data.zoom));
            if (!Number.isFinite(next) || next < 50 || next > 300) return;
            if (next === pageZoom) return;
            pageZoom = next;
            syncScrollMode();
            lastLayoutKey = layoutKey();
            prunePageCache(currentPage);
            if (pdfDoc) void renderPage(currentPage);
          } else if (data.type === "set-view") {
            const next = normalizeView(data.view);
            if (next === configuredView && (next !== "Auto" || resolvedView)) return;
            configuredView = next;
            resolvedView = next === "Auto" ? null : next;
            panelsByPage.clear();
            contentBoxCache.clear();
            panelIndex = 0;
            const apply = async () => {
              if (!pdfDoc) return;
              await ensureResolvedView(pdfDoc);
              lastLayoutKey = layoutKey();
              prunePageCache(currentPage);
              await renderPage(currentPage);
            };
            void apply();
          } else if (data.type === "set-panel") {
            const next = Math.floor(Number(data.panel));
            if (!Number.isFinite(next)) return;
            goPanel(next);
          }
        });

        /* If the parent never posts a buffer (iOS memory path), load by URL. */
        window.setTimeout(() => {
          if (!loaded) loadPdfFromSource(resolvedFileUrl);
        }, 50);

        let resizeTimer = 0;
        const onViewportChange = () => {
          if (!pdfDoc) return;
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(() => {
            if (layoutKey() === lastLayoutKey) return;
            lastLayoutKey = layoutKey();
            prunePageCache(currentPage);
            void renderPage(currentPage);
          }, 120);
        };
        window.addEventListener("resize", onViewportChange);
        window.visualViewport?.addEventListener("resize", onViewportChange);
        try {
          matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener("change", onViewportChange);
        } catch {
          /* older browsers */
        }
      })();
    </script>
  </body>
</html>
