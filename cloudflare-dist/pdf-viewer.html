            console.warn("Canvas has no dimensions - skipping mount");
            return;
          }
          if (!entry.textLayer) {
            entry.textLayer = document.createElement("div");
            entry.textLayer.className = "pdf-text-layer";
            entry.textLayer.setAttribute("aria-hidden", "true");
          }
          node.style.width = `${entry.cssWidth}px`;
          node.style.height = `${entry.cssHeight}px`;
          if (entry.textLayer) {
            entry.textLayer.style.width = `${entry.cssWidth}px`;
            entry.textLayer.style.height = `${entry.cssHeight}px`;
          }
          const prev = visibleCanvas;
          const prevTextLayer = visibleTextLayer;
          if (prev === node) {
            if (entry.textLayer.parentNode !== wrap) {
              wrap.appendChild(entry.textLayer);
            }
            visibleTextLayer = entry.textLayer || null;
            visibleEntry = entry;
            if (visibleTextLayer) visibleTextLayer.classList.toggle("is-dictionary-enabled", dictionaryMode);
            void buildOcrTextLayer(entry);
            focusContent(entry);
            syncPanelChrome();
            return;
          }
          /* Swap without blanking: append new, then drop old. */
          if (node.parentNode !== wrap) {
            wrap.appendChild(node);
          }
          if (entry.textLayer && entry.textLayer.parentNode !== wrap) {
            wrap.appendChild(entry.textLayer);
          }
          visibleCanvas = node;
          visibleTextLayer = entry.textLayer || null;
          visibleEntry = entry;
          if (visibleTextLayer) visibleTextLayer.classList.toggle("is-dictionary-enabled", dictionaryMode);
          void buildOcrTextLayer(entry);
          ensureDictionaryLayer();
          ensureDictionaryLayer();
          focusContent(entry);
          if (prev && prev !== node) {
            try {
              prev.remove();
            } catch {
              /* ignore */
            }
            if (prev.width) {
              prev.width = 0;
              prev.height = 0;
            }
          }
          if (prevTextLayer && prevTextLayer !== visibleTextLayer) {
            try {
              prevTextLayer.remove();
            } catch {
              /* ignore */
            }
          }
          while (wrap.childElementCount > 2) {
            const extra = [...wrap.children].find((c) => c !== node && c !== visibleTextLayer);
            if (!extra) break;
            try {
              extra.remove();
            } catch {
              break;
            }
          }
          syncPanelChrome();
        };

        const entryFromLayout = async (page, pageNumber, layout) => {
          const off = document.createElement("canvas");
          off.width = layout.pixelWidth;
          off.height = layout.pixelHeight;
          /* alpha:true + explicit white fill: opaque canvases start BLACK, which
             is what users see when a page is still rendering or a draw fails. */
          const context = off.getContext("2d", { alpha: true });
          if (!context) throw new Error("2d context unavailable");
          context.fillStyle = "#ffffff";
          context.fillRect(0, 0, off.width, off.height);
          context.imageSmoothingEnabled = true;
          context.imageSmoothingQuality = lowMem ? "medium" : "high";
          try {
            if (layout.cropToContent) {
              context.translate(
                -layout.cropX * layout.viewport.scale,
                -layout.cropY * layout.viewport.scale,
              );
            }
            await page.render({
              canvasContext: context,
              viewport: layout.viewport,
              intent: "display",
              background: "#ffffff",
            }).promise;

            if (layout.cropToContent) {
              const rendered = context.getImageData(0, 0, off.width, off.height);
              const pixels = rendered.data;
              let minX = off.width;
              let minY = off.height;
              let maxX = -1;
              let maxY = -1;
              for (let y = 0; y < off.height; y += 2) {
                for (let x = 0; x < off.width; x += 2) {
                  const i = (y * off.width + x) * 4;
                  if (pixels[i] < 245 || pixels[i + 1] < 245 || pixels[i + 2] < 245) {
                    minX = Math.min(minX, x);
                    minY = Math.min(minY, y);
                    maxX = Math.max(maxX, x);
                    maxY = Math.max(maxY, y);
                  }
                }
              }
              if (maxX >= minX && maxY >= minY) {
                const cropWidth = maxX - minX + 1;
                const cropHeight = maxY - minY + 1;
                const cropped = document.createElement("canvas");
                cropped.width = cropWidth;
                cropped.height = cropHeight;
                cropped.getContext("2d").putImageData(
                  context.getImageData(minX, minY, cropWidth, cropHeight),
                  0,
                  0,
                );
                const targetWidth = off.width;
                const targetHeight = Math.max(1, Math.round((cropHeight / cropWidth) * targetWidth));
                off.width = targetWidth;
                off.height = targetHeight;
                const cropContext = off.getContext("2d", { alpha: true });
                cropContext.fillStyle = "#ffffff";
                cropContext.fillRect(0, 0, targetWidth, targetHeight);
                cropContext.imageSmoothingEnabled = true;
                cropContext.imageSmoothingQuality = "high";
                cropContext.drawImage(cropped, 0, 0, targetWidth, targetHeight);
                layout.pixelWidth = targetWidth;
                layout.pixelHeight = targetHeight;
                layout.cssWidth = targetWidth / layout.outputScale;
                layout.cssHeight = targetHeight / layout.outputScale;
              }
            }
          } catch (renderError) {
            console.error("PDF render failed:", renderError);
            // Ensure canvas still has white background even if render fails
            context.fillStyle = "#ffffff";
            context.fillRect(0, 0, off.width, off.height);
          }

          const refined = enhanceRenderedCanvas(off);
          const displayCanvas = refined || off;
          const profile = getEnhancementProfile();
          if (activeView() === "Dark" || activeView() === "Sepia" || activeView() === "Comfort") {
            displayCanvas.style.filter = "none";
          } else {
            displayCanvas.style.filter = profile && profile.enabled ? profile.filter : "none";
          }

          const textLayer = document.createElement("div");
          textLayer.className = "pdf-text-layer";
          textLayer.setAttribute("aria-hidden", "true");
          textLayer.style.width = `${layout.cssWidth}px`;
          textLayer.style.height = `${layout.cssHeight}px`;
          try {
            if (layout.cropToContent) {
              return {
                status: "ready",
                pageNumber,
                canvas: off,
                textLayer,
                cssWidth: layout.cssWidth,
                cssHeight: layout.cssHeight,
                hasNativeTextLayer: false,
                outputScale: layout.outputScale,
                cssScale: layout.cssScale,
                contentBox: layout.contentBox,
                scrollLeft: 0,
                scrollTop: 0,
                shiftX: 0,
                shiftY: 0,
                key: layout.key,
              };
            }
            const textContent = await page.getTextContent();
            const textViewport = page.getViewport({ scale: layout.cssScale });
            const viewportTransform = textViewport.transform;
            for (const item of textContent.items || []) {
              try {
                if (!item?.str || !item.transform) continue;
                const itemTransform = item.transform;
                const transform = [
                  viewportTransform[0] * itemTransform[0] + viewportTransform[2] * itemTransform[1],
                  viewportTransform[1] * itemTransform[0] + viewportTransform[3] * itemTransform[1],
                  viewportTransform[0] * itemTransform[2] + viewportTransform[2] * itemTransform[3],
                  viewportTransform[1] * itemTransform[2] + viewportTransform[3] * itemTransform[3],
                  viewportTransform[0] * itemTransform[4] + viewportTransform[2] * itemTransform[5] + viewportTransform[4],
                  viewportTransform[1] * itemTransform[4] + viewportTransform[3] * itemTransform[5] + viewportTransform[5],
                ];
                const fontHeight = Math.max(1, Math.hypot(transform[2], transform[3]));
                const span = document.createElement("span");
                span.textContent = item.str;
                const cropOffsetX = layout.cropToContent ? layout.cropX * layout.cssScale : 0;
                const cropOffsetY = layout.cropToContent ? layout.cropY * layout.cssScale : 0;
                span.style.left = `${transform[4] - cropOffsetX}px`;
                span.style.top = `${transform[5] - fontHeight - cropOffsetY}px`;
                span.style.fontSize = `${fontHeight}px`;
                span.style.lineHeight = "1";
                span.style.fontFamily = "sans-serif";
                textLayer.appendChild(span);
                const measuredWidth = span.getBoundingClientRect().width;
                const targetWidth = Math.max(1, (Number(item.width) || 0) * layout.cssScale);
                if (measuredWidth > 0 && targetWidth > 0) {
                  span.style.transform = `scaleX(${targetWidth / measuredWidth})`;
                }
              } catch {
                /* Ignore one malformed glyph and keep the remaining text selectable. */
              }
            }
          } catch (textError) {
            console.warn("PDF text layer failed:", textError);
          }
          if (dictionaryMode && pageNumber === currentPage) {
            setDictionaryStatus(pageNumber, textLayer.childElementCount > 0);
          }
          return {
            status: "ready",
            pageNumber,
            canvas: displayCanvas,
            textLayer,
            cssWidth: layout.cssWidth,
            cssHeight: layout.cssHeight,
            hasNativeTextLayer: textLayer.childElementCount > 0,
            outputScale: layout.outputScale,
            cssScale: layout.cssScale,
            contentBox: layout.contentBox,
            scrollLeft: layout.scrollLeft,
            scrollTop: layout.scrollTop,
            shiftX: 0,
            shiftY: layout.shiftY || 0,
            key: layout.key,
          };
        };

        const renderPageToEntry = async (pageNumber) => {
          const page = await pdfDoc.getPage(pageNumber);
          let contentBox;
          try {
            contentBox = await getFocusBox(page, pageNumber);
          } catch (boxError) {
            console.warn("Content box detection failed, using full page:", boxError);
            const base = page.getViewport({ scale: 1 });
            contentBox = {
              x: 0,
              y: 0,
              w: base.width,
              h: base.height,
              pageW: base.width,
              pageH: base.height,
            };
          }
          const base = page.getViewport({ scale: 1 });
          const fullBox = {
            x: 0,
            y: 0,
            w: base.width,
            h: base.height,
            pageW: base.width,
            pageH: base.height,
          };
          const initialLargeScreenFit = isLargeScreen() && !largeScreenUserZoom;

          const tryRender = async (box, boost) => {
            const layout = computeLayout(page, box, boost);
            if (layout.pixelWidth < 2 || layout.pixelHeight < 2) {
              throw new Error("canvas too small");
            }
            return entryFromLayout(page, pageNumber, layout);
          };

          try {
            return await tryRender(initialLargeScreenFit ? fullBox : contentBox, 1);
          } catch (firstError) {
            console.warn("First render attempt failed:", firstError);
            try {
              return await tryRender(contentBox, 0.75);
            } catch (secondError) {
              console.warn("Second render attempt failed:", secondError);
              try {
                return await tryRender(fullBox, 0.5);
              } catch (thirdError) {
                console.warn("Third render attempt failed:", thirdError);
                try {
                  return await tryRender(fullBox, 0.35);
                } catch (finalError) {
                  console.error("All render attempts failed:", finalError);
                  throw finalError;
                }
              }
            }
          }
        };

        const cachePage = async (pageNumber) => {
          if (!pdfDoc) return null;
          const key = layoutKey();
          const existing = pageCache.get(pageNumber);
          if (existing?.status === "ready" && existing.key === key) {
            return existing;
          }
          if (existing?.status === "loading" && existing.key === key) {
            return existing.promise;
          }
          const promise = renderPageToEntry(pageNumber)
            .then((entry) => {
              if (entry.key !== layoutKey() && pageNumber !== currentPage) {
                releaseEntry(entry);
                if (pageCache.get(pageNumber)?.promise === promise) {
                  pageCache.delete(pageNumber);
                }
                return null;
              }
              const keep = new Set(pagesInWindow(currentPage));
              keep.add(currentPage);
              if (!keep.has(pageNumber) && pageNumber !== currentPage) {
                releaseEntry(entry);
                if (pageCache.get(pageNumber)?.promise === promise) {
                  pageCache.delete(pageNumber);
                }
                return null;
              }
              pageCache.set(pageNumber, entry);
              return entry;
            })
            .catch((err) => {
              if (pageCache.get(pageNumber)?.promise === promise) {
                pageCache.delete(pageNumber);
              }
              throw err;
            });
          pageCache.set(pageNumber, { status: "loading", promise, key });
          return promise;
        };

        const prefetchNeighbors = (center) => {
          window.clearTimeout(prefetchTimer);
          prefetchTimer = window.setTimeout(() => {
            for (const pageNum of pagesInWindow(center)) {
              if (pageNum === center) continue;
              const hit = pageCache.get(pageNum);
              if (hit?.status === "ready" && hit.key === lastLayoutKey) continue;
              if (hit?.status === "loading" && hit.key === lastLayoutKey) continue;
              void cachePage(pageNum).then((entry) => {
                if (dictionaryMode && entry) void buildOcrTextLayer(entry);
              });
            }
          }, lowMem ? 120 : 40);
        };

        const waitForWrapSize = () =>
          new Promise((resolve) => {
            const tick = (n) => {
              if ((wrap.clientWidth >= 80 && wrap.clientHeight >= 80) || n >= 45) {
                resolve();
                return;
              }
              requestAnimationFrame(() => tick(n + 1));
            };
            tick(0);
          });

        const notifyPageReady = (pageNumber) => {
          try {
            window.parent?.postMessage(
              { type: "pdf-viewer:page-ready", page: pageNumber, url: resolvedFileUrl },
              "*",
            );
          } catch {
            /* ignore */
          }
        };

        const renderPage = async (pageNumber) => {
          if (!pdfDoc) return;
          await waitForWrapSize();
          const myToken = ++renderToken;
          const targetPage = pageNumber; // Capture the intended page
          lastLayoutKey = layoutKey();

          const cached = pageCache.get(pageNumber);
          if (cached?.status === "ready" && cached.key === lastLayoutKey) {
            if (myToken !== renderToken) return;
            // Only mount if this is still the current intended page
            if (targetPage !== currentPage) return;
            mountEntry(cached);
            lastRenderedPage = targetPage; // Update last successfully rendered page
            prunePageCache(pageNumber);
            prefetchNeighbors(pageNumber);
            notifyPageReady(pageNumber);
            return;
          }

          const entry = await cachePage(pageNumber).catch((err) => {
            console.error("Failed to cache page:", err);
            // Don't show error for every navigation failure, just log it
            return null;
          });
          if (myToken !== renderToken) return;
          if (!entry) {
            // If render failed, try to keep the last rendered page visible
            if (lastRenderedPage && lastRenderedPage !== currentPage) {
              console.warn("Render failed, keeping last rendered page:", lastRenderedPage);
              // Don't update the displayed content, just notify page ready
              notifyPageReady(currentPage);
            }
            return;
          }
          // Only mount if this is still the current intended page
          if (targetPage !== currentPage) return;
          mountEntry(entry);
          lastRenderedPage = targetPage; // Update last successfully rendered page
          prunePageCache(pageNumber);
          prefetchNeighbors(pageNumber);
          notifyPageReady(pageNumber);
        };

        const showError = (msg) => {
          shell.innerHTML = `<div class="pdf-error">${msg}</div>`;
        };

        const openDocument = (source) => {
          const options =
            source instanceof ArrayBuffer || ArrayBuffer.isView(source)
              ? {
                  data: source instanceof Uint8Array ? source : new Uint8Array(source),
                  disableStream: true,
                  disableAutoFetch: true,
                  disableRange: true,
                  isEvalSupported: false,
                  maxImageSize: -1,
                  disableFontFace: false,
                  verbosity: 0,
                }
              : {
                  url: source,
                  disableStream: true,
                  disableAutoFetch: true,
                  disableRange: true,
                  isEvalSupported: false,
                  maxImageSize: -1,
                  disableFontFace: false,
                  verbosity: 0,
                };
          return window.pdfjsLib.getDocument(options).promise;
        };

        const loadPdfFromSource = async (source) => {
          if (loaded) return;
          loaded = true;
          try {
            let documentSource = source;
            if (typeof source === "string") {
              const response = await fetch(source);
              if (!response.ok) {
                throw new Error(`Book file request failed (${response.status}).`);
              }
              const buffer = await response.arrayBuffer();
              const header = new Uint8Array(buffer.slice(0, 5));
              const signature = String.fromCharCode(...header);
              if (signature !== "%PDF-") {
                throw new Error("The book file is not a valid PDF response.");
              }
              documentSource = buffer;
            }
            pdfDoc = await openDocument(documentSource);
            panelsByPage.clear();
            panelIndex = 0;
            currentPage = Math.min(Math.max(1, currentPage), pdfDoc.numPages);
            await ensureResolvedView(pdfDoc);
            lastLayoutKey = layoutKey();
            await renderPage(currentPage);
            try {
              window.parent?.postMessage(
                { type: "pdf-viewer:ready", numPages: pdfDoc.numPages, url: resolvedFileUrl },
                "*",
              );
            } catch {
              /* ignore */
            }
          } catch (err) {
            loaded = false;
            const detail = err && err.message ? String(err.message) : "Unknown error";
            showError(`Unable to load this PDF on this device. ${detail}`);
          }
        };

        window.addEventListener("message", (event) => {
          const data = event.data && typeof event.data === "object" ? event.data : null;
          if (!data || data.target !== "pdf-viewer") return;
          if (data.type === "load-buffer") {
            if (data.url && data.url !== resolvedFileUrl) return;
            if (typeof data.view === "string") {
              configuredView = normalizeView(data.view);
              resolvedView = configuredView === "Auto" ? null : configuredView;
            }
            if (Number.isFinite(Number(data.panel))) {
              panelIndex = Math.max(0, Math.floor(Number(data.panel)));
            }
            if (data.buffer instanceof ArrayBuffer) {
              loadPdfFromSource(data.buffer);
            } else if (typeof data.url === "string" && !loaded) {
              loadPdfFromSource(data.url);
            }
          } else if (data.type === "goto-page" || data.type === "go-to-page") {
            const n = Math.floor(Number(data.page));
            if (!Number.isFinite(n) || !pdfDoc) return;
            const targetPage = Math.min(Math.max(1, n), pdfDoc.numPages);
            // Only update and render if the target page is different from current
            if (targetPage !== currentPage) {
              currentPage = targetPage;
              if (dictionaryMode && dictionaryStatus) dictionaryStatus.classList.add("is-visible");
              panelIndex = 0;
              // Clear any stale rendered page reference
              lastRenderedPage = null;
              // Cancel any pending renders by incrementing token
              renderToken++;
              void renderPage(currentPage);
            }
          } else if (data.type === "set-zoom") {
            const next = Math.floor(Number(data.zoom));
            if (!Number.isFinite(next) || next < 50 || next > 300) return;
            if (data.userInitiated === true) largeScreenUserZoom = true;
            if (next === pageZoom) return;
            pageZoom = next;
            syncScrollMode();
            lastLayoutKey = layoutKey();
            prunePageCache(currentPage);
            if (pdfDoc) void renderPage(currentPage);
          } else if (data.type === "set-dictionary-mode") {
            dictionaryMode = data.enabled === true;
            wrap.classList.toggle("is-dictionary-mode", dictionaryMode);
            if (visibleTextLayer) {
              visibleTextLayer.classList.toggle("is-dictionary-enabled", dictionaryMode);
            }
            if (dictionaryMode && visibleEntry) void buildOcrTextLayer(visibleEntry);
            ensureDictionaryLayer();
            if (!dictionaryMode && dictionaryStatus) dictionaryStatus.classList.remove("is-visible");
            if (!dictionaryMode) window.getSelection()?.removeAllRanges();
          } else if (data.type === "set-view") {
            const next = normalizeView(data.view);
            if (next === configuredView && (next !== "Auto" || resolvedView)) return;
            configuredView = next;
            resolvedView = next === "Auto" ? null : next;
            panelsByPage.clear();
            contentBoxCache.clear();
            panelIndex = 0;
            const apply = async () => {
              if (!pdfDoc) return;
              await ensureResolvedView(pdfDoc);
              lastLayoutKey = layoutKey();
              prunePageCache(currentPage);
              await renderPage(currentPage);
            };
            void apply();
          } else if (data.type === "set-panel") {
            const next = Math.floor(Number(data.panel));
            if (!Number.isFinite(next)) return;
            goPanel(next);
          } else if (data.type === "reflow") {
            lastLayoutKey = "";
            if (pdfDoc) void renderPage(currentPage);
          }
        });

        const notifyDictionarySelection = () => {
          if (!dictionaryMode || !visibleTextLayer) return;
          const selection = window.getSelection();
          const text = selection?.toString().trim() || "";
          if (!text || !selection?.rangeCount) return;
          const range = selection.getRangeAt(0);
          const container = range.commonAncestorContainer;
          if (!container || !visibleTextLayer.contains(container)) return;
          postDictionarySelection(text);
        };
        document.addEventListener("selectionchange", notifyDictionarySelection);
        document.addEventListener("mouseup", notifyDictionarySelection);
        document.addEventListener("pointerup", notifyDictionarySelection, { passive: true });
        document.addEventListener(
          "touchend",
          () => {
            window.requestAnimationFrame(notifyDictionarySelection);
            const selection = window.getSelection();
            if (selection && selection.toString().trim()) {
              postDictionarySelection(selection.toString());
            }
          },
          { passive: true },
        );
        document.addEventListener(
          "touchcancel",
          () => {
            window.requestAnimationFrame(notifyDictionarySelection);
          },
          { passive: true },
        );

        /* If the parent never posts a buffer (iOS memory path), load by URL. */
        window.setTimeout(() => {
          if (!loaded) loadPdfFromSource(resolvedFileUrl);
        }, 50);

        let resizeTimer = 0;
        const onViewportChange = () => {
          if (!pdfDoc) return;
          window.clearTimeout(resizeTimer);
          resizeTimer = window.setTimeout(() => {
            if (layoutKey() === lastLayoutKey) return;
            lastLayoutKey = layoutKey();
            prunePageCache(currentPage);
            void renderPage(currentPage);
          }, 120);
        };
        window.addEventListener("resize", onViewportChange);
        window.visualViewport?.addEventListener("resize", onViewportChange);
        try {
          matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`).addEventListener("change", onViewportChange);
        } catch {
          /* older browsers */
        }
      })();
    </script>
  </body>
</html>
