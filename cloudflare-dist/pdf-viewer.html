<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Viewer</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #ffffff;
        color-scheme: only light;
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }
      .pdf-shell {
        flex: 1;
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 0;
        background: #ffffff;
      }
      .pdf-canvas-wrap {
        flex: 1;
        display: flex;
        align-items: flex-start;
        justify-content: flex-start;
        overflow-x: auto;
        overflow-y: auto;
        padding: 0;
        box-sizing: border-box;
        width: 100%;
        height: 100%;
        min-height: 0;
        -webkit-overflow-scrolling: touch;
        position: relative;
      }
      .pdf-theme-overlay {
        position: absolute;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        display: none;
        background: transparent;
      }
      /* Focus: keep native pan/scroll (swipe) — do not lock overflow. */
      .pdf-canvas-wrap.is-soft-focus {
        touch-action: pan-x pan-y;
        overscroll-behavior: contain;
      }
      .pdf-shell.is-dark {
        background: #0b1016;
      }
      .pdf-shell.is-dark .pdf-canvas-wrap {
        background:
          radial-gradient(circle at top, rgba(148, 163, 184, 0.09), transparent 42%),
          #0b1016;
        box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.18);
      }
      .pdf-shell.is-dark .pdf-theme-overlay {
        display: block;
        background: linear-gradient(180deg, rgba(12, 16, 22, 0.08), rgba(12, 16, 22, 0.26));
      }
      .pdf-shell.is-dark canvas {
        filter: brightness(0.96) contrast(1.08) saturate(0.72) sepia(0.12) hue-rotate(-8deg);
      }
      .pdf-shell.is-night {
        background: #101821;
      }
      .pdf-shell.is-night .pdf-canvas-wrap {
        background:
          radial-gradient(circle at top, rgba(163, 178, 194, 0.08), transparent 42%),
          #101821;
        box-shadow: inset 0 0 0 1px rgba(144, 169, 201, 0.18);
      }
      .pdf-shell.is-night .pdf-theme-overlay {
        display: block;
        background: linear-gradient(180deg, rgba(11, 15, 22, 0.14), rgba(11, 15, 22, 0.22));
      }
      .pdf-shell.is-night canvas {
        filter: brightness(0.9) contrast(1.16) saturate(0.66) sepia(0.08) hue-rotate(-12deg);
      }
      .pdf-shell.is-sepia {
        background: #f0e4cc;
      }
      .pdf-shell.is-sepia .pdf-canvas-wrap {
        background:
          radial-gradient(circle at top, rgba(136, 86, 44, 0.08), transparent 38%),
          #f0e4cc;
        box-shadow: inset 0 0 0 1px rgba(120, 83, 40, 0.16);
      }
      .pdf-shell.is-sepia .pdf-theme-overlay {
        display: block;
        background: linear-gradient(180deg, rgba(142, 111, 79, 0.08), rgba(111, 78, 40, 0.14));
      }
      .pdf-shell.is-sepia canvas {
        filter: sepia(0.75) saturate(0.8) brightness(0.96) contrast(1.05);
      }
      .pdf-shell.is-comfort {
        background: #efe5d9;
      }
      .pdf-shell.is-comfort .pdf-canvas-wrap {
        background:
          radial-gradient(circle at top, rgba(118, 93, 71, 0.08), transparent 36%),
          #efe5d9;
        touch-action: pan-y;
        overscroll-behavior: none;
        scroll-behavior: smooth;
        box-shadow: inset 0 0 0 1px rgba(118, 93, 71, 0.12);
      }
      .pdf-shell.is-comfort .pdf-theme-overlay {
        display: block;
        background: linear-gradient(180deg, rgba(112, 90, 72, 0.08), rgba(91, 75, 62, 0.12));
      }
      .pdf-shell.is-comfort canvas {
        filter: sepia(0.22) saturate(0.88) brightness(0.94) contrast(1.03);
      }
      .pdf-comfort-guide {
        display: none;
        position: absolute;
        left: 0;
        right: 0;
        top: 42%;
        height: 2.4em;
        transform: translateY(-50%);
        z-index: 2;
        border-top: 1px solid rgba(255, 224, 173, 0.12);
        border-bottom: 1px solid rgba(255, 224, 173, 0.12);
        background: rgba(255, 224, 173, 0.045);
        pointer-events: none;
      }
      .pdf-shell.is-comfort .pdf-comfort-guide {
        display: block;
      }
      .pdf-canvas-wrap.is-dictionary-mode {
        touch-action: auto;
      }
      canvas {
        position: relative;
        z-index: 0;
        display: block;
        margin: 0;
        background: #ffffff;
        box-shadow: none;
        image-rendering: auto;
        filter: contrast(1.08) saturate(1.05) brightness(1.02);
        transform: translateZ(0);
        flex: 0 0 auto;
        will-change: transform;
      }
      .pdf-text-layer {
        position: absolute;
        left: 0;
        top: 0;
        z-index: 2;
        overflow: hidden;
        color: rgba(15, 23, 42, 0.14);
        background: rgba(255, 255, 255, 0.01);
        pointer-events: none;
        user-select: text;
        -webkit-user-select: text;
        -webkit-touch-callout: default;
        touch-action: text;
        transform-origin: 0 0;
      }
      .pdf-text-layer.is-dictionary-enabled {
        pointer-events: auto;
        user-select: text;
        -webkit-user-select: text;
        visibility: visible;
        z-index: 3;
      }
      .pdf-text-layer:not(.is-dictionary-enabled) {
        visibility: hidden;
      }
      .pdf-text-layer span {
        position: absolute;
        display: inline-block;
        white-space: pre;
        color: transparent;
        -webkit-text-fill-color: transparent;
        cursor: text;
        user-select: text;
        -webkit-user-select: text;
        -webkit-touch-callout: default;
        touch-action: auto;
        transform-origin: 0 0;
      }
      .pdf-canvas-wrap.is-dictionary-mode canvas {
        pointer-events: none;
      }
      .pdf-canvas-wrap.is-dictionary-mode .pdf-text-layer.is-dictionary-enabled,
      .pdf-canvas-wrap.is-dictionary-mode .pdf-text-layer.is-dictionary-enabled span {
        user-select: text !important;
        -webkit-user-select: text !important;
        cursor: text;
      }
      .pdf-text-layer span::selection {
        background: rgba(37, 99, 235, 0.28);
        color: transparent;
        -webkit-text-fill-color: transparent;
      }
      @media (max-width: 767px) {
        .pdf-shell {
          background: #ffffff;
        }
        .pdf-canvas-wrap {
          padding: 0;
          background: #ffffff;
        }
      }
      .pdf-error {
        margin: auto;
        padding: 24px;
        color: #7a1f1f;
        background: #fff1f0;
        border: 1px solid #f3c6c4;
        border-radius: 12px;
        max-width: 640px;
      }
      .pdf-shell {
        position: relative;
      }
      .pdf-dictionary-status {
        display: none;
        position: absolute;
        left: 50%;
        bottom: 18px;
        z-index: 4;
        transform: translateX(-50%);
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border: 1px solid rgba(148, 163, 184, 0.45);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.94);
        color: #334155;
        box-shadow: 0 4px 16px rgba(15, 23, 42, 0.18);
        font-size: 13px;
        white-space: nowrap;
        pointer-events: none;
      }
      .pdf-dictionary-status.is-visible {
        display: flex;
      }
      .pdf-dictionary-status-emoji {
        font-size: 18px;
        animation: pdf-dictionary-bounce 0.9s ease-in-out infinite alternate;
      }
      @keyframes pdf-dictionary-bounce {
        from { transform: translateY(1px) rotate(-5deg); }
        to { transform: translateY(-3px) rotate(5deg); }
      }
      .pdf-panel-nav {
        display: none;
        pointer-events: none;
        position: absolute;
        inset: 0;
        z-index: 5;
      }
      .pdf-shell.is-panel-jump .pdf-panel-nav {
        display: block;
      }
      .pdf-panel-arrow {
        pointer-events: auto;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 44px;
        height: 44px;
        border: 0;
        border-radius: 999px;
        background: rgba(20, 24, 40, 0.55);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.22);
      }
      .pdf-panel-arrow svg {
        width: 22px;
        height: 22px;
        display: block;
      }
      .pdf-panel-arrow--left {
        left: 10px;
        animation: pdf-panel-nudge-left 1.35s ease-in-out infinite;
      }
      .pdf-panel-arrow--right {
        right: 10px;
        animation: pdf-panel-nudge-right 1.35s ease-in-out infinite;
      }
      .pdf-panel-arrow:disabled,
      .pdf-panel-arrow.is-hidden {
        opacity: 0;
        pointer-events: none;
        animation: none;
      }
      .pdf-panel-dots {
        pointer-events: none;
        position: absolute;
        left: 50%;
        bottom: 14px;
        transform: translateX(-50%);
        display: flex;
        gap: 7px;
      }
      .pdf-panel-dots span {
        width: 7px;
        height: 7px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.45);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.2);
      }
      .pdf-panel-dots span.is-active {
        background: #fff;
        transform: scale(1.15);
      }
      @keyframes pdf-panel-nudge-right {
        0%,
        100% {
          transform: translateY(-50%) translateX(0);
        }
        50% {
          transform: translateY(-50%) translateX(6px);
        }
      }
      @keyframes pdf-panel-nudge-left {
        0%,
        100% {
          transform: translateY(-50%) translateX(0);
        }
        50% {
          transform: translateY(-50%) translateX(-6px);
        }
      }
    </style>
  </head>
  <body>
    <div class="pdf-shell">
      <div class="pdf-canvas-wrap" id="pdf-wrap">
        <div class="pdf-theme-overlay" aria-hidden="true"></div>
        <canvas id="pdf-canvas"></canvas>
      </div>
      <div class="pdf-comfort-guide" aria-hidden="true"></div>
      <div class="pdf-dictionary-status" id="pdf-dictionary-status" role="status" aria-live="polite">
        <span class="pdf-dictionary-status-emoji" aria-hidden="true">📚</span>
        <span>Preparing text...</span>
      </div>
      <div class="pdf-panel-nav" id="pdf-panel-nav" aria-hidden="true">
        <button type="button" class="pdf-panel-arrow pdf-panel-arrow--left is-hidden" id="pdf-panel-prev" aria-label="Previous panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" class="pdf-panel-arrow pdf-panel-arrow--right" id="pdf-panel-next" aria-label="Next panel">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <div class="pdf-panel-dots" id="pdf-panel-dots" aria-hidden="true">
          <span class="is-active"></span><span></span>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      (() => {
        const params = new URLSearchParams(window.location.search);
        const fileUrl = params.get("file");
        const wrap = document.getElementById("pdf-wrap");
        const shell = document.querySelector(".pdf-shell");
        const dictionaryStatus = document.getElementById("pdf-dictionary-status");
        const panelPrevBtn = document.getElementById("pdf-panel-prev");
        const panelNextBtn = document.getElementById("pdf-panel-next");
        const panelDots = document.getElementById("pdf-panel-dots");

        if (!fileUrl) {
          shell.innerHTML = '<div class="pdf-error">No PDF file source was provided.</div>';
          return;
        }

        const pageParam = Number.parseInt(params.get("page") ?? "", 10);
        const pageMatch = fileUrl.match(/#page=(\d+)/i) ?? fileUrl.match(/\?page=(\d+)/i);
        let currentPage = Number.parseInt(pageMatch?.[1] ?? "1", 10);
        if (Number.isFinite(pageParam) && pageParam >= 1) {
          currentPage = pageParam;
        }
        const resolvedFileUrl = fileUrl.replace(/#page=\d+/i, "").replace(/\?page=\d+/i, "");

        if (!window.pdfjsLib || !window.pdfjsLib.getDocument) {
          shell.innerHTML = '<div class="pdf-error">PDF.js failed to load. Please retry.</div>';
          return;
        }

        window.pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

        const ua = navigator.userAgent || "";
        const isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const shortSide = Math.min(window.screen?.width || window.innerWidth, window.screen?.height || window.innerHeight);
        const isMiniClass = shortSide <= 768;
        const deviceMem = Number(navigator.deviceMemory) || 0;
        const lowMem = isIOS || isMiniClass || (deviceMem > 0 && deviceMem <= 4);

        /* Keep rendered bitmaps only around the current page. */
        const PAGE_WINDOW = lowMem ? 1 : 2;
        const MAX_CANVAS_PIXELS = lowMem ? 6291456 : 16777216;
        const pageCache = new Map();
        /** @type {Map<string, object>} */
        const contentBoxCache = new Map();
        let pdfDoc = null;
        let renderToken = 0;
        let loaded = false;
        let lastLayoutKey = "";
        let prefetchTimer = 0;
        let visibleCanvas = null;
        let visibleTextLayer = null;
        let visibleEntry = null;
        let dictionaryMode = params.get("dictionary") === "1";
        let largeScreenUserZoom = false;
        let ocrWorkerPromise = null;
        const ocrWordsCache = new Map();
        const ocrPromises = new Map();
        let pageZoom = 100;
        let lastRenderedPage = null; // Track the last successfully rendered page
        const zoomParam = Number(params.get("zoom"));
        if (Number.isFinite(zoomParam) && zoomParam >= 50 && zoomParam <= 300) {
          pageZoom = Math.round(zoomParam / 5) * 5;
        }
        currentPage = Math.max(1, Number.isFinite(currentPage) ? currentPage : 1);

        const VIEW_MODES = [
          "Auto",
          "ComicView",
          "NormalView",
          "MediumView",
          "LargeView",
          "ExtraLargeView",
          "Normal",
          "Fit",
          "Reader",
          "Dark",
          "Night",
          "Sepia",
          "Comfort",
          "SoftFocus",
          "NormalFocus",
          "BasicFocus",
          "MediumFocus",
          "HardFocus",
          "PanelJump",
        ];
        const FOCUS_MODES = new Set([
          "SoftFocus",
          "NormalFocus",
          "BasicFocus",
          "MediumFocus",
          "HardFocus",
        ]);
        const PRESET_ZOOM = {
          ComicView: 140,
          NormalView: 135,
          MediumView: 155,
          LargeView: 175,
          ExtraLargeView: 195,
        };
        const normalizeView = (value) => {
          const raw = typeof value === "string" ? value.trim() : "";
          return VIEW_MODES.includes(raw) ? raw : "Auto";
        };
        let configuredView = normalizeView(params.get("view"));
        let resolvedView = configuredView === "Auto" ? null : configuredView;
        let panelIndex = Math.max(0, Math.floor(Number(params.get("panel")) || 0));
        let panelCount = 2;
        /** @type {Map<number, Array<{x:number,y:number,w:number,h:number,pageW:number,pageH:number}>>} */
        const panelsByPage = new Map();

        const notifyViewMode = (mode) => {
          try {
            window.parent?.postMessage({ type: "pdf-viewer:view-mode", viewMode: mode }, "*");
          } catch {
            /* ignore */
          }
        };

        /* Auto on narrow stays Auto (SoftFocus layout). Landscape always fit. */
        const activeView = () => resolvedView || (configuredView === "Auto" ? "SoftFocus" : configuredView);
        const isTopCenterMode = (mode = activeView()) =>
          mode === "NormalView" ||
          mode === "MediumView" ||
          mode === "LargeView" ||
          mode === "ExtraLargeView" ||
          mode === "Normal";
        const isComicView = (mode = activeView()) => mode === "ComicView";
        const isReaderMode = (mode = activeView()) => mode === "Reader";
        const isDarkMode = (mode = activeView()) => mode === "Dark";
        const isNightMode = (mode = activeView()) => mode === "Night";
        const isSepiaMode = (mode = activeView()) => mode === "Sepia";
        const isComfortMode = (mode = activeView()) => mode === "Comfort";
        const isFocusMode = (mode = activeView()) => FOCUS_MODES.has(mode);
        const presetZoomPct = () => PRESET_ZOOM[configuredView] || PRESET_ZOOM[activeView()] || 0;

        /**
         * Focus aggressiveness for eliminating PDF / scan white padding.
         * NormalFocus < BasicFocus < MediumFocus/SoftFocus < HardFocus.
         */
        const focusProfile = () => {
          const mode = activeView();
          if (mode === "NormalFocus") {
            return {
              id: "normal",
              padXFrac: 0.045,
              padYFrac: 0.035,
              padXPage: 0.028,
              padYPage: 0.022,
              padXMax: 0.07,
              padYMax: 0.055,
              frameX: 0.012,
              frameY: 0.01,
              massX: 0.006,
              massY: 0.005,
              peakCol: 0.025,
              peakRow: 0.025,
              sideInset: 10,
              hangMul: 0.75,
              bodyBand: 0.06,
            };
          }
          if (mode === "BasicFocus") {
            return {
              id: "basic",
              padXFrac: 0.025,
              padYFrac: 0.02,
              padXPage: 0.016,
              padYPage: 0.014,
              padXMax: 0.04,
              padYMax: 0.035,
              frameX: 0.022,
              frameY: 0.018,
              massX: 0.012,
              massY: 0.01,
              peakCol: 0.045,
              peakRow: 0.04,
              sideInset: 6,
              hangMul: 0.55,
              bodyBand: 0.08,
            };
          }
          if (mode === "HardFocus") {
            return {
              id: "hard",
              padXFrac: 0.004,
              padYFrac: 0.004,
              padXPage: 0.002,
              padYPage: 0.002,
              padXMax: 0.01,
              padYMax: 0.012,
              frameX: 0.045,
              frameY: 0.04,
              massX: 0.038,
              massY: 0.03,
              peakCol: 0.11,
              peakRow: 0.09,
              sideInset: 2,
              hangMul: 0.22,
              bodyBand: 0.12,
            };
          }
          if (mode === "Reader") {
            return {
              id: "reader",
              padXFrac: 0,
              padYFrac: 0,
              padXPage: 0,
              padYPage: 0,
              padXMax: 0,
              padYMax: 0,
              frameX: 0,
              frameY: 0,
              massX: 0,
              massY: 0,
              peakCol: 0.01,
              peakRow: 0.01,
              sideInset: 2,
              hangMul: 0.08,
              bodyBand: 0.08,
            };
          }
          if (mode === "ComicView") {
            return {
              id: "comic",
              padXFrac: 0.012,
              padYFrac: 0.01,
              padXPage: 0.008,
              padYPage: 0.006,
              padXMax: 0.024,
              padYMax: 0.02,
              frameX: 0.02,
              frameY: 0.016,
              massX: 0.014,
              massY: 0.01,
              peakCol: 0.05,
              peakRow: 0.04,
              sideInset: 4,
              hangMul: 0.4,
              bodyBand: 0.08,
            };
          }
          /* MediumFocus + SoftFocus (legacy) */
          return {
            id: "medium",
            padXFrac: 0.012,
            padYFrac: 0.012,
            padXPage: 0.008,
            padYPage: 0.008,
            padXMax: 0.02,
            padYMax: 0.025,
            frameX: 0.03,
            frameY: 0.025,
            massX: 0.022,
            massY: 0.014,
            peakCol: 0.07,
            peakRow: 0.05,
            sideInset: 4,
            hangMul: 0.4,
            bodyBand: 0.1,
          };
        };

        const syncScrollMode = () => {
          const mode = activeView();
          const focus = isFocusMode(mode);
          const dark = isDarkMode(mode);
          const night = isNightMode(mode);
          const sepia = isSepiaMode(mode);
          const comfort = isComfortMode(mode);
          shell.classList.toggle("is-dark", dark);
          shell.classList.toggle("is-night", night);
          shell.classList.toggle("is-sepia", sepia);
          shell.classList.toggle("is-comfort", comfort);
          wrap.classList.toggle("is-soft-focus", focus);
          wrap.style.overflowX = "auto";
          wrap.style.overflowY = "auto";
          wrap.style.alignItems = "flex-start";
          wrap.style.justifyContent = "flex-start";
          if (mode === "PanelJump") {
            wrap.style.overflowX = "hidden";
          }
          if (comfort || dark || sepia) {
            wrap.style.overflowX = "auto";
          }
        };
        syncScrollMode();

        const clampChannel = (value) => Math.min(255, Math.max(0, value));
        const buildTextMask = (imageData) => {
          const { data, width, height } = imageData;
          const mask = new Uint8Array(width * height);

          for (let y = 1; y < height - 1; y += 1) {
            for (let x = 1; x < width - 1; x += 1) {
              const idx = (y * width + x) * 4;
              const r = data[idx];
              const g = data[idx + 1];
              const b = data[idx + 2];
              const maxC = Math.max(r, g, b);
              const minC = Math.min(r, g, b);
              const sat = maxC - minC;
              const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;

              if (lum > 235) continue;
              if (sat > 18) continue;
              if (maxC > 105) continue;

              let localLum = 0;
              let count = 0;
              for (let yy = -1; yy <= 1; yy += 1) {
                for (let xx = -1; xx <= 1; xx += 1) {
                  const nIdx = ((y + yy) * width + (x + xx)) * 4;
                  const nr = data[nIdx];
                  const ng = data[nIdx + 1];
                  const nb = data[nIdx + 2];
                  localLum += 0.2126 * nr + 0.7152 * ng + 0.0722 * nb;
                  count += 1;
                }
              }
              const contrast = Math.abs(lum - (localLum / count));
              if (contrast >= 8 && lum < 185 && maxC < 105) {
                mask[y * width + x] = 1;
              }
            }
          }
          return mask;
        };

        const sharpenTextOnly = (imageData, strength = 8) => {
          const { data, width, height } = imageData;
          const output = new Uint8ClampedArray(data.length);
          const mask = buildTextMask(imageData);

          for (let y = 1; y < height - 1; y += 1) {
            for (let x = 1; x < width - 1; x += 1) {
              const idx = (y * width + x) * 4;
              const inMask = mask[y * width + x];
              if (!inMask) {
                output[idx] = data[idx];
                output[idx + 1] = data[idx + 1];
                output[idx + 2] = data[idx + 2];
                output[idx + 3] = data[idx + 3];
                continue;
              }

              let rSum = 0;
              let gSum = 0;
              let bSum = 0;
              let count = 0;
              for (let yy = -1; yy <= 1; yy += 1) {
                for (let xx = -1; xx <= 1; xx += 1) {
                  if (xx === 0 && yy === 0) continue;
                  const nIdx = ((y + yy) * width + (x + xx)) * 4;
                  rSum += data[nIdx];
                  gSum += data[nIdx + 1];
                  bSum += data[nIdx + 2];
                  count += 1;
                }
              }
              const avgR = rSum / count;
              const avgG = gSum / count;
              const avgB = bSum / count;

              const baseR = data[idx];
              const baseG = data[idx + 1];
              const baseB = data[idx + 2];
              const sharpenR = baseR + (baseR - avgR) * strength;
              const sharpenG = baseG + (baseG - avgG) * strength;
              const sharpenB = baseB + (baseB - avgB) * strength;

              output[idx] = clampChannel(sharpenR);
              output[idx + 1] = clampChannel(sharpenG);
              output[idx + 2] = clampChannel(sharpenB);
              output[idx + 3] = data[idx + 3];
            }
          }
          return new ImageData(output, width, height);
        };

        const getEnhancementProfile = () => {
          const mode = activeView();
          const allModes = new Set([
            "Auto",
            "Normal",
            "Reader",
            "NormalView",
            "MediumView",
            "LargeView",
            "ExtraLargeView",
            "SoftFocus",
            "NormalFocus",
            "BasicFocus",
            "MediumFocus",
            "HardFocus",
            "ComicView",
            "PanelJump",
            "Fit",
          ]);
          if (!allModes.has(mode)) {
            return null;
          }
          return {
            enabled: true,
            strength: 10,
            filter: "contrast(1.18) brightness(1.04)",
          };
        };

        const applyThemeToRenderedCanvas = (sourceCanvas) => {
          const mode = activeView();
          if (mode !== "Dark" && mode !== "Night" && mode !== "Sepia" && mode !== "Comfort") {
            return sourceCanvas;
          }

          const theme = {
            Dark: {
              bg: [11, 15, 20],
              text: [214, 220, 230],
              paperThreshold: 210,
              textLift: 0.28,
              paperLift: 0.28,
            },
            Night: {
              bg: [15, 21, 28],
              text: [214, 220, 230],
              paperThreshold: 205,
              textLift: 0.24,
              paperLift: 0.26,
            },
            Sepia: {
              bg: [242, 230, 205],
              text: [52, 42, 33],
              paperThreshold: 218,
              textLift: 0.2,
              paperLift: 0.22,
            },
            Comfort: {
              bg: [239, 229, 216],
              text: [54, 43, 34],
              paperThreshold: 218,
              textLift: 0.18,
              paperLift: 0.2,
            },
          }[mode];

          const target = document.createElement("canvas");
          target.width = sourceCanvas.width;
          target.height = sourceCanvas.height;
          const ctx = target.getContext("2d", { alpha: false });
          if (!ctx) return sourceCanvas;

          ctx.drawImage(sourceCanvas, 0, 0);
          const image = ctx.getImageData(0, 0, target.width, target.height);
          const data = image.data;
          const [bgR, bgG, bgB] = theme.bg;
          const [textR, textG, textB] = theme.text;

          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            const lum = 0.299 * r + 0.587 * g + 0.114 * b;

            if (lum > theme.paperThreshold) {
              const paperMix = theme.paperLift;
              data[i] = Math.round(r * (1 - paperMix) + bgR * paperMix);
              data[i + 1] = Math.round(g * (1 - paperMix) + bgG * paperMix);
              data[i + 2] = Math.round(b * (1 - paperMix) + bgB * paperMix);
              continue;
            }

            const lift = theme.textLift;
            const blend = (value, targetValue) => Math.round(value * (1 - lift) + targetValue * lift);
            data[i] = blend(r, textR);
            data[i + 1] = blend(g, textG);
            data[i + 2] = blend(b, textB);
          }

          ctx.putImageData(image, 0, 0);
          return target;
        };

        const enhanceRenderedCanvas = (sourceCanvas) => {
          const target = document.createElement("canvas");
          target.width = sourceCanvas.width;
          target.height = sourceCanvas.height;
          const context = target.getContext("2d", { alpha: false });
          if (!context) return sourceCanvas;

          const profile = getEnhancementProfile();
          if (!profile || !profile.enabled) {
            const themed = applyThemeToRenderedCanvas(sourceCanvas);
            return themed;
          }

          context.filter = profile.filter;
          context.drawImage(sourceCanvas, 0, 0);

          const base = context.getImageData(0, 0, target.width, target.height);
          const refined = sharpenTextOnly(base, profile.strength);
          context.putImageData(refined, 0, 0);

          const themed = applyThemeToRenderedCanvas(target);
          return themed;
        };

        /* iPad portrait + landscape (and similar tablets) — large reading surface. */
        const isLargeScreen = () => {
          const w = Math.max(80, wrap.clientWidth);
          const h = Math.max(80, wrap.clientHeight);
          const screenMin = Math.min(window.screen?.width || w, window.screen?.height || h);
          return screenMin >= 700 || (w >= 700 && h >= 500);
        };

        const isLargeLandscape = () =>
          isLargeScreen() && wrap.clientWidth > wrap.clientHeight;

        const layoutKey = () =>
          `${wrap.clientWidth}x${wrap.clientHeight}@${window.devicePixelRatio || 1}:${pageZoom}:${lowMem ? "l" : "h"}:${activeView()}:p${panelIndex}/${panelCount}:f${focusProfile().id}:${isLargeScreen() ? "lg" : "sm"}:${largeScreenUserZoom ? "manual" : "initial"}`;

        const pagesInWindow = (center) => {
          if (!pdfDoc) return [];
          const pages = [];
          for (let i = center - PAGE_WINDOW; i <= center + PAGE_WINDOW; i += 1) {
            if (i >= 1 && i <= pdfDoc.numPages) pages.push(i);
          }
          return pages;
        };

        const releaseEntry = (entry) => {
          if (!entry?.canvas) return;
          if (entry.canvas === visibleCanvas) {
            /* Keep on-screen page until a new mount replaces it (anti-flicker). */
            return;
          }
          releaseVisibleIf(entry.canvas);
          releaseVisibleIf(entry.textLayer);
          entry.canvas.width = 0;
          entry.canvas.height = 0;
        };

        const prunePageCache = (center) => {
          const keep = new Set(pagesInWindow(center));
          keep.add(center);
          const key = lastLayoutKey || layoutKey();
          for (const [pageNum, entry] of pageCache.entries()) {
            if (pageNum === center) continue;
            if (entry.canvas && entry.canvas === visibleCanvas) continue;
            const staleLayout = entry.status === "ready" && entry.key !== key;
            if (!keep.has(pageNum) || staleLayout) {
              if (entry.status === "ready") releaseEntry(entry);
              pageCache.delete(pageNum);
            }
          }
        };

        /**
         * Text-layer bounds. Horizontal span prefers BODY glyphs (skips header
         * title / page number that stretch the box to full page width and leave
         * a big empty right margin on kids books).
         */
        const getTextMetrics = async (page, pageW, pageH) => {
          try {
            const text = await page.getTextContent();
            const items = text?.items;
            if (!items || items.length < 3) return null;
            const viewport = page.getViewport({ scale: 1 });
            const Util = window.pdfjsLib.Util;
            const glyphs = [];
            const heights = [];
            for (const item of items) {
              if (!item?.transform) continue;
              const str = typeof item.str === "string" ? item.str.trim() : "";
              if (!str) continue;
              const m = Util.transform(viewport.transform, item.transform);
              const x = m[4];
              const y = m[5];
              const w = (typeof item.width === "number" ? item.width : 0) * Math.abs(m[0] || 1);
              const h =
                (typeof item.height === "number" ? item.height : 0) * Math.abs(m[3] || 1) ||
                Math.hypot(m[2], m[3]) ||
                8;
              if (!Number.isFinite(x) || !Number.isFinite(y) || h < 0.5) continue;
              const top = y - h;
              glyphs.push({ x, top, right: x + Math.max(w, 0), bottom: y, h });
              if (h < pageH * 0.08) heights.push(h);
            }
            if (glyphs.length < 2) return null;

            let minX = Infinity;
            let minY = Infinity;
            let maxX = -Infinity;
            let maxY = -Infinity;
            for (const g of glyphs) {
              minX = Math.min(minX, g.x);
              maxX = Math.max(maxX, g.right);
              minY = Math.min(minY, g.top);
              maxY = Math.max(maxY, g.bottom);
            }

            /* Body band: ignore top/bottom chrome for horizontal crop. */
            const fp = focusProfile();
            const bandTop = pageH * fp.bodyBand;
            const bandBot = pageH * (1 - fp.bodyBand);
            const body = glyphs.filter((g) => g.top >= bandTop && g.bottom <= bandBot);
            if (body.length >= 4) {
              let bx0 = Infinity;
              let bx1 = -Infinity;
              for (const g of body) {
                bx0 = Math.min(bx0, g.x);
                bx1 = Math.max(bx1, g.right);
              }
              if (bx1 > bx0) {
                minX = bx0;
                maxX = bx1;
              }
            }

            const sorted = heights.slice().sort((a, b) => a - b);
            const medianTextH = sorted.length
              ? sorted[Math.floor((sorted.length - 1) * 0.5)]
              : 0;
            const hang = Math.max(medianTextH * fp.hangMul, pageW * (0.012 + fp.hangMul * 0.02));
            minX = Math.max(0, minX - hang);
            maxX = Math.min(pageW, maxX + hang);
            minY = Math.max(0, minY - hang * 0.35);
            maxY = Math.min(pageH, maxY + hang * 0.35);

            return {
              box: {
                x: minX,
                y: minY,
                w: Math.max(1, maxX - minX),
                h: Math.max(1, maxY - minY),
              },
              medianTextH,
              sampleCount: glyphs.length,
            };
          } catch {
            return null;
          }
        };

        /**
         * Soft ink bounds — trim paper only.
         * Aggressiveness comes from focusProfile() (Normal…Hard Focus).
         */
        const inkBoundsFromImageData = (imageData) => {
          const { data, width, height } = imageData;
          if (width < 8 || height < 8) return null;
          const fp = focusProfile();

          /* Skip outer scan frame — black edge lines live here. */
          const frameX = Math.max(2, Math.floor(width * fp.frameX));
          const frameY = Math.max(2, Math.floor(height * fp.frameY));
          const x0 = frameX;
          const x1 = width - 1 - frameX;
          const y0 = frameY;
          const y1 = height - 1 - frameY;
          if (x1 <= x0 || y1 <= y0) return null;

          /* Estimate paper from border ring samples. */
          let paperSum = 0;
          let paperN = 0;
          const ring = Math.max(2, Math.floor(Math.min(width, height) * 0.04));
          const samplePaper = (x, y) => {
            const i = (y * width + x) * 4;
            paperSum += data[i] + data[i + 1] + data[i + 2];
            paperN += 1;
          };
          for (let x = 0; x < width; x += 3) {
            for (let t = 0; t < ring; t += 2) {
              samplePaper(x, t);
              samplePaper(x, height - 1 - t);
            }
          }
          for (let y = ring; y < height - ring; y += 3) {
            for (let t = 0; t < ring; t += 2) {
              samplePaper(t, y);
              samplePaper(width - 1 - t, y);
            }
          }
          const paper = paperN ? paperSum / paperN : 765;
          /* Darker than paper by ~12% — gray paper stays "paper", ink is ink. */
          const inkCutoff = Math.min(755, Math.max(520, paper - Math.max(55, paper * 0.12)));

          const colCounts = new Int32Array(width);
          const rowCounts = new Int32Array(height);
          let total = 0;
          const step = width * height > 220000 ? 2 : 1;

          for (let y = y0; y <= y1; y += step) {
            for (let x = x0; x <= x1; x += step) {
              const i = (y * width + x) * 4;
              if (data[i] + data[i + 1] + data[i + 2] >= inkCutoff) continue;
              colCounts[x] += 1;
              rowCounts[y] += 1;
              total += 1;
            }
          }
          if (total < 24) return null;

          const trimMass = (counts, from, to, dropFrac) => {
            const budget = Math.max(1, Math.floor(total * dropFrac));
            let lo = from;
            let hi = to;
            let acc = 0;
            while (lo < hi && acc + counts[lo] <= budget) {
              acc += counts[lo];
              lo += 1;
            }
            acc = 0;
            while (hi > lo && acc + counts[hi] <= budget) {
              acc += counts[hi];
              hi -= 1;
            }
            return [lo, hi];
          };

          /* Drop sparse edge dust; Hard Focus drops more mass from L/R. */
          let [minX, maxX] = trimMass(colCounts, x0, x1, fp.massX);
          let [minY, maxY] = trimMass(rowCounts, y0, y1, fp.massY);

          let peakCol = 1;
          let peakRow = 1;
          for (let x = minX; x <= maxX; x += 1) peakCol = Math.max(peakCol, colCounts[x]);
          for (let y = minY; y <= maxY; y += 1) peakRow = Math.max(peakRow, rowCounts[y]);
          const minCol = Math.max(1, Math.floor(peakCol * fp.peakCol));
          const minRow = Math.max(1, Math.floor(peakRow * fp.peakRow));
          while (minX < maxX && colCounts[minX] < minCol) minX += 1;
          while (maxX > minX && colCounts[maxX] < minCol) maxX -= 1;
          while (minY < maxY && rowCounts[minY] < minRow) minY += 1;
          while (maxY > minY && rowCounts[maxY] < minRow) maxY -= 1;

          if (maxX <= minX || maxY <= minY) return null;

          /* Harder focus → smaller safety pad around ink. */
          const padFrac = Math.max(0.002, Math.min(0.014, 0.014 - (fp.massX - 0.006) * 0.2));
          const pad = Math.max(fp.id === "hard" ? 1 : 2, Math.round(Math.min(width, height) * padFrac));
          minX = Math.max(0, minX - pad);
          minY = Math.max(0, minY - pad);
          maxX = Math.min(width - 1, maxX + pad);
          maxY = Math.min(height - 1, maxY + pad);

          return {
            x: minX,
            y: minY,
            w: maxX - minX + 1,
            h: maxY - minY + 1,
            width,
            height,
          };
        };

        /**
         * Focus pad around content — Hard Focus keeps almost no white border.
         */
        const padContentBox = (box, pageW, pageH) => {
          const fp = focusProfile();
          const padX = Math.min(Math.max(box.w * fp.padXFrac, pageW * fp.padXPage), pageW * fp.padXMax);
          const padY = Math.min(Math.max(box.h * fp.padYFrac, pageH * fp.padYPage), pageH * fp.padYMax);
          const x = Math.max(0, box.x - padX);
          const y = Math.max(0, box.y - padY);
          const r = Math.min(pageW, box.x + box.w + padX);
          const b = Math.min(pageH, box.y + box.h + padY);
          return { x, y, w: Math.max(1, r - x), h: Math.max(1, b - y), pageW, pageH };
        };

        const unionBoxes = (a, b) => {
          if (!a) return b;
          if (!b) return a;
          const x = Math.min(a.x, b.x);
          const y = Math.min(a.y, b.y);
          const r = Math.max(a.x + a.w, b.x + b.w);
          const bot = Math.max(a.y + a.h, b.y + b.h);
          return { x, y, w: r - x, h: bot - y };
        };

        /** Scan a preview render for non-paper ink — primary content detector. */
        const getInkContentBox = async (page, pageW, pageH) => {
          try {
            /* Small probe = big speed win; Focus only needs approximate margins. */
            const probeScale = lowMem ? 0.28 : 0.38;
            const probeVp = page.getViewport({ scale: probeScale });
            const probe = document.createElement("canvas");
            probe.width = Math.max(1, Math.floor(probeVp.width));
            probe.height = Math.max(1, Math.floor(probeVp.height));
            const ctx = probe.getContext("2d", { alpha: false, willReadFrequently: true });
            if (!ctx) return null;
            ctx.fillStyle = "#ffffff";
            ctx.fillRect(0, 0, probe.width, probe.height);
            await page.render({
              canvasContext: ctx,
              viewport: probeVp,
              intent: "display",
              background: "#ffffff",
            }).promise;
            const bounds = inkBoundsFromImageData(
              ctx.getImageData(0, 0, probe.width, probe.height)
            );
            const probeWidth = probe.width;
            const probeHeight = probe.height;
            probe.width = 0;
            probe.height = 0;
            if (!bounds) return null;
            return {
              x: (bounds.x / probeWidth) * pageW,
              y: (bounds.y / probeHeight) * pageH,
              w: (bounds.w / probeWidth) * pageW,
              h: (bounds.h / probeHeight) * pageH,
            };
          } catch {
            return null;
          }
        };

        /**
         * Contract the page to real content: strip PDF / scan paper margins.
         * Fast path: text-only when enough glyphs (skips expensive ink probe).
         */
        const getContentBox = async (page, pageNumber) => {
          const base = page.getViewport({ scale: 1 });
          const pageW = base.width;
          const pageH = base.height;
          const full = { x: 0, y: 0, w: pageW, h: pageH, pageW, pageH };
          const cacheKey = `${pageNumber || 0}:${focusProfile().id}`;
          const cached = contentBoxCache.get(cacheKey);
          if (cached) return cached;

          const textMetrics = await getTextMetrics(page, pageW, pageH);
          const textBox = textMetrics?.box || null;
          const samples = textMetrics?.sampleCount || 0;

          let box = null;
          const comicMode = focusProfile().id === "comic";
          /* Prefer text bounds when dense — avoids a second PDF render.
             Comics are art-first: always probe ink so PDF paper margins go away. */
          if (!comicMode && samples >= 12 && textBox && textBox.w < pageW * 0.96 && textBox.h < pageH * 0.96) {
            box = textBox;
          } else {
            const inkBox = await getInkContentBox(page, pageW, pageH);
            const inkFill = inkBox
              ? (inkBox.w * inkBox.h) / Math.max(1, pageW * pageH)
              : 1;
            const inkLooksFull = inkFill > (comicMode ? 0.97 : 0.82);

            if (inkBox && !inkLooksFull) {
              if (!comicMode && textBox && samples >= 8) {
                const y = Math.min(inkBox.y, textBox.y);
                const b = Math.max(inkBox.y + inkBox.h, textBox.y + textBox.h);
                box = { x: inkBox.x, y, w: inkBox.w, h: Math.max(1, b - y) };
              } else {
                box = inkBox;
              }
            } else if (!comicMode && samples >= 8 && textBox) {
              box = textBox;
            } else if (inkBox && (inkBox.w < pageW * 0.98 || inkBox.h < pageH * 0.98)) {
              box = inkBox;
            }
          }

          if (!box || box.w < pageW * 0.2 || box.h < pageH * 0.2) {
            box = full;
          }
          if (comicMode && (box.w * box.h) < pageW * pageH * 0.28) {
            box = full;
          }

          const padded = padContentBox(box, pageW, pageH);
          padded.medianTextH = textMetrics?.medianTextH || 0;
          padded.sampleCount = samples;
          contentBoxCache.set(cacheKey, padded);
          return padded;
        };

        const getReaderContentBox = async (page, pageNumber) => {
          const base = page.getViewport({ scale: 1 });
          const cacheKey = `${pageNumber || 0}:reader`;
          const cached = contentBoxCache.get(cacheKey);
          if (cached) return cached;

          const textMetrics = await getTextMetrics(page, base.width, base.height);
          const inkBox = await getInkContentBox(page, base.width, base.height);
          const candidate = textMetrics?.box || inkBox;
          if (!candidate) return getContentBox(page, pageNumber);

          /* Reader is deliberately tighter than legacy focus modes. */
          const padX = Math.min(candidate.w * 0.006, base.width * 0.008);
          const padY = Math.min(candidate.h * 0.006, base.height * 0.008);
          const box = {
            x: Math.max(0, candidate.x - padX),
            y: Math.max(0, candidate.y - padY),
            w: Math.min(base.width, candidate.x + candidate.w + padX) - Math.max(0, candidate.x - padX),
            h: Math.min(base.height, candidate.y + candidate.h + padY) - Math.max(0, candidate.y - padY),
            pageW: base.width,
            pageH: base.height,
          };
          contentBoxCache.set(cacheKey, box);
          return box;
        };

        /**
         * Find midpoints of low-ink valleys along a density profile.
         * Tuned for thin comic gutters (1–few px at probe resolution).
         */
        const findGutterSplits = (density, length, minSeg) => {
          if (length < 8) return [0, length];
          const smooth = new Float32Array(length);
          for (let i = 0; i < length; i += 1) {
            let sum = 0;
            let n = 0;
            for (let k = -3; k <= 3; k += 1) {
              const j = i + k;
              if (j >= 0 && j < length) {
                sum += density[j];
                n += 1;
              }
            }
            smooth[i] = sum / n;
          }
          let mean = 0;
          let minV = Infinity;
          for (let i = 0; i < length; i += 1) {
            mean += smooth[i];
            if (smooth[i] < minV) minV = smooth[i];
          }
          mean /= length;
          /*
            True panel gutters are nearly empty (~0–0.12 ink).
            Caption boxes are white with sparse text (~0.3–0.45) — NOT gutters.
            Old mean*0.55 threshold sliced panels through English captions.
          */
          const threshold = Math.max(0.04, Math.min(0.14, mean * 0.22));

          const rawValleys = [];
          for (let i = 2; i < length - 2; i += 1) {
            const v = smooth[i];
            if (v > threshold) continue;
            if (v <= smooth[i - 1] && v <= smooth[i + 1] && v <= smooth[i - 2] && v <= smooth[i + 2]) {
              if (!rawValleys.length || i - rawValleys[rawValleys.length - 1] >= Math.max(4, Math.floor(minSeg * 0.35))) {
                rawValleys.push(i);
              } else if (v < smooth[rawValleys[rawValleys.length - 1]]) {
                rawValleys[rawValleys.length - 1] = i;
              }
            }
          }

          const splits = [0];
          for (const v of rawValleys) {
            if (v >= minSeg && length - v >= minSeg) splits.push(v);
          }
          splits.push(length);
          return splits;
        };

        const buildGridPanels = (content, rows, cols) => {
          const panels = [];
          const cellW = content.w / cols;
          const cellH = content.h / rows;
          /* Slight vertical overlap only — keep captions; do NOT widen cells (causes L/R crop). */
          const overlapY = cellH * 0.1;
          for (let r = 0; r < rows; r += 1) {
            for (let c = 0; c < cols; c += 1) {
              const x = content.x + c * cellW;
              const y = Math.max(content.y, content.y + r * cellH - overlapY);
              const right = content.x + (c + 1) * cellW;
              const bottom = Math.min(content.y + content.h, content.y + (r + 1) * cellH + overlapY);
              panels.push({
                x,
                y,
                w: Math.max(1, right - x),
                h: Math.max(1, bottom - y),
                pageW: content.pageW,
                pageH: content.pageH,
              });
            }
          }
          return panels;
        };

        const guessComicGrid = (content) => {
          const aspect = content.w / Math.max(1, content.h);
          /*
            Portrait kids comics (Shwe Thway): panels are usually FULL-WIDTH
            horizontal strips stacked top→bottom — not a 3-column manga grid.
            Using cols>1 was cropping English/art on L/R of each strip.
          */
          if (aspect < 0.95) return { rows: 4, cols: 1 };
          if (aspect <= 1.25) return { rows: 3, cols: 2 };
          return { rows: 2, cols: 3 };
        };

        /**
         * Detect comic panels from white gutters. Returns boxes in page units,
         * ordered left→right within each row, then top→bottom (Western reading order).
         */
        const detectComicPanelsFromImageData = (imageData, pageW, pageH, contentBox) => {
          const { data, width, height } = imageData;
          const x0 = Math.max(0, Math.floor((contentBox.x / pageW) * width));
          const y0 = Math.max(0, Math.floor((contentBox.y / pageH) * height));
          const x1 = Math.min(width, Math.ceil(((contentBox.x + contentBox.w) / pageW) * width));
          const y1 = Math.min(height, Math.ceil(((contentBox.y + contentBox.h) / pageH) * height));
          const cw = x1 - x0;
          const ch = y1 - y0;
          if (cw < 24 || ch < 24) return null;

          const rowInk = new Float32Array(ch);
          /*
            Shwe Thway paper/gutters are ~RGB(253,253,253) sum≈759 — NOT pure 255.
            Old threshold (sum<765) counted gutters as ink → detection collapsed.
          */
          const isInkPixel = (r, g, b) => r < 248 || g < 248 || b < 248;
          const step = cw * ch > 180000 ? 2 : 1;
          for (let y = y0; y < y1; y += step) {
            let ink = 0;
            let samples = 0;
            for (let x = x0; x < x1; x += step) {
              const i = (y * width + x) * 4;
              samples += 1;
              if (isInkPixel(data[i], data[i + 1], data[i + 2])) ink += 1;
            }
            rowInk[y - y0] = samples ? ink / samples : 0;
            if (step > 1 && y + 1 < y1) rowInk[y - y0 + 1] = rowInk[y - y0];
          }

          const minRowH = Math.max(8, Math.floor(ch * 0.08));
          const minColW = Math.max(8, Math.floor(cw * 0.08));

          const ySplits = findGutterSplits(rowInk, ch, minRowH);
          const bands = [];
          for (let s = 0; s < ySplits.length - 1; s += 1) {
            const top = ySplits[s];
            const bot = ySplits[s + 1];
            if (bot - top >= minRowH) bands.push([top, bot]);
          }
          if (!bands.length) bands.push([0, ch]);

          const panels = [];
          for (const [top, bot] of bands) {
            const bandH = Math.max(1, bot - top);
            const colInk = new Float32Array(cw);
            /* Use mid-band (art) so caption boxes don't hide vertical gutters. */
            const yArt0 = y0 + top + Math.floor(bandH * 0.28);
            const yArt1 = y0 + top + Math.floor(bandH * 0.72);
            const artH = Math.max(1, yArt1 - yArt0);
            for (let y = yArt0; y < yArt1; y += step) {
              for (let x = x0; x < x1; x += step) {
                const i = (y * width + x) * 4;
                if (isInkPixel(data[i], data[i + 1], data[i + 2])) {
                  colInk[x - x0] += 1;
                }
              }
            }
            const rowSamples = Math.max(1, Math.ceil(artH / step));
            for (let c = 0; c < cw; c += 1) colInk[c] /= rowSamples;

            const xSplits = findGutterSplits(colInk, cw, minColW);
            let cells = [];
            for (let s = 0; s < xSplits.length - 1; s += 1) {
              const left = xSplits[s];
              const right = xSplits[s + 1];
              if (right - left >= minColW * 0.55) cells.push([left, right]);
            }

            /* Wide rows without clear V-gutters → equal 2/3 cols (L→R). */
            if (cells.length < 2) {
              const bandHpage = (bandH / ch) * contentBox.h;
              const aspect = contentBox.w / Math.max(1, bandHpage);
              const cols = aspect > 2.0 ? 3 : aspect > 1.25 ? 2 : 1;
              cells = [];
              for (let c = 0; c < cols; c += 1) {
                cells.push([
                  Math.floor((cw * c) / cols),
                  Math.floor((cw * (c + 1)) / cols),
                ]);
              }
            }

            for (const [left, right] of cells) {
              const px = contentBox.x + (left / cw) * contentBox.w;
              const py = contentBox.y + (top / ch) * contentBox.h;
              const pw = ((right - left) / cw) * contentBox.w;
              const ph = ((bot - top) / ch) * contentBox.h;
              panels.push({
                x: px,
                y: py,
                w: Math.max(1, pw),
                h: Math.max(1, ph),
                pageW,
                pageH,
              });
            }
          }

          const minArea = contentBox.w * contentBox.h * 0.04;
          const filtered = panels.filter((p) => {
            if (p.w * p.h < minArea) return false;
            const aspect = p.w / Math.max(1, p.h);
            return aspect > 0.35 && aspect < 2.8;
          });
          if (filtered.length < 4 || filtered.length > 16) return null;

          return filtered.map((p) => {
            const padX = Math.min(p.w * 0.02, contentBox.w * 0.008);
            const padY = Math.min(p.h * 0.02, contentBox.h * 0.008);
            const x = Math.max(contentBox.x, p.x - padX);
            const y = Math.max(contentBox.y, p.y - padY);
            const r = Math.min(contentBox.x + contentBox.w, p.x + p.w + padX);
            const b = Math.min(contentBox.y + contentBox.h, p.y + p.h + padY);
            return { x, y, w: r - x, h: b - y, pageW, pageH };
          });
        };

        /** Reject bogus sets (e.g. full-page + footer strip). */
        const isSanePanelSet = (panels, content) => {
          if (!panels || panels.length < 4) return false;
          const area = Math.max(1, content.w * content.h);
          for (const p of panels) {
            const a = p.w * p.h;
            if (a > area * 0.5) return false;
            if (p.h < content.h * 0.07 || p.w < content.w * 0.07) return false;
          }
          return true;
        };

        const ensurePanelsForPage = async (page, pageNumber) => {
          const cached = panelsByPage.get(pageNumber);
          if (cached?.length) return cached;

          const base = page.getViewport({ scale: 1 });
          const pageW = base.width;
          const pageH = base.height;
          const content = await getContentBox(page, pageNumber);
          content.pageW = pageW;
          content.pageH = pageH;

          /*
            Reliable reading path for magazine comics (Shwe Thway etc.):
            overlapping 3×3 (or 3×2) grid in L→R then down order.
            Gutter auto-detect is too fragile on bilingual caption layouts —
            overlap keeps full Burmese + art + English in each jump.
          */
          const { rows, cols } = guessComicGrid(content);
          const panels = buildGridPanels(content, rows, cols);

          panelsByPage.set(pageNumber, panels);
          return panels;
        };

        /** Focus region for the active view mode. */
        const getFocusBox = async (page, pageNumber) => {
          const base = page.getViewport({ scale: 1 });
          const full = {
            x: 0,
            y: 0,
            w: base.width,
            h: base.height,
            pageW: base.width,
            pageH: base.height,
          };
          const mode = activeView();

          if (mode === "Normal" || mode === "Fit" || isTopCenterMode(mode)) {
            return full;
          }

          if (isReaderMode(mode)) {
            return getReaderContentBox(page, pageNumber);
          }

          if (isComicView(mode)) {
            const content = await getContentBox(page, pageNumber);
            if (content.w * content.h < full.w * full.h * 0.28) return full;
            return content;
          }

          if (mode === "PanelJump") {
            /*
              Real gutter-based panels (uneven sizes OK), reading order:
              left → right, then next row down. Jump arrows follow that list.
              Each panel is CONTAINed so text/art is not cropped.
            */
            const panels = await ensurePanelsForPage(page, pageNumber);
            panelCount = Math.max(1, panels.length);
            if (panelIndex >= panelCount) panelIndex = panelCount - 1;
            const box = panels[panelIndex] || panels[0] || full;
            return { ...box, pageW: base.width, pageH: base.height };
          }

          /* Focus modes: ink/text bounds only — white PDF padding is discarded. */
          if (isFocusMode(mode)) {
            return getContentBox(page, pageNumber);
          }

          return full;
        };

        /**
         * Auto mode uses Reader on phone-sized screens and Normal on larger tablet screens.
         * This keeps mobile reading tight while iPad-sized displays use the wider normal layout.
         */
        const autoDetectViewMode = async (_doc) => {
          const ua = navigator.userAgent || "";
          const phoneLike = /iPhone|iPod|Android.*Mobile|Mobile/i.test(ua) || Math.min(window.innerWidth || 0, window.innerHeight || 0) <= 640;
          return phoneLike ? "Reader" : isLargeScreen() ? "Normal" : "Reader";
        };

        const ensureResolvedView = async (doc) => {
          if (configuredView !== "Auto") {
            resolvedView = configuredView;
            notifyViewMode(resolvedView);
            syncPanelChrome();
            return;
          }
          if (resolvedView) {
            notifyViewMode(resolvedView);
            syncPanelChrome();
            return;
          }
          resolvedView = await autoDetectViewMode(doc);
          notifyViewMode(resolvedView);
          syncPanelChrome();
        };

        const syncPanelChrome = () => {
          const on = activeView() === "PanelJump";
          shell.classList.toggle("is-panel-jump", on);
          syncScrollMode();
          const nav = document.getElementById("pdf-panel-nav");
          if (nav) nav.setAttribute("aria-hidden", on ? "false" : "true");
          if (!panelPrevBtn || !panelNextBtn) return;
          if (!on || panelCount < 2) {
            panelPrevBtn.classList.add("is-hidden");
            panelNextBtn.classList.add("is-hidden");
            if (panelDots) panelDots.innerHTML = "";
            return;
          }
          panelPrevBtn.classList.toggle("is-hidden", panelIndex <= 0);
          panelNextBtn.classList.toggle("is-hidden", panelIndex >= panelCount - 1);
          panelPrevBtn.disabled = panelIndex <= 0;
          panelNextBtn.disabled = panelIndex >= panelCount - 1;
          if (panelDots) {
            panelDots.innerHTML = "";
            for (let i = 0; i < panelCount; i += 1) {
              const dot = document.createElement("span");
              if (i === panelIndex) dot.className = "is-active";
              panelDots.appendChild(dot);
            }
          }
        };

        const goPanel = (next) => {
          const clamped = Math.max(0, Math.min(panelCount - 1, next));
          if (clamped === panelIndex) return;
          panelIndex = clamped;
          syncPanelChrome();
          lastLayoutKey = layoutKey();
          prunePageCache(currentPage);
          if (pdfDoc) void renderPage(currentPage);
        };

        if (panelPrevBtn) {
          panelPrevBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            goPanel(panelIndex - 1);
          });
        }
        if (panelNextBtn) {
          panelNextBtn.addEventListener("click", (e) => {
            e.preventDefault();
            e.stopPropagation();
            goPanel(panelIndex + 1);
          });
        }

        const scrollForBox = (box, cssScale, cssWidth, cssHeight) => {
          const availW = Math.max(80, wrap.clientWidth);
          const availH = Math.max(80, wrap.clientHeight);
          const edge = 6;
          const contentCssW = box.w * cssScale;
          const contentCssH = box.h * cssScale;
          const mode = activeView();
          const topCenter = isTopCenterMode(mode);

          let scrollLeft = 0;
          let shiftX = 0;
          if (topCenter) {
            /* Full page, top-center: no pan into a crop box. */
            const extra = cssWidth - availW;
            scrollLeft = extra > 0 ? extra / 2 : 0;
            shiftX = 0;
          } else {
            const sideGap = Math.min(8, Math.max(0, (availW - contentCssW) / 2));
            const contentLeft = box.x * cssScale;
            scrollLeft = Math.max(0, contentLeft - sideGap);
            const maxScrollX = Math.max(0, cssWidth - availW);
            if (scrollLeft > maxScrollX) scrollLeft = maxScrollX;
            shiftX = 0;
          }

          let scrollTop = 0;
          let shiftY = 0;
          if (topCenter) {
            scrollTop = 0;
            shiftY = 0;
          } else {
            const idealTop = box.y * cssScale - edge;
            const maxScrollY = Math.max(0, cssHeight - availH);
            scrollTop = idealTop;
            if (scrollTop < 0) {
              shiftY = -scrollTop;
              scrollTop = 0;
            } else if (scrollTop > maxScrollY) {
              shiftY = maxScrollY - scrollTop;
              scrollTop = maxScrollY;
            }
          }

          return { scrollLeft, scrollTop, shiftX, shiftY };
        };

        const computeLayout = (page, contentBox, scaleBoost = 1) => {
          const baseViewport = page.getViewport({ scale: 1 });
          const zoomFactor = Math.max(0.5, Number(pageZoom) / 100);
          const availW = Math.max(80, wrap.clientWidth);
          const availH = Math.max(80, wrap.clientHeight);
          const edge = 12;
          const box = contentBox || {
            x: 0,
            y: 0,
            w: baseViewport.width,
            h: baseViewport.height,
            pageW: baseViewport.width,
            pageH: baseViewport.height,
          };
          const mode = activeView();
          const pageW = baseViewport.width;
          const pageH = baseViewport.height;
          const large = isLargeScreen();
          const cropToContent = isReaderMode(mode);
          let readerWidth = availW;
          if (cropToContent) {
            try {
              readerWidth = Math.max(readerWidth, Number(window.parent?.innerWidth) || 0);
            } catch {
              /* Cross-origin parents cannot be measured. */
            }
          }
          /* Large screen (iPad portrait + landscape): fit initially, then honor toolbar zoom. */
          const appliedZoom = large && !largeScreenUserZoom ? 1 : zoomFactor;

          let cssScale;
          if (cropToContent) {
            const narrowReader = readerWidth <= 600;
            const readerZoom = narrowReader ? 1.35 : 1;
            cssScale = (Math.max(60, readerWidth - 8) * readerZoom) / Math.max(1, box.w);
          } else if (large && !largeScreenUserZoom && isLargeLandscape()) {
            const viewW = Math.max(60, availW - edge * 2) / pageW;
            cssScale = viewW;
          } else if (large && (isFocusMode(mode) || isComicView(mode) || mode === "Normal" || mode === "Fit")) {
            const sideInset = isFocusMode(mode) ? Math.min(4, focusProfile().sideInset) : 4;
            const viewW = Math.max(60, availW - sideInset * 2);
            cssScale = viewW / Math.max(1, box.w);
          } else if (mode === "Normal") {
            const scaleW = Math.max(60, availW - edge * 2) / pageW;
            const scaleH = Math.max(60, availH - edge * 2) / pageH;
            cssScale = Math.min(scaleW, scaleH) * appliedZoom;
          } else if (mode === "Fit") {
            cssScale = (Math.max(60, availW - edge * 2) / pageW) * appliedZoom;
          } else if (mode === "PanelJump") {
            const viewW = Math.max(60, availW - 16);
            cssScale = (viewW / Math.max(1, box.w)) * appliedZoom;
          } else if (isFocusMode(mode) || isComicView(mode)) {
            const sideInset = focusProfile().sideInset;
            const viewW = Math.max(60, availW - sideInset * 2);
            if (presetZoomPct()) {
              cssScale = (viewW / Math.max(1, box.w)) * appliedZoom;
            } else {
              /* Auto on phone: keep auto readable scale. */
              const short = Math.min(availW, availH);
              const readMul = short <= 430 ? 1.9 : 1.35;
              cssScale = ((viewW * readMul) / Math.max(1, box.w)) * appliedZoom;
            }
          } else {
            const sideInset = 4;
            const viewW = Math.max(60, availW - sideInset * 2);
            cssScale = (viewW / Math.max(1, box.w)) * appliedZoom;
          }

          const dpr = Math.max(1, window.devicePixelRatio || 1);
          /* Prefer fast first paint; still sharp enough for reading. */
          let outputScale = (lowMem
            ? Math.min(1.75, Math.max(1.25, dpr))
            : Math.min(2.25, Math.max(1.5, dpr * 1.15))) * scaleBoost;
          outputScale = Math.max(1, outputScale);

          let cssWidth = (cropToContent ? box.w : baseViewport.width) * cssScale;
          let cssHeight = (cropToContent ? box.h : baseViewport.height) * cssScale;
          let pixels = cssWidth * outputScale * cssHeight * outputScale;
          if (pixels > MAX_CANVAS_PIXELS) {
            outputScale *= Math.sqrt(MAX_CANVAS_PIXELS / pixels);
            outputScale = Math.max(1, outputScale);
          }

          const viewport = page.getViewport({
            scale: Math.max(0.35, cssScale * outputScale),
          });
          const pixelWidth = Math.max(
            1,
            Math.round((cropToContent ? box.w : baseViewport.width) * cssScale * outputScale),
          );
          const pixelHeight = Math.max(
            1,
            Math.round((cropToContent ? box.h : baseViewport.height) * cssScale * outputScale),
          );
          cssWidth = pixelWidth / outputScale;
          cssHeight = pixelHeight / outputScale;

          const focus = scrollForBox(box, cssScale, cssWidth, cssHeight);

          return {
            viewport,
            outputScale,
            cssWidth,
            cssHeight,
            pixelWidth,
            pixelHeight,
            cssScale,
            cropToContent,
            cropX: cropToContent ? box.x : 0,
            cropY: cropToContent ? box.y : 0,
            contentBox: box,
            scrollLeft: focus.scrollLeft,
            scrollTop: focus.scrollTop,
            shiftX: focus.shiftX,
            shiftY: focus.shiftY,
            key: layoutKey(),
          };
        };

        const releaseVisibleIf = (node) => {
          if (node && node.parentNode === wrap && node !== visibleCanvas && node !== visibleTextLayer) {
            try {
              node.remove();
            } catch {
              /* ignore */
            }
          }
        };

        const getOcrWorker = async () => {
          if (!window.Tesseract) {
            await new Promise((resolve, reject) => {
              const script = document.createElement("script");
              script.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
              script.onload = resolve;
              script.onerror = reject;
              document.head.appendChild(script);
            });
          }
          if (!ocrWorkerPromise) {
            ocrWorkerPromise = window.Tesseract.createWorker("eng");
          }
          return ocrWorkerPromise;
        };

        const postDictionarySelection = (text) => {
          const clean = typeof text === "string" ? text.trim() : "";
          if (!clean) return;
          try {
            window.parent?.postMessage(
              { type: "pdf-viewer:dictionary-selection", text: clean, page: currentPage },
              "*",
            );
          } catch {
            /* ignore */
          }
        };

        const setDictionaryStatus = (pageNumber, ready) => {
          if (!dictionaryStatus || pageNumber !== currentPage) return;
          dictionaryStatus.classList.toggle("is-visible", dictionaryMode && !ready);
          try {
            window.parent?.postMessage(
              { type: "pdf-viewer:dictionary-status", page: pageNumber, ready },
              "*",
            );
          } catch {
            /* ignore */
          }
        };

        document.addEventListener("selectionchange", () => {
          if (!dictionaryMode || !visibleTextLayer) return;
          const selection = window.getSelection();
          const anchor = selection?.anchorNode;
          const anchorElement = anchor instanceof Element ? anchor : anchor?.parentElement;
          if (!anchorElement?.closest(".pdf-text-layer.is-dictionary-enabled")) return;
          const text = selection?.toString().trim() || "";
          if (text) postDictionarySelection(text);
        });

        const selectWordSpan = (span) => {
          if (!(span instanceof Element)) return;
          const text = (span.textContent || "").trim();
          if (!text) return;
          const sel = window.getSelection();
          if (sel) {
            const range = document.createRange();
            range.selectNodeContents(span);
            sel.removeAllRanges();
            sel.addRange(range);
          }
          postDictionarySelection(text);
        };

        let selectionPointerStart = null;
        const finishPointerSelection = (event) => {
          if (!dictionaryMode || !selectionPointerStart) return;
          const start = selectionPointerStart;
          selectionPointerStart = null;
          const pointerTarget = document.elementFromPoint(event.clientX, event.clientY);
          const end = pointerTarget instanceof Element
            ? pointerTarget.closest(".pdf-text-layer.is-dictionary-enabled span")
            : null;
          if (!(start instanceof Element)) return;
          const existing = window.getSelection();
          if (existing?.toString().trim()) return;
          const spans = [...(visibleTextLayer?.querySelectorAll("span") || [])];
          const startIndex = spans.indexOf(start);
          const endIndex = spans.indexOf(end || start);
          if (startIndex < 0 || endIndex < 0) return;
          const range = document.createRange();
          if (startIndex <= endIndex) {
            range.setStartBefore(start);
            range.setEndAfter(end);
          } else {
            range.setStartBefore(end);
            range.setEndAfter(start);
          }
          existing?.removeAllRanges();
          existing?.addRange(range);
          postDictionarySelection(existing?.toString() || "");
        };

        document.addEventListener(
          "pointerdown",
          (event) => {
            if (!dictionaryMode || event.button !== 0) return;
            const span = event.target instanceof Element
              ? event.target.closest(".pdf-text-layer.is-dictionary-enabled span")
              : null;
            selectionPointerStart = span;
          },
          true,
        );
        document.addEventListener("pointerup", finishPointerSelection, true);
        document.addEventListener("pointercancel", () => {
          selectionPointerStart = null;
        }, true);
        document.addEventListener("click", (event) => {
          if (!dictionaryMode) return;
          const span = event.target instanceof Element
            ? event.target.closest(".pdf-text-layer.is-dictionary-enabled span")
            : null;
          if (!(span instanceof Element)) return;
          const selection = window.getSelection();
          if (selection?.toString().trim()) {
            postDictionarySelection(selection.toString());
            return;
          }
          selectWordSpan(span);
        }, true);

        const buildOcrTextLayer = async (entry) => {
          if (!entry?.canvas || !entry.textLayer || entry.hasNativeTextLayer || entry.textLayer.childElementCount) return;
          const appendWords = (words) => {
            const scaleX = entry.cssWidth / Math.max(1, entry.canvas.width);
            const scaleY = entry.cssHeight / Math.max(1, entry.canvas.height);
            for (const word of words) {
              const text = typeof word.text === "string" ? word.text.trim() : "";
              const box = word.bbox;
              if (!text || !box) continue;
              const span = document.createElement("span");
              span.textContent = text;
              span.setAttribute("tabindex", "0");
              span.style.left = `${box.x0 * entry.canvas.width * scaleX}px`;
              span.style.top = `${box.y0 * entry.canvas.height * scaleY}px`;
              span.style.fontSize = `${Math.max(10, (box.y1 - box.y0) * entry.canvas.height * scaleY)}px`;
              span.style.lineHeight = "1";
              span.style.fontFamily = "sans-serif";
              span.addEventListener("click", () => {
                if (!dictionaryMode) return;
                selectWordSpan(span);
              });
              entry.textLayer.appendChild(span);
            }
            entry.textLayer.dataset.ocr = String(words.length);
          };
          const cachedWords = ocrWordsCache.get(entry.pageNumber);
          if (cachedWords) {
            appendWords(cachedWords);
            setDictionaryStatus(entry.pageNumber, true);
            return;
          }
          let ocrPromise = ocrPromises.get(entry.pageNumber);
          if (!ocrPromise) {
            entry.textLayer.dataset.ocr = "loading";
            setDictionaryStatus(entry.pageNumber, false);
            ocrPromise = (async () => {
              const ocrCanvas = document.createElement("canvas");
              const ocrScale = Math.min(1, 1100 / Math.max(entry.canvas.width, entry.canvas.height));
              ocrCanvas.width = Math.max(1, Math.round(entry.canvas.width * ocrScale));
              ocrCanvas.height = Math.max(1, Math.round(entry.canvas.height * ocrScale));
              const ocrContext = ocrCanvas.getContext("2d", { alpha: false });
              if (!ocrContext) return [];
              ocrContext.fillStyle = "#ffffff";
              ocrContext.fillRect(0, 0, ocrCanvas.width, ocrCanvas.height);
              ocrContext.drawImage(entry.canvas, 0, 0, ocrCanvas.width, ocrCanvas.height);
              const blob = await new Promise((resolve) => {
                ocrCanvas.toBlob((value) => resolve(value || null), "image/png", 0.9);
              });
              if (!blob) return [];
              const worker = await getOcrWorker();
              const result = await worker.recognize(blob);
              const width = Math.max(1, ocrCanvas.width);
              const height = Math.max(1, ocrCanvas.height);
              return (result?.data?.words || []).map((word) => ({
                text: word.text,
                bbox: {
                  x0: word.bbox.x0 / width,
                  y0: word.bbox.y0 / height,
                  x1: word.bbox.x1 / width,
                  y1: word.bbox.y1 / height,
                },
              }));
            })();
            ocrPromises.set(entry.pageNumber, ocrPromise);
          }
          try {
            const words = await ocrPromise;
            ocrWordsCache.set(entry.pageNumber, words);
            appendWords(words);
            setDictionaryStatus(entry.pageNumber, true);
          } catch (ocrError) {
            ocrPromises.delete(entry.pageNumber);
            entry.textLayer.dataset.ocr = "failed";
            setDictionaryStatus(entry.pageNumber, true);
            console.warn("PDF English OCR failed:", ocrError);
          }
        };

        const ensureDictionaryLayer = () => {
          if (!dictionaryMode || !visibleCanvas) return;
          if (!visibleTextLayer) {
            const layer = document.createElement("div");
            layer.className = "pdf-text-layer is-dictionary-enabled";
            layer.setAttribute("aria-hidden", "true");
            layer.style.width = `${visibleCanvas.clientWidth || visibleCanvas.width}px`;
            layer.style.height = `${visibleCanvas.clientHeight || visibleCanvas.height}px`;
            layer.style.left = `${visibleCanvas.offsetLeft}px`;
            layer.style.top = `${visibleCanvas.offsetTop}px`;
            wrap.appendChild(layer);
            visibleTextLayer = layer;
          }
          if (!visibleEntry) {
            visibleEntry = {
              canvas: visibleCanvas,
              textLayer: visibleTextLayer,
              cssWidth: visibleCanvas.clientWidth || visibleCanvas.width,
              cssHeight: visibleCanvas.clientHeight || visibleCanvas.height,
            };
          } else {
            visibleEntry.textLayer = visibleTextLayer;
          }
          void buildOcrTextLayer(visibleEntry);
        };

        const focusContent = (entry) => {
          const mode = activeView();
          const topCenter = isTopCenterMode(mode);
          wrap.style.alignItems = "flex-start";
          const node = entry.canvas;
          if (node) {
            node.style.transform = "translateZ(0)";
          }
          const alignTextLayer = () => {
            if (!entry.textLayer || !node) return;
            entry.textLayer.style.left = `${node.offsetLeft}px`;
            entry.textLayer.style.top = `${node.offsetTop}px`;
          };
          const applyScroll = () => {
            const availW = Math.max(80, wrap.clientWidth);
            const extra = (entry.cssWidth || 0) - availW;
            if (topCenter) {
              wrap.style.justifyContent = extra > 0 ? "flex-start" : "center";
              wrap.scrollLeft = extra > 0 ? Math.round(extra / 2) : 0;
              wrap.scrollTop = 0;
            } else {
              wrap.style.justifyContent = "flex-start";
              wrap.scrollLeft = Math.round(entry.scrollLeft || 0);
              wrap.scrollTop = Math.round(entry.scrollTop || 0);
            }
            alignTextLayer();
          };
          applyScroll();
          requestAnimationFrame(() => {
            applyScroll();
            requestAnimationFrame(() => {
              applyScroll();
              alignTextLayer();
            });
          });
        };

        const mountEntry = (entry) => {
          const node = entry.canvas;
          if (!node) {
            console.warn("Null canvas entry - skipping mount");
            return;
          }
          // Check if canvas has actual content (not just white background)
          const hasContent = node.width > 0 && node.height > 0;
          if (!hasContent) {
