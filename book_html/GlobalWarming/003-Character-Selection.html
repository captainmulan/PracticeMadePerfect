<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Warming - Choose Your Eco Hero</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Comic Sans MS','Comic Neue',system-ui,sans-serif;background:linear-gradient(180deg,#1a2e1a 0%,#2d5016 50%,#1b4332 100%);color:#e8f5e9;min-height:100vh;overflow-x:hidden;overflow-y:auto;}
    .leaves{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(4px 4px at 40px 60px,rgba(129,199,132,0.35),transparent),radial-gradient(5px 5px at 80px 100px,rgba(165,214,167,0.25),transparent);background-size:900px 150px;animation:fall 10s linear infinite;}
    @keyframes fall{0%{transform:translateY(-100%);}100%{transform:translateY(100%);}}
    .container{max-width:640px;margin:auto;padding:16px 14px 20px;position:relative;z-index:1;}
    .header{text-align:center;margin-bottom:14px;}
    h1{font-size:28px;color:#81c784;margin-bottom:8px;}
    .subtitle{color:#a5d6a7;font-size:16px;}
    input[type="text"]{width:100%;padding:10px 12px;border:2px solid rgba(129,199,132,0.35);border-radius:16px;background:rgba(255,255,255,0.08);color:#fff;font-size:16px;font-family:inherit;margin-bottom:14px;outline:none;}
    input[type="text"]:focus{border-color:#81c784;}
    .character-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
    .character-option{background:rgba(255,255,255,0.08);border:3px solid transparent;border-radius:18px;padding:10px 4px;cursor:pointer;text-align:center;font-size:34px;transition:.2s;}
    .character-option.selected{border-color:#ffeb3b;background:rgba(255,235,59,0.15);box-shadow:0 0 24px rgba(255,235,59,0.35);}
    .character-name{font-size:12px;margin-top:6px;color:#a5d6a7;}
    .preview-section{background:rgba(255,255,255,0.08);border-radius:20px;padding:14px;text-align:center;margin-bottom:12px;border:1px solid rgba(129,199,132,0.25);}
    .preview-character{font-size:56px;margin-bottom:8px;}
    .preview-name{font-size:18px;color:#ffeb3b;font-weight:bold;}
    .nav-hint{margin-top:16px;text-align:center;font-size:13px;color:#a5d6a7;background:rgba(129,199,132,0.1);padding:10px;border-radius:10px;}
    @media (max-width:480px){h1{font-size:22px}.character-option{font-size:28px;padding:8px 2px}}
  </style>
  <script src="_global-player.js"></script>
</head>
<body class="reading-page character-select-page">
<div class="leaves"></div>
<div class="container">
  <div class="header">
    <h1>🌍 Choose Your Eco Hero!</h1>
    <div class="subtitle">Pick a character and name for your climate adventure!</div>
  </div>
  <div class="preview-section">
    <div class="preview-character" id="previewCharacter">🌍</div>
    <div class="preview-name" id="previewName">Eco Hero</div>
  </div>
  <input type="text" id="userName" placeholder="Enter your name..." value="Eco Hero" oninput="updatePreview()">
  <div class="character-grid">
    <div class="character-option selected" onclick="selectCharacter(this, '🌍', 'Earth')">🌍<div class="character-name">Earth</div></div>
    <div class="character-option" onclick="selectCharacter(this, '🌱', 'Sprout')">🌱<div class="character-name">Sprout</div></div>
    <div class="character-option" onclick="selectCharacter(this, '🦋', 'Butterfly')">🦋<div class="character-name">Butterfly</div></div>
    <div class="character-option" onclick="selectCharacter(this, '🐻', 'Bear')">🐻<div class="character-name">Bear</div></div>
    <div class="character-option" onclick="selectCharacter(this, '🐧', 'Penguin')">🐧<div class="character-name">Penguin</div></div>
    <div class="character-option" onclick="selectCharacter(this, '☀️', 'Sun')">☀️<div class="character-name">Sun</div></div>
  </div>
  <div class="nav-hint">
    <div>💡 Use the ← → arrows in the top navigation bar to go to the next chapter.</div>
    <div>💡 Use the 🏠 button in the top navigation bar to go back to the Home page.</div>
  </div>
</div>
<script>
let selectedCharacter = '🌍';
let selectedCharacterName = 'Earth';
function persistPlayer() {
  const userName = document.getElementById('userName').value.trim() || 'Eco Hero';
  GlobalPlayer.save(userName, selectedCharacter, selectedCharacterName);
}
function selectCharacter(element, character, name) {
  document.querySelectorAll('.character-option').forEach(opt => opt.classList.remove('selected'));
  element.classList.add('selected');
  selectedCharacter = character;
  selectedCharacterName = name;
  updatePreview();
}
function updatePreview() {
  persistPlayer();
  document.getElementById('previewCharacter').textContent = selectedCharacter;
  document.getElementById('previewName').textContent = document.getElementById('userName').value.trim() || 'Eco Hero';
}
updatePreview();
</script>
</body>
</html>
