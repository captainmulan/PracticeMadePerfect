<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ocean Adventure - My Aquarium</title>
  <style>
    .bubbles{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(3px 3px at 30px 50px,rgba(255,255,255,.28),transparent),radial-gradient(4px 4px at 70px 90px,rgba(255,255,255,.18),transparent);background-size:900px 150px;animation:rise 9s ease-in-out infinite;}
    @keyframes rise{0%,100%{transform:translateY(0)}50%{transform:translateY(-18px)}}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Comic Sans MS','Comic Neue',system-ui,sans-serif;background:linear-gradient(180deg,#0a1628,#1a365d,#0f4c75);color:#e0f4ff;}
    .game-shell{width:100%;max-width:100%;margin:0;position:relative;z-index:1;display:flex;flex-direction:column;height:100%;max-height:100%;overflow:hidden;padding:6px 10px 6px;box-sizing:border-box;}
    .stamp-row{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-bottom:4px;padding:5px 6px;background:rgba(0,0,0,.28);border-radius:12px;border:1px solid rgba(100,255,218,.25);max-height:calc(2 * 38px + 4px);overflow-y:auto;flex-shrink:0;-webkit-overflow-scrolling:touch;}
    .stamp-btn{width:36px;height:36px;border:2px solid rgba(100,255,218,.35);border-radius:10px;background:rgba(100,255,218,.08);font-size:20px;cursor:pointer;touch-action:manipulation;transition:.15s;flex-shrink:0;}
    .stamp-btn.selected{border-color:#ffeb3b;background:rgba(255,235,59,.18);box-shadow:0 0 16px rgba(255,235,59,.35);transform:scale(1.06);}
    .stamp-btn:active{transform:scale(.96);}
    .tool-row{display:flex;gap:6px;justify-content:center;margin-bottom:4px;flex-wrap:nowrap;flex-shrink:0;}
    .tool-btn{padding:6px 10px;border:none;border-radius:10px;background:rgba(255,255,255,.1);color:#cce7ff;font-size:12px;font-weight:bold;cursor:pointer;border:1px solid rgba(100,255,218,.3);flex:1 1 0;min-width:0;white-space:nowrap;}
    .tool-btn:active{transform:scale(.97);}
    .tool-btn.active{border-color:#ffeb3b;background:rgba(255,235,59,.18);box-shadow:0 0 10px rgba(255,235,59,.25);}
    .game-stage.eraser-mode{cursor:cell;}
    .stage-wrap{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;}
    .game-stage{position:relative;flex:1 1 auto;min-height:0;border:2px solid rgba(100,255,218,.45);border-radius:16px;overflow:hidden;background:#062035;touch-action:none;cursor:crosshair;}
    canvas{display:block;width:100%;height:100%;}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,20,36,.9);text-align:center;padding:18px;z-index:5;}
    .overlay h3{color:#64ffda;font-size:20px;margin-bottom:8px;}
    .overlay p{color:#cce7ff;font-size:14px;line-height:1.5;margin-bottom:12px;max-width:300px;}
    .btn{padding:10px 22px;border:none;border-radius:12px;background:linear-gradient(135deg,#64ffda,#00bcd4);color:#062035;font-size:15px;font-weight:bold;cursor:pointer;}
    .nav-hint{margin-top:4px;text-align:center;font-size:11px;color:#80deea;background:rgba(128,222,234,.1);padding:6px 8px;border-radius:10px;flex-shrink:0;line-height:1.4;}
    html,body{height:100%;overflow:hidden;}
    body.big-game-page{height:100%;max-height:100%;overflow:hidden;}
    @media(orientation:landscape){
      .stamp-row{max-height:44px;margin-bottom:3px;}
      .nav-hint{font-size:10px;padding:5px 6px;}
      .tool-btn{font-size:11px;padding:5px 8px;}
    }
  </style>
<script>
(function (w) {
  var BOOK = "oceanadventure";
  function key(name) { return "book:" + BOOK + ":" + name; }
  w.OceanPlayer = {
    getUserName: function () { return localStorage.getItem(key("userName")) || localStorage.getItem("userName") || "Explorer"; },
    getCharacter: function () { return localStorage.getItem(key("userCharacter")) || localStorage.getItem("userCharacter") || "🤿"; },
    getCharacterName: function () { return localStorage.getItem(key("characterName")) || localStorage.getItem("characterName") || "Diver"; },
    save: function (name, character, characterName) {
      localStorage.setItem(key("userName"), name);
      localStorage.setItem(key("userCharacter"), character);
      if (characterName != null) localStorage.setItem(key("characterName"), characterName);
      localStorage.setItem("userName", name);
      localStorage.setItem("userCharacter", character);
      if (characterName != null) localStorage.setItem("characterName", characterName);
    }
  };
})(window);
</script>
</head>
<body class="big-game-page">
<div class="bubbles"></div>
<div class="game-shell">
  <div class="stamp-row" id="stampRow">
    <button type="button" class="stamp-btn selected" data-emoji="🐠" title="Clownfish">🐠</button>
    <button type="button" class="stamp-btn" data-emoji="🐟" title="Fish">🐟</button>
    <button type="button" class="stamp-btn" data-emoji="🐡" title="Pufferfish">🐡</button>
    <button type="button" class="stamp-btn" data-emoji="🦈" title="Shark">🦈</button>
    <button type="button" class="stamp-btn" data-emoji="🐙" title="Octopus">🐙</button>
    <button type="button" class="stamp-btn" data-emoji="🦑" title="Squid">🦑</button>
    <button type="button" class="stamp-btn" data-emoji="🐢" title="Turtle">🐢</button>
    <button type="button" class="stamp-btn" data-emoji="🐬" title="Dolphin">🐬</button>
    <button type="button" class="stamp-btn" data-emoji="🐋" title="Whale">🐋</button>
    <button type="button" class="stamp-btn" data-emoji="🐳" title="Whale">🐳</button>
    <button type="button" class="stamp-btn" data-emoji="🧜‍♀️" title="Mermaid">🧜‍♀️</button>
    <button type="button" class="stamp-btn" data-emoji="🦭" title="Seal">🦭</button>
    <button type="button" class="stamp-btn" data-emoji="🦐" title="Shrimp">🦐</button>
    <button type="button" class="stamp-btn" data-emoji="🪼" title="Jellyfish">🪼</button>
    <button type="button" class="stamp-btn" data-emoji="🪸" title="Coral">🪸</button>
    <button type="button" class="stamp-btn" data-emoji="🪨" title="Rock">🪨</button>
    <button type="button" class="stamp-btn" data-emoji="🐚" title="Shell">🐚</button>
    <button type="button" class="stamp-btn" data-emoji="🌿" title="Seaweed">🌿</button>
    <button type="button" class="stamp-btn" data-emoji="⭐" title="Starfish">⭐</button>
    <button type="button" class="stamp-btn" data-emoji="🦀" title="Crab">🦀</button>
    <button type="button" class="stamp-btn" data-emoji="🌾" title="Seagrass">🌾</button>
    <button type="button" class="stamp-btn" data-emoji="🎋" title="Kelp">🎋</button>
    <button type="button" class="stamp-btn" data-emoji="🍃" title="Algae">🍃</button>
    <button type="button" class="stamp-btn" data-emoji="🪷" title="Water lily">🪷</button>
    <button type="button" class="stamp-btn" data-emoji="🌱" title="Sprout">🌱</button>
    <button type="button" class="stamp-btn" data-emoji="🪴" title="Sea plant">🪴</button>
    <button type="button" class="stamp-btn" data-emoji="🌺" title="Reef flower">🌺</button>
  </div>

  <div class="stage-wrap">
    <div class="game-stage" id="stage">
      <canvas id="gameCanvas"></canvas>
      <div class="overlay" id="startScreen">
        <h3>🐠 My Relaxing Aquarium</h3>
        <p>Pick fish, coral, or rocks — tap the tank to paint your underwater world.</p>
        <button class="btn" type="button" id="btnStart">▶️ Start Decorating</button>
      </div>
    </div>
  </div>

  <div class="tool-row">
    <button type="button" class="tool-btn" id="btnUndo">↩️ Undo</button>
    <button type="button" class="tool-btn" id="btnEraser">🧽 Eraser</button>
    <button type="button" class="tool-btn" id="btnClear">🧹 Clear Tank</button>
  </div>

  <div class="nav-hint">Press top nav: ← → next chapter. 🏠 Home page.</div>
</div>
<script>
const STORAGE_KEY = 'book:oceanadventure:intro-aquarium';
const FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const PLANT = /🪸|🪨|🐚|🌿|⭐|🌾|🎋|🍃|🪷|🌱|🪴|🌺/;
const BIG_SWIMMER = /🦈|🐬|🦭|🧜/;
const HUGE_SWIMMER = /🐋|🐳/;
let canvas, ctx, running = false, animId;
let selectedEmoji = '🐠';
let toolMode = 'stamp';
let decorations = [];
let bubbles = [];

function loadTank() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) decorations = JSON.parse(raw);
  } catch (e) { decorations = []; }
  decorations.forEach(normalizeItem);
}

function normalizeItem(d) {
  if (d.kind === 'fish') d.kind = 'swimmer';
  if (d.kind === 'coral' || d.kind === 'rock') d.kind = 'plant';
  if (!d.kind) d.kind = isPlantEmoji(d.emoji) ? 'plant' : 'swimmer';
  if (d.kind === 'swimmer') {
    if (typeof d.dir !== 'number') d.dir = Math.random() > 0.5 ? 1 : -1;
    if (typeof d.speed !== 'number') d.speed = 0.35 + Math.random() * 0.55;
  }
}

function isPlantEmoji(emoji) {
  return PLANT.test(emoji);
}

function itemSize(emoji) {
  if (isPlantEmoji(emoji)) return 26 + Math.random() * 10;
  if (HUGE_SWIMMER.test(emoji)) return 54 + Math.random() * 16;
  if (BIG_SWIMMER.test(emoji)) return 40 + Math.random() * 12;
  return 28 + Math.random() * 14;
}

function saveTank() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(decorations)); } catch (e) {}
}

function resize() {
  const stage = document.getElementById('stage');
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function initBubbles(count) {
  bubbles = [];
  for (let i = 0; i < count; i++) {
    bubbles.push({
      x: Math.random() * 400,
      y: Math.random() * 400,
      r: 1.5 + Math.random() * 3,
      speed: 0.3 + Math.random() * 0.8,
      wobble: Math.random() * Math.PI * 2,
    });
  }
}

function drawEmoji(emoji, x, y, size, flipX) {
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.font = 'bold ' + size + 'px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  if (flipX) {
    ctx.translate(x, y);
    ctx.scale(-1, 1);
    ctx.fillText(emoji, 0, 0);
  } else {
    ctx.fillText(emoji, x, y);
  }
  ctx.restore();
}

function drawTankBg(w, h, t) {
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, '#4fc3f7');
  g.addColorStop(0.35, '#0288d1');
  g.addColorStop(0.72, '#01579b');
  g.addColorStop(1, '#002171');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = 'rgba(255,255,255,0.07)';
  for (let i = 0; i < 5; i++) {
    const rx = (w * 0.15) + i * 18;
    const ry = h * 0.08 + Math.sin(t * 0.001 + i) * 6;
    ctx.beginPath();
    ctx.ellipse(w * 0.5 + (i - 2) * 40, ry, rx, 12, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  const sand = h - 42;
  ctx.fillStyle = '#c2a878';
  ctx.fillRect(0, sand, w, h - sand);
  ctx.fillStyle = 'rgba(0,0,0,0.12)';
  ctx.fillRect(0, sand, w, 6);

  bubbles.forEach(b => {
    b.y -= b.speed;
    b.x += Math.sin(t * 0.002 + b.wobble) * 0.4;
    if (b.y < -8) { b.y = h + 8; b.x = Math.random() * w; }
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath();
    ctx.arc(b.x % w, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

function decorationRenderPos(d, t) {
  const bob = Math.sin(t * 0.002 + d.phase) * (d.kind === 'swimmer' ? 4 : 1.5);
  return { x: d.x, y: d.y + bob };
}

function tickSwimmer(d, w) {
  if (typeof d.dir !== 'number') d.dir = 1;
  if (typeof d.speed !== 'number') d.speed = 0.45;
  d.x += d.speed * d.dir;
  const margin = d.size * 0.5;
  if (d.x <= margin) {
    d.x = margin;
    d.dir = 1;
  } else if (d.x >= w - margin) {
    d.x = w - margin;
    d.dir = -1;
  }
}

function updateToolUi() {
  document.getElementById('btnEraser').classList.toggle('active', toolMode === 'eraser');
  document.getElementById('stage').classList.toggle('eraser-mode', toolMode === 'eraser');
  document.querySelectorAll('.stamp-btn').forEach(b => {
    b.classList.toggle('selected', toolMode === 'stamp' && b.dataset.emoji === selectedEmoji);
  });
}

function hitDecoration(x, y) {
  const t = performance.now();
  for (let i = decorations.length - 1; i >= 0; i--) {
    const p = decorationRenderPos(decorations[i], t);
    const r = decorations[i].size * 0.55;
    const dx = x - p.x;
    const dy = y - p.y;
    if (dx * dx + dy * dy <= r * r) return i;
  }
  return -1;
}

function eraseAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const x = clientX - r.left;
  const y = clientY - r.top;
  const idx = hitDecoration(x, y);
  if (idx < 0) return;
  decorations.splice(idx, 1);
  saveTank();
}

function loop(t) {
  if (!running) return;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  drawTankBg(w, h, t);

  decorations.forEach(d => {
    if (d.kind === 'swimmer') tickSwimmer(d, w);
    const p = decorationRenderPos(d, t);
    const flip = d.kind === 'swimmer' && d.dir > 0;
    drawEmoji(d.emoji, p.x, p.y, d.size, flip);
  });

  animId = requestAnimationFrame(loop);
}

function placeAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const x = clientX - r.left;
  const y = clientY - r.top;
  if (y > r.height - 36) return;
  const plant = isPlantEmoji(selectedEmoji);
  const item = {
    emoji: selectedEmoji,
    x: x,
    y: y,
    size: itemSize(selectedEmoji),
    phase: Math.random() * Math.PI * 2,
    kind: plant ? 'plant' : 'swimmer',
  };
  if (!plant) {
    item.dir = Math.random() > 0.5 ? 1 : -1;
    item.speed = 0.35 + Math.random() * 0.55;
  }
  decorations.push(item);
  saveTank();
}

function startDecorating() {
  document.getElementById('startScreen').style.display = 'none';
  running = true;
  resize();
  loop(0);
}

document.getElementById('btnStart').onclick = startDecorating;

document.querySelectorAll('.stamp-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    toolMode = 'stamp';
    selectedEmoji = btn.dataset.emoji;
    updateToolUi();
  });
});

document.getElementById('btnEraser').onclick = () => {
  toolMode = 'eraser';
  updateToolUi();
};

document.getElementById('btnUndo').onclick = () => {
  if (!decorations.length) return;
  decorations.pop();
  saveTank();
};

document.getElementById('btnClear').onclick = () => {
  decorations = [];
  saveTank();
};

function bindTap() {
  const hit = e => {
    if (document.getElementById('startScreen').style.display !== 'none') return;
    const p = e.touches ? e.touches[0] : e;
    if (toolMode === 'eraser') eraseAt(p.clientX, p.clientY);
    else placeAt(p.clientX, p.clientY);
  };
  canvas.addEventListener('click', hit);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); hit(e); }, { passive: false });
}

loadTank();
resize();
initBubbles(24);
updateToolUi();
bindTap();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => { setTimeout(resize, 120); });

(function fitGameFrame() {
  function fit() {
    const h = window.innerHeight + 'px';
    document.documentElement.style.height = h;
    document.documentElement.style.minHeight = h;
    document.body.style.height = h;
    document.body.style.minHeight = h;
    const shell = document.querySelector('.game-shell');
    if (shell) {
      shell.style.height = h;
      shell.style.maxHeight = h;
    }
    resize();
  }
  fit();
  window.addEventListener('resize', fit);
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(fit).observe(document.documentElement);
  }
})();
</script>
</body>
</html>
