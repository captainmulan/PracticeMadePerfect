<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First 100 Myanmar Words - Word Catch Finale</title>
<link rel="stylesheet" href="_mmwords-theme.css">
<script src="_mmwords-player.js"></script>
<script src="_mmwords-data.js"></script>
<script src="_mmwords-games.js"></script>
</head>
<body>
<div class="manuscript-bg">
<div class="scroll-wrap">
  <header class="header">
    <div class="ornament-top">✦ ✦ ✦</div>
    <h1 class="page-title">Word Catch Finale</h1>
    <p class="page-subtitle">Catch words from every chapter · Score: <strong id="catch-score">0</strong></p>
  </header>

  <div class="game-section">
    <button type="button" class="game-start-btn">▶ Start catch game</button>
    <canvas id="catch-canvas" class="game-canvas"></canvas>
  </div>

  <div class="nav-hint">Move the basket with mouse or finger. Catch 12 words to finish!</div>
</div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function(){
  var all = [];
  MM_CHAPTERS.forEach(function(ch){ all = all.concat(ch.words); });
  MMGame.bootCatch({
    canvasId: 'catch-canvas',
    scoreId: 'catch-score',
    words: all,
    badge: 'Myanmar Word Hero',
    chapterId: 'finale',
    target: 12
  });
});
</script>
</body>
</html>
