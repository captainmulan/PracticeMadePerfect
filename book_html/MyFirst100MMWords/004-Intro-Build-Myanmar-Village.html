<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First 100 Myanmar Words - Build Myanmar Village</title>
  <style>
    .petals{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(4px 4px at 50px 70px,rgba(251,191,36,0.35),transparent),radial-gradient(3px 3px at 120px 40px,rgba(244,114,182,0.25),transparent);background-size:900px 150px;animation:drift 12s ease-in-out infinite;}
    @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Comic Sans MS','Comic Neue',system-ui,sans-serif;background:linear-gradient(145deg,#7DD3FC 0%,#A78BFA 50%,#F9A8D4 100%);color:#1E293B;min-height:100vh;}
    .game-shell{width:100%;max-width:100%;margin:0;padding:12px clamp(12px,3vw,32px) 10px;position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;}
    @media(min-width:768px){
      .game-shell{max-width:min(1400px,100%);padding:10px clamp(16px,3vw,40px) 8px;}
      .title{font-size:26px;margin:4px 0;}
      .game-desc{font-size:16px;margin-bottom:6px;}
      .stamp-row{margin-bottom:6px;padding:6px 8px;}
      .tool-row{margin-bottom:6px;}
      .nav-hint{margin-top:6px;padding:8px;font-size:15px;}
    }
    @media(max-width:520px){
      .stamp-btn{width:34px;height:34px;font-size:17px;border-radius:9px;}
      .stamp-row{gap:4px;padding:4px 5px;}
      .title{font-size:22px;}
      .game-desc{font-size:15px;margin-bottom:6px;}
      .tool-btn{padding:8px 12px;font-size:15px;}
      .nav-hint{font-size:14px;padding:8px;}
    }
    .title{flex-shrink:0;}
    .game-desc{flex-shrink:0;}
    .title{text-align:center;font-size:26px;color:#6D28D9;margin:6px 0 4px;}
    .game-desc{text-align:center;color:#64748B;font-size:16px;margin-bottom:8px;line-height:1.5;padding:0 8px;}
    .book-game-subtitle{font-weight:700;color:#6D28D9;font-size:17px;}
    .stamp-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:6px;padding:6px;background:rgba(255,255,255,.55);border-radius:14px;border:2px solid rgba(56,189,248,.35);flex-shrink:0;}
    .stamp-btn{width:46px;height:46px;border:2px solid rgba(56,189,248,.4);border-radius:12px;background:rgba(255,255,255,.9);font-size:24px;cursor:pointer;touch-action:manipulation;transition:.15s;}
    .stamp-btn.selected{border-color:#DB2777;background:rgba(244,114,182,.15);box-shadow:0 0 16px rgba(251,191,36,.45);transform:scale(1.06);}
    .stamp-btn:active{transform:scale(.96);}
    .tool-row{display:flex;gap:8px;justify-content:center;margin-bottom:6px;flex-wrap:wrap;flex-shrink:0;}
    .tool-btn{padding:10px 16px;border:none;border-radius:10px;background:rgba(255,255,255,.7);color:#1E293B;font-size:16px;font-weight:bold;cursor:pointer;border:1px solid rgba(56,189,248,.35);}
    .tool-btn:active{transform:scale(.97);}
    .tool-btn.active{border-color:#8B5CF6;background:rgba(167,139,250,.2);box-shadow:0 0 10px rgba(139,92,246,.25);}
    .game-stage.eraser-mode{cursor:cell;}
    .stage-wrap{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;}
    .game-stage{position:relative;flex:1 1 auto;min-height:min(52vh,420px);border:2px solid #38BDF8;border-radius:16px;overflow:hidden;background:#7CB342;touch-action:none;cursor:crosshair;}
    canvas{display:block;width:100%;height:100%;}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(30,41,59,0.75);text-align:center;padding:18px;z-index:5;}
    .overlay h3{color:#FDE68A;font-size:22px;margin-bottom:8px;}
    .overlay p{color:#F0F9FF;font-size:17px;line-height:1.6;margin-bottom:14px;max-width:420px;}
    .btn{padding:12px 26px;border:none;border-radius:12px;background:linear-gradient(135deg,#DB2777,#8B5CF6);color:#fff;font-size:17px;font-weight:bold;cursor:pointer;}
    .nav-hint{margin-top:8px;text-align:center;font-size:15px;color:#64748B;background:rgba(255,255,255,.65);padding:10px;border-radius:10px;flex-shrink:0;}
    body.big-game-page:has(.game-shell){overflow:hidden!important;height:100%!important;}
    html:has(body.big-game-page){height:100%!important;overflow:hidden!important;}
    body.big-game-page:has(.game-shell) .game-shell{min-height:100%!important;height:100%!important;display:flex!important;flex-direction:column!important;}
    body.big-game-page:has(.game-shell) .stage-wrap{flex:1 1 auto!important;min-height:0!important;}
    body.big-game-page:has(.game-shell) .game-stage{flex:1 1 auto!important;min-height:0!important;max-height:none!important;aspect-ratio:unset!important;}
  </style>
  <script src="_mmwords-player.js"></script>
</head>
<body class="big-game-page">
<div class="petals"></div>
<div class="game-shell">
  <h1 class="title">🏘️ Build Myanmar Village</h1>
  <p class="game-desc book-game-subtitle">Before we dive into chapters, let&apos;s play a fun game!</p>
  <p class="game-desc">Pick items. Tap anywhere to build your village.</p>

  <div class="stamp-row" id="stampRow">
    <button type="button" class="stamp-btn selected" data-emoji="🏠" title="House">🏠</button>
    <button type="button" class="stamp-btn" data-emoji="🛖" title="Hut">🛖</button>
    <button type="button" class="stamp-btn" data-emoji="🛕" title="Pagoda">🛕</button>
    <button type="button" class="stamp-btn" data-emoji="🌳" title="Tree">🌳</button>
    <button type="button" class="stamp-btn" data-emoji="🌴" title="Palm tree">🌴</button>
    <button type="button" class="stamp-btn" data-emoji="🌲" title="Evergreen">🌲</button>
    <button type="button" class="stamp-btn" data-emoji="🎋" title="Bamboo">🎋</button>
    <button type="button" class="stamp-btn" data-emoji="🪴" title="Plant">🪴</button>
    <button type="button" class="stamp-btn" data-emoji="🌾" title="Paddy">🌾</button>
    <button type="button" class="stamp-btn" data-emoji="🪵" title="Fence">🪵</button>
    <button type="button" class="stamp-btn" data-emoji="🌸" title="Flower">🌸</button>
    <button type="button" class="stamp-btn" data-emoji="🐘" title="Elephant">🐘</button>
    <button type="button" class="stamp-btn" data-emoji="🐃" title="Buffalo">🐃</button>
    <button type="button" class="stamp-btn" data-emoji="🐄" title="Cow">🐄</button>
    <button type="button" class="stamp-btn" data-emoji="🐕" title="Dog">🐕</button>
    <button type="button" class="stamp-btn" data-emoji="🐈" title="Cat">🐈</button>
    <button type="button" class="stamp-btn" data-emoji="🧍" title="Person">🧍</button>
    <button type="button" class="stamp-btn" data-emoji="🧍‍♀️" title="Woman">🧍‍♀️</button>
    <button type="button" class="stamp-btn" data-emoji="🌤️" title="Cloudy sky">🌤️</button>
  </div>
  <div class="tool-row">
    <button type="button" class="tool-btn" id="btnUndo">↩️ Undo</button>
    <button type="button" class="tool-btn" id="btnEraser">🧽 Eraser</button>
    <button type="button" class="tool-btn" id="btnClear">🧹 Clear Village</button>
    <span class="tool-btn" id="countLabel" style="cursor:default;">🎨 0 items</span>
  </div>

  <div class="stage-wrap">
    <div class="game-stage" id="stage">
      <canvas id="gameCanvas"></canvas>
      <div class="overlay" id="startScreen">
        <h3>🌾 Welcome to Your Village!</h3>
        <p>Pick a stamp. Tap anywhere to build.</p>
        <button class="btn" type="button" id="btnStart">▶️ Start Building</button>
      </div>
    </div>
  </div>

  <div class="nav-hint">Press top nav: ← → next chapter. 🏠 Home page.</div>
</div>
<script>
const STORAGE_KEY = 'book:myfirst100mmwords:intro-village';
const FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const GROUND_PAD = 48;
const MOBILE = /🐘|🐃|🐄|🐕|🐈/;
const BUILDING = /🏠|🛖|🛕/;
const PEOPLE = /🧍|🧍‍♀️/;
const SMALL = /🪵|🌸/;
const STATIC = /🏠|🛖|🛕|🌳|🪵|🌾|🪴|🌸|🌤️|🧍|🧍‍♀️|🎋|🌴|🌲/;
let canvas, ctx, running = false, animId;
let selectedEmoji = '🏠';
let toolMode = 'stamp';
let decorations = [];
let savedCanvasW = null;
let savedCanvasH = null;
let needsMigrate = false;

function loadVillage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (Array.isArray(data)) {
      decorations = data;
      needsMigrate = true;
      return;
    }
    decorations = data.items || [];
    savedCanvasW = data.cw || null;
    savedCanvasH = data.ch || null;
    if (decorations.some(d => d.x != null && d.xr == null)) needsMigrate = true;
  } catch (e) {
    decorations = [];
  }
  decorations.forEach(normalizeItem);
}

function saveVillage() {
  try {
    const w = canvas ? canvas.clientWidth : savedCanvasW;
    const h = canvas ? canvas.clientHeight : savedCanvasH;
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      v: 2,
      cw: w || null,
      ch: h || null,
      items: decorations
    }));
  } catch (e) {}
}

function canvasSize() {
  return {
    w: canvas ? canvas.clientWidth : 720,
    h: canvas ? canvas.clientHeight : 420
  };
}

function itemPixels(d, w, h) {
  return {
    x: d.xr * w,
    y: d.yr * h,
    size: d.sr * w
  };
}

function migrateToNormalized(w, h) {
  if (!needsMigrate) return;
  const refW = savedCanvasW || w;
  const refH = savedCanvasH || h;
  decorations.forEach(d => {
    if (d.xr != null) return;
    if (typeof d.x === 'number') {
      d.xr = d.x / refW;
      d.yr = d.y / refH;
      d.sr = d.size / refW;
      if (d.kind === 'mobile' && typeof d.speed === 'number') d.sp = d.speed / refW;
      delete d.x;
      delete d.y;
      delete d.size;
      delete d.speed;
    }
  });
  needsMigrate = false;
  saveVillage();
}

function normalizeItem(d) {
  if (d.kind === 'mobile') {
    if (typeof d.dir !== 'number') d.dir = Math.random() > 0.5 ? 1 : -1;
    if (typeof d.sp !== 'number') {
      if (typeof d.speed === 'number') d.sp = d.speed / 720;
      else d.sp = 0.00045 + Math.random() * 0.00025;
      delete d.speed;
    }
    if (d.sp > 0.001) d.sp = 0.00045 + Math.random() * 0.00025;
  }
  if (typeof d.sr !== 'number' && typeof d.size === 'number') d.sr = d.size / 720;
}

function resize() {
  const stage = document.getElementById('stage');
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  migrateToNormalized(w, h);
}

function drawEmoji(emoji, x, y, size, flipX) {
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.font = 'bold ' + size + 'px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  if (flipX) {
    ctx.translate(x, y);
    ctx.scale(-1, 1);
    ctx.fillText(emoji, 0, 0);
  } else {
    ctx.fillText(emoji, x, y);
  }
  ctx.restore();
}

function drawVillageBg(w, h) {
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.58);
  sky.addColorStop(0, '#87CEEB');
  sky.addColorStop(0.7, '#FDF8F0');
  sky.addColorStop(1, '#D4E8C8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  const sunX = w * 0.84;
  const sunY = h * 0.13;
  const sunR = Math.min(w, h) * 0.055;
  const glow = ctx.createRadialGradient(sunX, sunY, sunR * 0.3, sunX, sunY, sunR * 2.4);
  glow.addColorStop(0, 'rgba(255,235,130,0.65)');
  glow.addColorStop(1, 'rgba(255,235,130,0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(sunX, sunY, sunR * 2.4, 0, Math.PI * 2);
  ctx.fill();
  drawEmoji('☀️', sunX, sunY, sunR * 1.7);

  ctx.fillStyle = 'rgba(90,120,70,0.45)';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.5);
  ctx.lineTo(w * 0.18, h * 0.36);
  ctx.lineTo(w * 0.42, h * 0.42);
  ctx.lineTo(w * 0.68, h * 0.33);
  ctx.lineTo(w * 0.88, h * 0.4);
  ctx.lineTo(w, h * 0.48);
  ctx.lineTo(w, h * 0.62);
  ctx.lineTo(0, h * 0.58);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(70,95,55,0.35)';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.56);
  ctx.lineTo(w * 0.3, h * 0.46);
  ctx.lineTo(w * 0.62, h * 0.5);
  ctx.lineTo(w, h * 0.44);
  ctx.lineTo(w, h * 0.66);
  ctx.lineTo(0, h * 0.64);
  ctx.closePath();
  ctx.fill();

  const groundTop = h - GROUND_PAD;
  const field = ctx.createLinearGradient(0, groundTop, 0, h);
  field.addColorStop(0, '#8BC34A');
  field.addColorStop(0.45, '#689F38');
  field.addColorStop(1, '#558B2F');
  ctx.fillStyle = field;
  ctx.fillRect(0, groundTop, w, h - groundTop);

  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const y = groundTop + 10 + i * 8;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, groundTop, w, 3);
}

function itemKind(emoji) {
  if (MOBILE.test(emoji)) return 'mobile';
  return 'static';
}

function itemSizeRatio(emoji, kind) {
  const w = canvasSize().w;
  if (BUILDING.test(emoji)) return (34 + Math.random() * 8) / w;
  if (kind === 'mobile') return (22 + Math.random() * 8) / w;
  if (PEOPLE.test(emoji)) return (20 + Math.random() * 6) / w;
  if (SMALL.test(emoji)) return (18 + Math.random() * 5) / w;
  return (26 + Math.random() * 10) / w;
}

function updateCount() {
  document.getElementById('countLabel').textContent = '🎨 ' + decorations.length + ' item' + (decorations.length === 1 ? '' : 's');
}

function loop() {
  if (!running) return;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  drawVillageBg(w, h);

  decorations.forEach(d => {
    const p = itemPixels(d, w, h);
    if (d.kind === 'mobile') {
      d.xr += d.sp * d.dir;
      const margin = d.sr * 0.55;
      if (d.xr <= margin) {
        d.xr = margin;
        d.dir = 1;
      } else if (d.xr >= 1 - margin) {
        d.xr = 1 - margin;
        d.dir = -1;
      }
      const px = itemPixels(d, w, h);
      drawEmoji(d.emoji, px.x, px.y, px.size, d.dir > 0);
    } else {
      drawEmoji(d.emoji, p.x, p.y, p.size, false);
    }
  });

  animId = requestAnimationFrame(loop);
}

function updateToolUi() {
  document.getElementById('btnEraser').classList.toggle('active', toolMode === 'eraser');
  document.getElementById('stage').classList.toggle('eraser-mode', toolMode === 'eraser');
}

function hitDecoration(x, y) {
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  for (let i = decorations.length - 1; i >= 0; i--) {
    const p = itemPixels(decorations[i], w, h);
    const r = p.size * 0.48;
    const dx = x - p.x;
    const dy = y - p.y;
    if (dx * dx + dy * dy <= r * r) return i;
  }
  return -1;
}

function eraseAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const x = clientX - r.left;
  const y = clientY - r.top;
  const idx = hitDecoration(x, y);
  if (idx < 0) return;
  decorations.splice(idx, 1);
  saveVillage();
  updateCount();
}

function placeAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const w = r.width;
  const h = r.height;
  const kind = itemKind(selectedEmoji);
  const sr = itemSizeRatio(selectedEmoji, kind);
  const size = sr * w;
  const x = Math.max(size * 0.5, Math.min(w - size * 0.5, clientX - r.left));
  const y = Math.max(size * 0.5, Math.min(h - size * 0.5, clientY - r.top));
  const xr = x / w;
  const yr = y / h;

  if (kind === 'mobile') {
    decorations.push({
      emoji: selectedEmoji,
      xr: xr,
      yr: yr,
      sr: sr,
      kind: 'mobile',
      dir: Math.random() > 0.5 ? 1 : -1,
      sp: 0.00045 + Math.random() * 0.00025,
    });
  } else {
    decorations.push({
      emoji: selectedEmoji,
      xr: xr,
      yr: yr,
      sr: sr,
      kind: 'static',
    });
  }
  saveVillage();
  updateCount();
}

function startBuilding() {
  document.getElementById('startScreen').style.display = 'none';
  running = true;
  loop();
}

document.getElementById('btnStart').onclick = startBuilding;

document.querySelectorAll('.stamp-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    toolMode = 'stamp';
    document.querySelectorAll('.stamp-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedEmoji = btn.dataset.emoji;
    updateToolUi();
  });
});

document.getElementById('btnEraser').onclick = () => {
  toolMode = 'eraser';
  document.querySelectorAll('.stamp-btn').forEach(b => b.classList.remove('selected'));
  updateToolUi();
};

document.getElementById('btnUndo').onclick = () => {
  if (!decorations.length) return;
  decorations.pop();
  saveVillage();
  updateCount();
};

document.getElementById('btnClear').onclick = () => {
  decorations = [];
  saveVillage();
  updateCount();
};

function bindTap() {
  const hit = e => {
    if (document.getElementById('startScreen').style.display !== 'none') return;
    const p = e.touches ? e.touches[0] : e;
    if (toolMode === 'eraser') eraseAt(p.clientX, p.clientY);
    else placeAt(p.clientX, p.clientY);
  };
  canvas.addEventListener('click', hit);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); hit(e); }, { passive: false });
}

loadVillage();
resize();
updateCount();
updateToolUi();
bindTap();
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => { setTimeout(resize, 120); });

(function fitGameFrame() {
  function fit() {
    const h = window.innerHeight + 'px';
    document.documentElement.style.height = h;
    document.body.style.height = h;
    const shell = document.querySelector('.game-shell');
    if (shell) shell.style.minHeight = h;
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
