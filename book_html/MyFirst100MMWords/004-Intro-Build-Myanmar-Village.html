<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First 100 Myanmar Words - Build Myanmar Village</title>
  <style>
    .petals{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(4px 4px at 50px 70px,rgba(201,162,39,0.22),transparent),radial-gradient(3px 3px at 120px 40px,rgba(139,37,37,0.15),transparent);background-size:900px 150px;animation:drift 12s ease-in-out infinite;}
    @keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Comic Sans MS','Comic Neue',Georgia,system-ui,sans-serif;background:linear-gradient(180deg,#87CEEB,#FDF8F0 45%,#C9E4CA 70%,#6B8E4E);color:#2C1810;min-height:100vh;}
    .game-shell{max-width:720px;margin:0 auto;padding:10px;position:relative;z-index:1;display:flex;flex-direction:column;min-height:100vh;}
    .title{text-align:center;font-size:24px;color:#8B2525;margin:6px 0 4px;}
    .game-desc{text-align:center;color:#5C4033;font-size:14px;margin-bottom:8px;line-height:1.5;padding:0 8px;}
    .stamp-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px;padding:8px;background:rgba(74,14,14,0.12);border-radius:14px;border:1px solid rgba(201,162,39,0.35);}
    .stamp-btn{width:52px;height:52px;border:2px solid rgba(201,162,39,0.45);border-radius:14px;background:rgba(253,248,240,0.85);font-size:28px;cursor:pointer;touch-action:manipulation;transition:.15s;}
    .stamp-btn.selected{border-color:#8B2525;background:rgba(139,37,37,0.12);box-shadow:0 0 16px rgba(201,162,39,0.45);transform:scale(1.06);}
    .stamp-btn:active{transform:scale(.96);}
    .tool-row{display:flex;gap:8px;justify-content:center;margin-bottom:8px;flex-wrap:wrap;}
    .tool-btn{padding:8px 14px;border:none;border-radius:10px;background:rgba(139,37,37,0.12);color:#2C1810;font-size:13px;font-weight:bold;cursor:pointer;border:1px solid rgba(201,162,39,0.4);}
    .tool-btn:active{transform:scale(.97);}
    .stage-wrap{flex:1 1 auto;min-height:0;display:flex;align-items:stretch;}
    .game-stage{position:relative;flex:1 1 auto;min-height:min(52vh,420px);border:2px solid rgba(201,162,39,0.55);border-radius:16px;overflow:hidden;background:#7CB342;touch-action:none;cursor:crosshair;}
    canvas{display:block;width:100%;height:100%;}
    .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(44,24,16,0.88);text-align:center;padding:18px;z-index:5;}
    .overlay h3{color:#E8C547;font-size:22px;margin-bottom:8px;}
    .overlay p{color:#FDF8F0;font-size:14px;line-height:1.55;margin-bottom:14px;max-width:320px;}
    .btn{padding:11px 24px;border:none;border-radius:12px;background:linear-gradient(135deg,#C9A227,#8B2525);color:#FDF8F0;font-size:15px;font-weight:bold;cursor:pointer;}
    .nav-hint{margin-top:10px;text-align:center;font-size:13px;color:#5C4033;background:rgba(201,162,39,0.15);padding:10px;border-radius:10px;flex-shrink:0;}
    body.big-game-page:has(.game-shell){overflow:hidden!important;height:100%!important;}
    html:has(body.big-game-page){height:100%!important;overflow:hidden!important;}
    body.big-game-page:has(.game-shell) .game-shell{min-height:100%!important;height:100%!important;display:flex!important;flex-direction:column!important;}
    body.big-game-page:has(.game-shell) .stage-wrap{flex:1 1 auto!important;min-height:0!important;}
    body.big-game-page:has(.game-shell) .game-stage{flex:1 1 auto!important;min-height:0!important;max-height:none!important;aspect-ratio:unset!important;}
  </style>
  <script src="_mmwords-player.js"></script>
</head>
<body class="big-game-page">
<div class="petals"></div>
<div class="game-shell">
  <h1 class="title">🏘️ Build Myanmar Village</h1>
  <p class="game-desc">Pick items. Tap anywhere to build your village.</p>

  <div class="stamp-row" id="stampRow">
    <button type="button" class="stamp-btn selected" data-emoji="🏠" title="House">🏠</button>
    <button type="button" class="stamp-btn" data-emoji="🛖" title="Hut">🛖</button>
    <button type="button" class="stamp-btn" data-emoji="🛕" title="Pagoda">🛕</button>
    <button type="button" class="stamp-btn" data-emoji="🌳" title="Tree">🌳</button>
    <button type="button" class="stamp-btn" data-emoji="🪵" title="Fence">🪵</button>
    <button type="button" class="stamp-btn" data-emoji="🌴" title="Palm tree">🌴</button>
    <button type="button" class="stamp-btn" data-emoji="🌾" title="Paddy">🌾</button>
    <button type="button" class="stamp-btn" data-emoji="🐘" title="Elephant">🐘</button>
    <button type="button" class="stamp-btn" data-emoji="🧒" title="Child">🧒</button>
    <button type="button" class="stamp-btn" data-emoji="🐃" title="Buffalo">🐃</button>
    <button type="button" class="stamp-btn" data-emoji="🐄" title="Cow">🐄</button>
    <button type="button" class="stamp-btn" data-emoji="👨‍👩‍👧" title="Family">👨‍👩‍👧</button>
    <button type="button" class="stamp-btn" data-emoji="🌲" title="Evergreen">🌲</button>
    <button type="button" class="stamp-btn" data-emoji="👦" title="Boy">👦</button>
    <button type="button" class="stamp-btn" data-emoji="🌸" title="Flower">🌸</button>
    <button type="button" class="stamp-btn" data-emoji="🪴" title="Plant">🪴</button>
    <button type="button" class="stamp-btn" data-emoji="🎋" title="Bamboo">🎋</button>
    <button type="button" class="stamp-btn" data-emoji="🐕" title="Dog">🐕</button>
    <button type="button" class="stamp-btn" data-emoji="☀️" title="Sun">☀️</button>
  </div>
  <div class="tool-row">
    <button type="button" class="tool-btn" id="btnUndo">↩️ Undo</button>
    <button type="button" class="tool-btn" id="btnClear">🧹 Clear Village</button>
    <span class="tool-btn" id="countLabel" style="cursor:default;">🎨 0 items</span>
  </div>

  <div class="stage-wrap">
    <div class="game-stage" id="stage">
      <canvas id="gameCanvas"></canvas>
      <div class="overlay" id="startScreen">
        <h3>🌾 Welcome to Your Village!</h3>
        <p>Pick a stamp. Tap anywhere to build.</p>
        <button class="btn" type="button" id="btnStart">▶️ Start Building</button>
      </div>
    </div>
  </div>

  <div class="nav-hint">Press top nav: ← → next chapter. 🏠 Home page.</div>
</div>
<script>
const STORAGE_KEY = 'book:myfirst100mmwords:intro-village';
const FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const GROUND_PAD = 48;
const MOBILE = /🐘|🐃|🐄|🐕/;
const BUILDING = /🏠|🛖|🛕/;
const PEOPLE = /👨‍👩‍👧|🧒|👦/;
const STATIC = /🏠|🛖|🛕|🌳|🪵|🌾|🪴|🌸|☀️|👨‍👩‍👧|🧒|👦|🎋|🌴|🌲/;
let canvas, ctx, running = false, animId;
let selectedEmoji = '🏠';
let decorations = [];

function loadVillage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) decorations = JSON.parse(raw);
  } catch (e) { decorations = []; }
  decorations.forEach(normalizeItem);
}

function saveVillage() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(decorations)); } catch (e) {}
}

function groundY(h) {
  return h - GROUND_PAD + 10;
}

function normalizeItem(d) {
  if (d.kind === 'mobile') {
    if (typeof d.dir !== 'number') d.dir = Math.random() > 0.5 ? 1 : -1;
    if (typeof d.speed !== 'number') d.speed = 0.55 + Math.random() * 0.35;
  }
}

function resize() {
  const stage = document.getElementById('stage');
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  const w = stage.clientWidth;
  const h = stage.clientHeight;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function drawEmoji(emoji, x, y, size, flipX) {
  ctx.save();
  ctx.globalAlpha = 1;
  ctx.font = 'bold ' + size + 'px ' + FONT;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = '#ffffff';
  if (flipX) {
    ctx.translate(x, y);
    ctx.scale(-1, 1);
    ctx.fillText(emoji, 0, 0);
  } else {
    ctx.fillText(emoji, x, y);
  }
  ctx.restore();
}

function drawVillageBg(w, h) {
  const sky = ctx.createLinearGradient(0, 0, 0, h * 0.58);
  sky.addColorStop(0, '#87CEEB');
  sky.addColorStop(0.7, '#FDF8F0');
  sky.addColorStop(1, '#D4E8C8');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  ctx.fillStyle = 'rgba(90,120,70,0.45)';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.5);
  ctx.lineTo(w * 0.18, h * 0.36);
  ctx.lineTo(w * 0.42, h * 0.42);
  ctx.lineTo(w * 0.68, h * 0.33);
  ctx.lineTo(w * 0.88, h * 0.4);
  ctx.lineTo(w, h * 0.48);
  ctx.lineTo(w, h * 0.62);
  ctx.lineTo(0, h * 0.58);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = 'rgba(70,95,55,0.35)';
  ctx.beginPath();
  ctx.moveTo(0, h * 0.56);
  ctx.lineTo(w * 0.3, h * 0.46);
  ctx.lineTo(w * 0.62, h * 0.5);
  ctx.lineTo(w, h * 0.44);
  ctx.lineTo(w, h * 0.66);
  ctx.lineTo(0, h * 0.64);
  ctx.closePath();
  ctx.fill();

  const groundTop = h - GROUND_PAD;
  const field = ctx.createLinearGradient(0, groundTop, 0, h);
  field.addColorStop(0, '#8BC34A');
  field.addColorStop(0.45, '#689F38');
  field.addColorStop(1, '#558B2F');
  ctx.fillStyle = field;
  ctx.fillRect(0, groundTop, w, h - groundTop);

  ctx.strokeStyle = 'rgba(255,255,255,0.1)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const y = groundTop + 10 + i * 8;
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(w, y);
    ctx.stroke();
  }

  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, groundTop, w, 3);
}

function itemKind(emoji) {
  if (MOBILE.test(emoji)) return 'mobile';
  return 'static';
}

function itemSize(emoji, kind) {
  if (BUILDING.test(emoji)) return 34 + Math.random() * 8;
  if (kind === 'mobile') return 22 + Math.random() * 8;
  if (PEOPLE.test(emoji)) return 20 + Math.random() * 6;
  return 26 + Math.random() * 10;
}

function updateCount() {
  document.getElementById('countLabel').textContent = '🎨 ' + decorations.length + ' item' + (decorations.length === 1 ? '' : 's');
}

function loop() {
  if (!running) return;
  const w = canvas.clientWidth;
  const h = canvas.clientHeight;
  drawVillageBg(w, h);

  decorations.forEach(d => {
    if (d.kind === 'mobile') {
      d.x += d.speed * d.dir;
      const margin = d.size * 0.55;
      if (d.x <= margin) {
        d.x = margin;
        d.dir = 1;
      } else if (d.x >= w - margin) {
        d.x = w - margin;
        d.dir = -1;
      }
      drawEmoji(d.emoji, d.x, d.y, d.size, d.dir > 0);
    } else {
      drawEmoji(d.emoji, d.x, d.y, d.size, false);
    }
  });

  animId = requestAnimationFrame(loop);
}

function placeAt(clientX, clientY) {
  const r = canvas.getBoundingClientRect();
  const w = r.width;
  const h = r.height;
  const kind = itemKind(selectedEmoji);
  const size = itemSize(selectedEmoji, kind);
  const x = Math.max(size * 0.5, Math.min(w - size * 0.5, clientX - r.left));
  const y = Math.max(size * 0.5, Math.min(h - size * 0.5, clientY - r.top));

  if (kind === 'mobile') {
    decorations.push({
      emoji: selectedEmoji,
      x: x,
      y: y,
      size: size,
      kind: 'mobile',
      dir: Math.random() > 0.5 ? 1 : -1,
      speed: 0.55 + Math.random() * 0.35,
    });
  } else {
    decorations.push({
      emoji: selectedEmoji,
      x: x,
      y: y,
      size: size,
      kind: 'static',
    });
  }
  saveVillage();
  updateCount();
}

function startBuilding() {
  document.getElementById('startScreen').style.display = 'none';
  running = true;
  loop();
}

document.getElementById('btnStart').onclick = startBuilding;

document.querySelectorAll('.stamp-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.stamp-btn').forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
    selectedEmoji = btn.dataset.emoji;
  });
});

document.getElementById('btnUndo').onclick = () => {
  if (!decorations.length) return;
  decorations.pop();
  saveVillage();
  updateCount();
};

document.getElementById('btnClear').onclick = () => {
  decorations = [];
  saveVillage();
  updateCount();
};

function bindTap() {
  const hit = e => {
    if (document.getElementById('startScreen').style.display !== 'none') return;
    const p = e.touches ? e.touches[0] : e;
    placeAt(p.clientX, p.clientY);
  };
  canvas.addEventListener('click', hit);
  canvas.addEventListener('touchstart', e => { e.preventDefault(); hit(e); }, { passive: false });
}

loadVillage();
resize();
updateCount();
bindTap();
window.addEventListener('resize', resize);

(function fitGameFrame() {
  function fit() {
    const h = window.innerHeight + 'px';
    document.documentElement.style.height = h;
    document.body.style.height = h;
    const shell = document.querySelector('.game-shell');
    if (shell) shell.style.minHeight = h;
  }
  fit();
  window.addEventListener('resize', fit);
})();
</script>
</body>
</html>
