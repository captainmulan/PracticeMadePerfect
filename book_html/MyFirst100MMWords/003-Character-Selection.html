<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My First 100 Myanmar Words - Character Selection</title>
<link rel="stylesheet" href="_mmwords-theme.css">
<script src="_mmwords-player.js"></script>
</head>
<body>
<div class="manuscript-bg">
<div class="scroll-wrap">
  <header class="header">
    <div class="ornament-top">✦ ✦ ✦</div>
    <h1 class="page-title">Choose Your Learner</h1>
    <p class="page-subtitle">Pick a character and enter your name</p>
  </header>

  <div class="card">
    <input type="text" id="userName" placeholder="Your name..." maxlength="20" aria-label="Your name">
    <div class="character-grid" id="charGrid">
      <div class="character-option selected" data-char="🧒" data-name="Learner"><div>🧒</div><div class="character-name">Learner</div></div>
      <div class="character-option" data-char="👧" data-name="Aye"><div>👧</div><div class="character-name">Aye</div></div>
      <div class="character-option" data-char="👦" data-name="Min"><div>👦</div><div class="character-name">Min</div></div>
      <div class="character-option" data-char="🧒🏻" data-name="Khin"><div>🧒🏻</div><div class="character-name">Khin</div></div>
      <div class="character-option" data-char="👧🏻" data-name="May"><div>👧🏻</div><div class="character-name">May</div></div>
      <div class="character-option" data-char="👦" data-name="Aung"><div>👦</div><div class="character-name">Aung</div></div>
    </div>
    <div class="preview-section">
      <div class="preview-character" id="previewChar">🧒</div>
      <div class="preview-name" id="previewLabel">Explorer</div>
    </div>
    <button type="button" class="btn-primary" id="saveBtn">Start learning</button>
  </div>

  <div class="nav-hint">Your name and character appear in every quiz and game in this book.</div>
</div>
</div>
<script>
(function(){
  var BOOK = "myfirst100mmwords";
  function key(name) { return "book:" + BOOK + ":" + name; }

  var selected = { char: "🧒", name: "Learner" };

  function persistPlayer() {
    var name = document.getElementById("userName").value.trim() || "Explorer";
    MMPlayer.save(name, selected.char, selected.name);
    document.getElementById("previewChar").textContent = selected.char;
    document.getElementById("previewLabel").textContent = name;
  }

  function selectOption(el) {
    document.querySelectorAll(".character-option").forEach(function(c){ c.classList.remove("selected"); });
    el.classList.add("selected");
    selected.char = el.getAttribute("data-char");
    selected.name = el.getAttribute("data-name");
    persistPlayer();
  }

  document.querySelectorAll(".character-option").forEach(function(el){
    el.addEventListener("click", function(){ selectOption(el); });
  });

  document.getElementById("userName").addEventListener("input", persistPlayer);

  document.getElementById("saveBtn").addEventListener("click", function(){
    var name = document.getElementById("userName").value.trim() || "Explorer";
    MMPlayer.save(name, selected.char, selected.name);
    alert("Welcome, " + name + "! Use ← → to continue.");
  });

  function loadSavedPlayer() {
    var savedName = localStorage.getItem(key("userName"));
    var savedChar = localStorage.getItem(key("userCharacter"));
    var savedCharName = localStorage.getItem(key("characterName"));
    if (savedName) document.getElementById("userName").value = savedName;
    if (savedChar) {
      selected.char = savedChar;
      document.querySelectorAll(".character-option").forEach(function(el){
        var match = el.getAttribute("data-char") === savedChar &&
          (!savedCharName || el.getAttribute("data-name") === savedCharName);
        el.classList.toggle("selected", match);
        if (match) selected.name = el.getAttribute("data-name");
      });
    }
    persistPlayer();
  }

  loadSavedPlayer();
})();
</script>
</body>
</html>
