<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mudra holiday trip to Myanmar — Quiz 5</title>
<link rel="stylesheet" href="_speak-theme.css">
<style>
.container{width:100%;max-width:100%;margin:0;padding:16px clamp(16px,3vw,40px) 28px;position:relative;}
.quiz-card{display:block;background:#fff;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 4px 18px rgba(56,189,248,.15);}
.quiz-q{font-weight:800;margin-bottom:12px}
.quiz-options{display:grid;gap:10px}
.quiz-option{padding:12px;border-radius:12px;border:2px solid rgba(56,189,248,.15);background:#f0f9ff;font-weight:700;}
</style>
</head>
<body class="quiz-page">
<div class="manuscript-bg"><div class="container">
  <div class="top-bar"><h1>❓ Quiz 5 · Chapters 9–10</h1></div>
  <p style="font-weight:700;color:#64748b;margin-bottom:8px;">Listen and choose the matching English + Myanmar label.</p>
  <div class="quiz-card">
    <div class="quiz-q">1. Which word did you hear?</div>
    <div class="quiz-options">
      <button class="quiz-option">Garden (ဥယ်ာဥ်)</button>
      <button class="quiz-option">School (စာသင်ကျောင်း)</button>
      <button class="quiz-option">Market (ဈေး)</button>
      <button class="quiz-option">Home (အိမ်)</button>
    </div>
  </div>
  <div class="quiz-card">
    <div class="quiz-q">2. Which sentence did you hear?</div>
    <div class="quiz-options">
      <button class="quiz-option">The children ran to the garden.</button>
      <button class="quiz-option">The bus left the town.</button>
      <button class="quiz-option">They bought mangoes.</button>
      <button class="quiz-option">Dinner is ready.</button>
    </div>
  </div>
</div></div>
</body>
</html>
